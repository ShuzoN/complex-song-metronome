<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>全画面モード モック（横画面 v3）— Complex Song Metronome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;600;700&family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ===== 既存 index.html と同じデザイントークン ===== */
  :root{
    --bg:#A9B0A2; --panel:#F5F4EF; --ink:#191C18; --rule:#C7CABC;
    --signal:#C4362A; --brass:#8E7132; --dim:#6E7268;
    --display:"Big Shoulders Display","Zen Kaku Gothic New",sans-serif;
    --mono:"DM Mono",ui-monospace,monospace;
    --body:"Zen Kaku Gothic New",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}
  html,body{height:100%}
  body{background:var(--ink);color:var(--panel);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}

  /* ===================================================================
     横画面・練習HUD 静的モック v3（見た目のみ）。
       上   = セクションタイムライン（曲のどこを演奏中か）
       中央 = リズムパターンのフォーカス帯（分数・線入り）＋ pulse
       下   = 操作系を集約（◁◁ / 一時停止 / ▷▷）
     本実装では TransportView / TapPadView / VideoPadService を再利用。
     =================================================================== */

  .hud{position:fixed;inset:0;background:var(--ink);color:var(--panel);overflow:hidden;
    display:flex;flex-direction:column}

  /* 左半分／右半分の大きなタップ領域（矢印ボタンに加えて）。上部バー・下部操作は z:2 で前面 */
  .tapzone{position:absolute;top:calc(env(safe-area-inset-top) + clamp(40px,11dvh,52px));bottom:0;width:50%;z-index:1;
    border:none;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;
    display:flex;align-items:center;justify-content:center}
  .tapzone.left{left:0} .tapzone.right{right:0}
  .tapzone:active{background:rgba(245,244,239,.05)}
  .tapzone .tz-hint{font-family:var(--mono);font-size:clamp(20px,6dvh,26px);color:rgba(245,244,239,.14);transition:color 120ms ease}
  .tapzone.left .tz-hint{margin-right:auto;padding-left:clamp(6px,2vw,18px)}
  .tapzone.right .tz-hint{margin-left:auto;padding-right:clamp(6px,2vw,18px)}
  .tapzone:active .tz-hint{color:rgba(245,244,239,.4)}

  /* ---- 上：セクションタイムライン ---- */
  .top{position:relative;z-index:2;flex:0 0 auto;display:flex;align-items:center;gap:clamp(8px,1.6vw,12px);
    padding:calc(env(safe-area-inset-top) + clamp(8px,2.4dvh,12px)) clamp(12px,2vw,16px) 0 clamp(12px,2vw,18px)}
  .rep{font-family:var(--mono);font-size:clamp(11px,3dvh,13px);color:var(--signal);
    font-variant-numeric:tabular-nums;letter-spacing:.04em;white-space:nowrap}
  .rep .of{color:rgba(245,244,239,.4)}
  .rep .u{color:rgba(245,244,239,.45);font-size:.8em;margin-left:2px}

  .timeline{position:relative;flex:1 1 auto;display:flex;gap:3px;height:clamp(24px,7.5dvh,32px)}
  .seg{position:relative;flex-grow:1;flex-basis:0;min-width:26px;display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(245,244,239,.2);background:rgba(245,244,239,.03);overflow:hidden;
    font-family:var(--body);font-size:clamp(9px,2.7dvh,11px);letter-spacing:.02em;color:rgba(245,244,239,.5);white-space:nowrap}
  .seg.done{opacity:.5}
  .seg.cur{border-color:var(--signal);background:rgba(196,54,42,.16);color:#FFF;font-weight:700}
  /* 現在セクション内の進捗フィル（済み分） */
  .seg .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(196,54,42,.32);z-index:0}
  .seg .lbl{position:relative;z-index:1;padding:0 6px;overflow:hidden;text-overflow:ellipsis}

  .close{flex:0 0 auto;width:40px;height:30px;border:1px solid rgba(245,244,239,.4);
    background:rgba(245,244,239,.06);color:var(--panel);font-family:var(--mono);font-size:17px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .close:active{transform:translate(1px,1px)}

  /* ---- 中央：フォーカス帯＋pulse ----
     すべて dvh/clamp でビューポート連動（低い/狭い横画面でも重ならない） */
  .center{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;
    gap:clamp(8px,2.6dvh,16px);min-height:0;overflow:hidden}

  .strip-wrap{flex:0 0 auto;position:relative;display:flex;align-items:center;
    height:clamp(84px,34dvh,150px);overflow:hidden;
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 18%,#000 82%,transparent 100%);
            mask-image:linear-gradient(to right,transparent 0,#000 18%,#000 82%,transparent 100%)}
  .track{display:flex;align-items:center;gap:clamp(8px,1.8vw,14px);padding:0 50vw;
    transition:transform 320ms cubic-bezier(.22,.61,.36,1);will-change:transform}

  .fbar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(245,244,239,.26);background:rgba(245,244,239,.04);
    width:clamp(42px,15dvh,66px);height:clamp(42px,16dvh,64px);
    font-size:clamp(13px,4.4dvh,20px);transition:width .26s ease,height .26s ease,font-size .26s ease,opacity .26s ease,background .26s ease}
  .fbar.done{opacity:.32}
  .fbar.now{width:clamp(80px,30dvh,112px);height:clamp(80px,30dvh,112px);
    font-size:clamp(26px,9.5dvh,40px);
    background:var(--signal);border-color:var(--signal);box-shadow:0 6px 20px rgba(196,54,42,.32)}

  /* 分数（線入り）: num / line / den を縦積み。サイズはタイルの font-size(em)基準 */
  .fr{display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:var(--mono);font-variant-numeric:tabular-nums;color:rgba(245,244,239,.6);line-height:1}
  .fr .num,.fr .den{font-size:1em}
  .fr .line{width:1em;height:0;border-top:.09em solid rgba(245,244,239,.4);margin:.16em 0}
  .fbar.now .fr{color:#FFF}
  .fbar.now .fr .line{border-top-color:rgba(255,255,255,.85)}

  /* pulse */
  .pulse{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.8dvh,10px);padding:0 20px}
  /* rep（周回）と meter を pulse と同列（拍ドットの下の1行）に並べる */
  .pulse-line{display:flex;align-items:baseline;justify-content:center;gap:clamp(6px,1.6vw,10px);flex-wrap:wrap}
  .sep{font-family:var(--mono);font-size:clamp(10px,2.8dvh,12px);color:rgba(245,244,239,.3)}
  .meter{font-family:var(--mono);font-size:clamp(10px,2.8dvh,12px);letter-spacing:.1em;color:rgba(245,244,239,.5)}
  .meter i{font-style:normal;color:var(--brass)}
  .beats{display:flex;flex-wrap:wrap;gap:clamp(8px,2.2vw,12px);justify-content:center;align-items:center;max-width:82vw}
  .beat{width:clamp(10px,2.6dvh,15px);height:clamp(10px,2.6dvh,15px);
    border:1.5px solid rgba(245,244,239,.45);border-radius:50%;
    transition:background 60ms linear,transform 60ms linear}
  .beat.first{border-color:var(--brass);box-shadow:inset 0 0 0 2.5px rgba(142,113,50,.32)}
  .beat.on{background:var(--signal);border-color:var(--signal);transform:scale(1.4)}
  .beat.first.on{background:var(--brass);border-color:var(--brass);box-shadow:none}

  /* ---- 下：操作系を集約 ---- */
  .controls{position:relative;z-index:2;flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:clamp(18px,5vw,30px);
    padding:clamp(4px,1.4dvh,8px) 16px calc(env(safe-area-inset-bottom) + clamp(8px,2.6dvh,14px))}
  .ctl{display:flex;flex-direction:column;align-items:center;gap:clamp(3px,1dvh,5px);
    background:transparent;border:none;color:var(--panel);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .ctl-glyph{display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);letter-spacing:-.04em;line-height:1;color:rgba(245,244,239,.92)}
  .ctl-sub{font-family:var(--mono);font-size:clamp(9px,2.6dvh,10px);letter-spacing:.1em;color:rgba(245,244,239,.5)}
  .ctl.seek .ctl-glyph{font-size:clamp(22px,7dvh,30px)}
  .ctl:active .ctl-glyph{opacity:.6}
  /* 中央＝一時停止/再開（枠つきの大きめボタン） */
  .ctl.play{gap:clamp(4px,1.2dvh,6px)}
  .ctl.play .ctl-glyph{width:clamp(46px,15dvh,66px);height:clamp(46px,15dvh,66px);border-radius:50%;
    border:1.5px solid rgba(245,244,239,.5);background:rgba(245,244,239,.05);
    transition:transform 90ms ease,background 120ms ease,border-color 120ms ease}
  .ctl.play:active .ctl-glyph{transform:scale(.93)}
  .hud.is-paused .ctl.play .ctl-glyph{border-color:var(--signal);background:rgba(196,54,42,.2);color:#FFF}
  /* 一時停止の二本線 / 再開の三角（絵文字を使わず図形で描画。サイズはボタン連動） */
  .bars2{display:flex;gap:clamp(4px,1.4dvh,6px)}
  .bars2 span{width:clamp(4px,1.4dvh,6px);height:clamp(17px,5.4dvh,24px);background:currentColor;display:block}
  .tri{width:0;height:0;border-style:solid;
    border-width:clamp(9px,2.7dvh,13px) 0 clamp(9px,2.7dvh,13px) clamp(15px,4.5dvh,22px);
    border-color:transparent transparent transparent currentColor;margin-left:clamp(3px,1dvh,4px)}

  /* シークフラッシュ（＋10秒 等）— 既存 .tap-flash 相当 */
  .flash{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-size:72px;font-weight:700;color:#FFF;letter-spacing:.02em;
    text-shadow:0 2px 16px rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity 140ms ease}
  .flash.show{opacity:1;transition:opacity 60ms ease}

  /* ===== モック操作用デモバー（本番には無い） ===== */
  .demo-bar{position:fixed;left:10px;top:50%;transform:translateY(-50%);z-index:30;
    display:flex;flex-direction:column;gap:6px;align-items:stretch;background:rgba(25,28,24,.8);border:1px solid rgba(245,244,239,.22);padding:7px}
  .demo-bar span{font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:rgba(245,244,239,.45);text-transform:uppercase;text-align:center}
  .demo-bar button{font-family:var(--mono);font-size:10px;color:var(--panel);background:rgba(245,244,239,.08);border:1px solid rgba(245,244,239,.3);padding:5px 8px;cursor:pointer;white-space:nowrap}
  .demo-bar button:active{transform:translateY(1px)}

  /* 縦向き時の回転案内（本実装の回転ガードのイメージ） */
  .rotate-hint{position:fixed;inset:0;z-index:40;background:var(--ink);color:rgba(245,244,239,.7);
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:var(--mono);font-size:13px;letter-spacing:.1em}
  .rotate-hint .ic{font-size:44px}
  @media (orientation:portrait){ .rotate-hint{display:flex} }
  @media (prefers-reduced-motion:reduce){.beat,.ctl,.fbar,.track,.flash{transition:none}}
  :focus-visible{outline:2px solid var(--signal);outline-offset:2px}
</style>
</head>
<body>

<div class="hud" id="hud">

  <!-- 左半分＝5秒戻す／右半分＝5秒送る（下部の矢印に加えた大きなタップ領域） -->
  <button class="tapzone left" id="tapL" aria-label="タップで5秒戻す"><span class="tz-hint">◁</span></button>
  <button class="tapzone right" id="tapR" aria-label="タップで5秒送る"><span class="tz-hint">▷</span></button>

  <!-- 上：セクションタイムライン -->
  <div class="top">
    <div class="timeline" id="timeline"><!-- セクションはJSで生成 --></div>
    <button class="close" aria-label="全画面を解除">✕</button>
  </div>

  <!-- 中央：フォーカス帯＋pulse -->
  <div class="center">
    <div class="strip-wrap">
      <div class="track" id="track"><!-- 小節タイルはJSで生成 --></div>
    </div>
    <div class="pulse">
      <div class="beats" id="beats"><!-- 拍ドットはJSで生成 --></div>
      <div class="pulse-line">
        <span class="rep"><span id="repNow">7</span><span class="of"> / 9</span><span class="u">周</span></span>
        <span class="sep">·</span>
        <span class="meter"><i id="meterSig">7/8</i> · <span id="meterName">八分音符</span></span>
      </div>
    </div>
  </div>

  <!-- 下：操作系を集約 -->
  <div class="controls">
    <button class="ctl seek" aria-label="5秒ずつ戻す">
      <span class="ctl-glyph">◁◁</span>
      <span class="ctl-sub">5秒戻す</span>
    </button>
    <button class="ctl play" id="play" aria-label="一時停止・再開">
      <span class="ctl-glyph" id="playGlyph"><span class="bars2"><span></span><span></span></span></span>
      <span class="ctl-sub" id="playSub">一時停止</span>
    </button>
    <button class="ctl seek" aria-label="5秒ずつ送る">
      <span class="ctl-glyph">▷▷</span>
      <span class="ctl-sub">5秒送る</span>
    </button>
  </div>

  <div class="flash" id="flash">＋10秒</div>
</div>

<div class="rotate-hint"><div class="ic">⟳</div><div>横向きにしてください</div></div>

<!-- モック操作用（本番には無い） -->
<div class="demo-bar">
  <span>demo</span>
  <button id="btnBar">小節を進める</button>
  <button id="btnBeat">拍を進める</button>
  <button id="btnPause">一時停止</button>
  <button id="btnFlash">シーク表示</button>
</div>

<script>
  /* モックの状態切替デモ専用。本番では TransportView.highlight / setBeatDot /
     paintBeats・TapPadView などが担当します。 */
  var NOTE_NAME = {2:"二分音符",4:"四分音符",8:"八分音符",16:"十六分音符"};
  var F = function(n,d){ return {num:n,den:d}; };

  // 曲＝セクション（リズムグループ）の並び。各セクションが小節列を持つ。
  var SECTIONS = [
    { name:"Aメロ",  bars:[F(4,4),F(4,4),F(4,4),F(4,4),F(4,4),F(7,8),F(8,8),F(4,4),F(6,8)] },
    { name:"サビ前", bars:[F(4,4),F(4,4)] },
    { name:"サビ1",  bars:[F(4,4),F(4,4),F(4,4),F(4,4),F(4,4),F(4,4),F(7,8),F(4,4),F(4,4),F(4,4),F(4,4),F(4,4)] },
    { name:"Bメロ",  bars:[F(4,4),F(4,4),F(4,4),F(4,4)] }
  ];

  // 全小節を平坦化（各小節に所属セクションindexを付与）
  var allBars = [];
  SECTIONS.forEach(function(s,si){ s.bars.forEach(function(b){ allBars.push({num:b.num,den:b.den,si:si}); }); });

  var timelineEl = document.getElementById('timeline');
  var track = document.getElementById('track');
  var beatsEl = document.getElementById('beats');
  var meterSig = document.getElementById('meterSig');
  var meterName = document.getElementById('meterName');
  var hud = document.getElementById('hud');
  var playSub = document.getElementById('playSub');
  var playGlyph = document.getElementById('playGlyph');
  var flash = document.getElementById('flash');

  var curBar = 5;   // 全体での現在小節index（Aメロの7/8）
  var curBeat = 0;
  var paused = false;

  // --- タイムライン生成（セクション幅＝小節数に比例） ---
  var segEls = [];
  SECTIONS.forEach(function(s,si){
    var seg = document.createElement('div');
    seg.className = 'seg';
    seg.style.flexGrow = s.bars.length;
    seg.innerHTML = '<div class="fill" style="width:0"></div><div class="lbl">'+s.name+'</div>';
    timelineEl.appendChild(seg);
    segEls.push(seg);
  });

  // --- 小節タイル生成 ---
  allBars.forEach(function(b,i){
    var el = document.createElement('div');
    el.className = 'fbar';
    el.setAttribute('data-bi', i);
    el.innerHTML = '<div class="fr"><span class="num">'+b.num+'</span><span class="line"></span><span class="den">'+b.den+'</span></div>';
    track.appendChild(el);
  });
  var tiles = Array.prototype.slice.call(track.children);

  function renderBar(){
    var cur = allBars[curBar];
    // タイル状態
    tiles.forEach(function(el,i){
      el.classList.toggle('now', i === curBar);
      el.classList.toggle('done', i < curBar);
    });
    // 現在小節を中央へ
    var el = tiles[curBar];
    var center = track.parentElement.clientWidth / 2;
    var barCenter = el.offsetLeft + el.offsetWidth / 2;
    track.style.transform = 'translateX(' + (center - barCenter) + 'px)';

    // タイムライン状態
    segEls.forEach(function(seg,si){
      seg.classList.toggle('cur', si === cur.si);
      seg.classList.toggle('done', si < cur.si);
      var fill = seg.querySelector('.fill');
      if (si < cur.si) fill.style.width = '100%';
      else if (si > cur.si) fill.style.width = '0%';
      else {
        // 現在セクション内の進捗
        var s = SECTIONS[si];
        var start = 0; for (var k=0;k<si;k++) start += SECTIONS[k].bars.length;
        var within = curBar - start;
        fill.style.width = Math.round((within / s.bars.length) * 100) + '%';
      }
    });

    // pulse
    meterSig.textContent = cur.num + '/' + cur.den;
    meterName.textContent = NOTE_NAME[cur.den] || '';
    curBeat = 0;
    paintBeats(cur.num);
  }
  function paintBeats(n){
    beatsEl.innerHTML = '';
    for (var i=0;i<n;i++){
      var b = document.createElement('div');
      b.className = 'beat' + (i===0?' first':'') + (i===curBeat?' on':'');
      beatsEl.appendChild(b);
    }
  }
  function stepBeat(){
    var dots = beatsEl.children; if (!dots.length) return;
    dots[curBeat].classList.remove('on');
    curBeat = (curBeat + 1) % dots.length;
    dots[curBeat].classList.add('on');
  }
  function togglePause(){
    paused = !paused;
    hud.classList.toggle('is-paused', paused);
    playSub.textContent = paused ? '再開' : '一時停止';
    playGlyph.innerHTML = paused ? '<span class="tri"></span>'
                                 : '<span class="bars2"><span></span><span></span></span>';
  }

  document.getElementById('btnBar').addEventListener('click', function(){
    curBar = (curBar + 1) % allBars.length; renderBar();
  });
  document.getElementById('btnBeat').addEventListener('click', stepBeat);
  document.getElementById('btnPause').addEventListener('click', togglePause);
  document.getElementById('play').addEventListener('click', togglePause);
  var flashTimer = null;
  function showFlash(text){
    flash.textContent = text; flash.classList.add('show');
    if (flashTimer) clearTimeout(flashTimer);
    flashTimer = setTimeout(function(){ flash.classList.remove('show'); }, 650);
  }
  document.getElementById('btnFlash').addEventListener('click', function(){ showFlash('＋10秒'); });
  // 左半分／右半分タップ（デモ：フラッシュ表示。本番は VideoPadService.seekBy を呼ぶ）
  document.getElementById('tapL').addEventListener('click', function(){ showFlash('−5秒'); });
  document.getElementById('tapR').addEventListener('click', function(){ showFlash('＋5秒'); });

  window.addEventListener('resize', renderBar);
  renderBar();
</script>
</body>
</html>
