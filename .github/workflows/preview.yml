name: PR Preview

# プルリクエストごとに gh-pages の pr-preview/pr-<番号>/ へプレビューを配信し、
# PR にプレビュー URL をコメントする。PR がクローズ/マージされたら自動で削除する。

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  # deploy.yml と共有し、gh-pages への書き込みを直列化（マージ時のレース対策）。
  # 連続 push でのプレビュー再ビルドはキャンセルせずキューに積む
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll

      - name: Deploy / update / remove PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
