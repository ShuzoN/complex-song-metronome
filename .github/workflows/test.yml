name: Test

# PR ごと・main への push ごとに、既存の単体テストと E2E／インテグレーションテストを走らせる。
# アプリ本体（index.html）はビルドしない。pnpm はテストの道具（Playwright）を入れるためだけに使う。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm run test:unit

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E / integration tests
        run: pnpm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
