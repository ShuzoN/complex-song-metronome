# パートの並び：A（2小節 ×2）→ B（1小節のフィル）、拍子2つのグループ、ドラムのないグループ
version: 1
kind: metronome.sequence
name: parts
tempo: 120
groups:
  - name: Aメロ
    repeat: 5
    pattern: [4/4]
    drums:
      - span: 2
        repeat: 2
        hits:
          ride: [0, 1, 2, 3, 4, 5, 6, 7]
          snare: [1, 3, 5, 7]
          kick: [0, 2.5, 4, 6.5]
      - span: 1
        hits:
          snare: [0, 0.5, 1, 1.5]
          tom_hi: [2]
          floor: [3]
          crash: [3.5]
  - name: ブリッジ
    repeat: 2
    pattern: [4/4]
  - name: イントロ
    repeat: 2
    pattern: [7/8, 3/4]
    drums:
      - span: 1
        hits:
          snare: [2, 5, 8]
          kick: [0, 3, 7, 7.5]
