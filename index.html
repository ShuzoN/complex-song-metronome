<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シーケンス1 — メトロノーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;600;700&family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#A9B0A2; --panel:#F5F4EF; --ink:#191C18; --rule:#C7CABC;
    --signal:#C4362A; --brass:#8E7132; --dim:#6E7268;
    --display:"Big Shoulders Display","Zen Kaku Gothic New",sans-serif;
    --mono:"DM Mono",ui-monospace,monospace;
    --body:"Zen Kaku Gothic New",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}   /* display 指定を持つ要素でも hidden を効かせる */
  body{
    min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--body);
    display:flex;align-items:center;justify-content:center;padding:24px 16px;
    -webkit-font-smoothing:antialiased;
  }
  .device{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--ink);box-shadow:7px 7px 0 rgba(25,28,24,.20)}

  /* header */
  .head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--ink)}
  .wordmark{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
  .status{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--dim)}
  .lamp{width:9px;height:9px;border:1px solid var(--ink);border-radius:50%}
  body.running .lamp{background:var(--signal);border-color:var(--signal)}
  body.running .status{color:var(--ink)}

  /* tempo */
  .readout{padding:22px 18px 6px;text-align:center}
  .bpm-line{display:flex;align-items:baseline;justify-content:center;gap:10px}
  .bpm-note{font-family:var(--mono);font-size:15px;color:var(--brass);align-self:center;padding-top:6px}
  .bpm{font-family:var(--display);font-weight:700;font-size:clamp(88px,25vw,132px);line-height:.78;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .bpm-unit{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--dim)}
  .term{margin-top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--brass)}

  .scale{padding:18px 18px 4px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;cursor:pointer}
  input[type=range]:focus{outline:none}
  input[type=range]::-webkit-slider-runnable-track{height:3px;background:linear-gradient(to right,var(--signal) var(--p,29%),var(--rule) var(--p,29%))}
  input[type=range]::-moz-range-track{height:3px;background:var(--rule)}
  input[type=range]::-moz-range-progress{height:3px;background:var(--signal)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:20px;margin-top:-9px;background:var(--signal);border:1px solid var(--ink);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
  input[type=range]::-moz-range-thumb{width:24px;height:20px;border:1px solid var(--ink);background:var(--signal);border-radius:0;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
  .ticks{position:relative;height:22px;margin-top:6px}
  .tick{position:absolute;top:0;transform:translateX(-50%);text-align:center}
  .tick i{display:block;width:1px;height:5px;background:var(--rule);margin:0 auto 3px}
  .tick span{font-family:var(--mono);font-size:9.5px;color:#7A7E73}

  button{font-family:var(--mono);color:var(--ink);cursor:pointer}
  .step{min-width:46px;height:40px;padding:0 6px;background:var(--panel);border:1px solid var(--ink);font-size:12px}
  .step:hover{background:#EAE9E2}
  .step:active{transform:translate(1px,1px)}
  .step:disabled{opacity:.28;cursor:default;transform:none}
  :focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .steps{display:flex;justify-content:center;gap:6px;padding:8px 18px 0;flex-wrap:wrap}
  .steps .gap{width:10px}
  form.entry{display:flex;justify-content:center;align-items:center;gap:8px;padding:14px 18px 16px}
  form.entry label{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--dim)}
  input[type=number]{width:82px;height:40px;text-align:center;font-family:var(--mono);font-size:15px;color:var(--ink);background:#FFF;border:1px solid var(--ink);border-radius:0}
  .apply{height:40px;padding:0 14px;background:var(--ink);color:var(--panel);border:1px solid var(--ink);font-size:12px}

  /* youtube */
  .yt{border-top:1px solid var(--ink);padding:14px 14px 15px}
  .yt-top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .yt-hint{flex:1;font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.04em;text-align:right}
  .yt-row{display:flex;gap:6px}
  .yt-row input{flex:1;min-width:0;height:36px;padding:0 8px;font-family:var(--mono);font-size:12px;color:var(--ink);background:#FFF;border:1px solid var(--ink);border-radius:0}
  .yt-row input:focus{outline:none;border-color:var(--signal)}
  .yt-row .step{height:36px;min-width:52px}
  .yt-count{margin-left:auto;font-family:var(--mono);font-size:15px;color:var(--brass);font-variant-numeric:tabular-nums;letter-spacing:.04em}
  .yt-stage{position:relative;width:100%;aspect-ratio:16/9;margin-top:10px;background:#0D0F0D;border:1px solid var(--ink)}
  .yt-stage > *{position:absolute;inset:0;width:100%;height:100%;border:0}
  .yt-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
  .yt-sync{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--dim);cursor:pointer}
  .yt-sync input{accent-color:var(--signal);width:14px;height:14px}
  .yt-clear{height:26px;min-width:auto;padding:0 8px;font-size:10.5px;background:var(--panel);border:1px solid var(--rule)}
  .yt-clear:hover{border-color:var(--signal);color:var(--signal)}
  .yt-acts{display:flex;gap:6px}
  .yt-msg{margin-top:8px;font-family:var(--mono);font-size:10.5px;line-height:1.7;color:var(--brass);white-space:pre-line}
  .yt-msg.bad{color:var(--signal)}

  /* sequence header */
  .seq-head{border-top:1px solid var(--ink);padding:13px 14px 0}
  .seq-top{display:flex;align-items:center;gap:10px}
  .seq-name{
    display:block;width:100%;margin:5px 0 0;padding:2px 0 6px;
    font-family:var(--body);font-size:16px;font-weight:500;color:var(--ink);
    background:transparent;border:none;border-bottom:1px solid var(--rule);border-radius:0;
  }
  .seq-name:hover{border-bottom-color:#9AA095}
  .seq-name:focus{outline:none;border-bottom-color:var(--signal)}
  .seq-name::placeholder{color:#A7ABA0}
  .seq-name:disabled{color:var(--ink);border-bottom-color:var(--rule);opacity:.75}
  .seq-sum{flex:1;font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:.06em;text-align:right}
  .hist{display:flex;gap:4px}
  .hist button{width:30px;height:26px;border:1px solid var(--rule);background:var(--panel);font-size:13px;line-height:1;display:grid;place-items:center}
  .hist button:hover:not(:disabled){border-color:var(--ink);background:#EAE9E2}
  .hist button:disabled{opacity:.25;cursor:default}
  .hist button.wide{width:auto;padding:0 8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em}
  .hist button.wide.open{background:var(--ink);color:var(--panel);border-color:var(--ink)}

  .hist label.wide{display:inline-flex;align-items:center;justify-content:center;height:26px;padding:0 8px;border:1px solid var(--rule);background:var(--panel);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;cursor:pointer}
  .hist label.wide:hover{border-color:var(--ink);background:#EAE9E2}
  .file-input{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .file-input:focus-visible + label.wide{outline:2px solid var(--signal);outline-offset:2px}
  .io-msg{margin:6px 0 0;font-family:var(--mono);font-size:10.5px;line-height:1.6;color:var(--brass);white-space:pre-line}
  .io-msg.bad{color:var(--signal)}
  body.dropping .device{outline:3px dashed var(--signal);outline-offset:4px}

  /* シーケンス先頭の空白（リード） */
  .lead-wrap{padding:10px 14px 0}
  .lead{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:8px 9px;border:1px dashed var(--rule);background:#FFF}
  .lead.counting{border-color:var(--brass);border-style:solid}
  .lead.counting::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brass)}
  .lead.na{opacity:.4}
  .lead input{width:82px;height:32px;text-align:right;padding:0 8px;font-family:var(--mono);font-size:14px;color:var(--ink);background:#FFF;border:1px solid var(--rule);border-radius:0;font-variant-numeric:tabular-nums}
  .lead input:focus{outline:none;border-color:var(--ink)}
  .lead input:disabled{background:#EDECE6;color:#9A9E93}
  .lead .unit{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .lead-count{margin-left:auto;font-family:var(--mono);font-size:15px;color:var(--brass);font-variant-numeric:tabular-nums;letter-spacing:.04em}
  .lead-sep{width:1px;height:20px;background:var(--rule);margin:0 2px}
  .rec{height:28px;padding:0 10px;border:1px solid var(--signal);background:#F6DCD7;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--signal)}
  .rec:hover:not(:disabled){background:#F0CBC4}
  .rec:disabled{opacity:.32;cursor:default}
  .rec.on{background:var(--signal);border-color:var(--signal);color:#FFF}
  .rec.on:hover:not(:disabled){background:#A62A20;border-color:#A62A20}
  .g-at.hit{color:var(--signal)}

  /* rhythm groups */
  .groups{padding:10px 14px 4px;display:flex;flex-direction:column;gap:8px}
  .g-actions{display:flex;gap:4px;flex:none}
  .group{position:relative;border:1px solid var(--rule);background:#FFF;transition:border-color 120ms}
  .group:not(.active){cursor:pointer}
  .group:not(.active):hover{border-color:#9AA095}
  .groups.locked .group{cursor:default}
  .groups.locked .group:hover{border-color:var(--rule)}
  .groups.locked .group.playing:hover{border-color:var(--rule)}
  .group.active{border-color:var(--ink)}
  .group.playing::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--signal)}
  .group.dragging{z-index:5;box-shadow:5px 5px 0 rgba(25,28,24,.22);border-color:var(--ink)}
  .group.drop-before{box-shadow:inset 0 3px 0 var(--signal)}
  .group.drop-after{box-shadow:inset 0 -3px 0 var(--signal)}

  .g-head{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:8px 9px}
  .handle{width:24px;height:30px;flex:none;border:1px solid var(--rule);background:var(--panel);color:var(--dim);font-size:11px;line-height:1;display:grid;place-items:center;cursor:grab;touch-action:none}
  .handle:active{cursor:grabbing}
  .handle:disabled{opacity:.3;cursor:default}
  .g-name{flex:1 1 110px;min-width:0;height:30px;font-family:var(--body);font-size:13px;color:var(--ink);background:#FFF;border:1px solid var(--rule);border-radius:0;padding:0 7px}
  .g-name:focus{border-color:var(--ink);outline:none}
  .g-title{flex:1 1 90px;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .g-times{font-family:var(--mono);font-size:11.5px;color:var(--brass);white-space:nowrap;letter-spacing:.04em}
  .group.playing .g-times{color:var(--signal)}

  .g-sub{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:0 9px 9px 41px}
  .g-sub .g-times{margin-left:auto;font-size:12px}
  .chip{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);padding:2px 6px;background:#FAF9F5;color:var(--dim)}
  .chip.now{background:var(--signal);border-color:var(--signal);color:var(--panel)}
  .chip.none{border-style:dashed}

  .g-body{border-top:1px dashed var(--rule);padding:10px 9px 11px}
  .g-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
  .g-label{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  .g-reps{display:flex;align-items:center;gap:6px}
  .g-reps .x{font-family:var(--display);font-size:20px;color:var(--brass);line-height:1}
  .g-reps input{width:58px;height:32px;font-size:13px}
  .mini{width:28px;height:28px;background:transparent;border:1px solid var(--rule);font-size:11px;line-height:1;display:grid;place-items:center;color:var(--ink)}
  .mini:hover:not(:disabled){background:#EFEEE7;border-color:var(--ink)}
  .mini:disabled{opacity:.25;cursor:default}
  .mini.kill:hover:not(:disabled){background:var(--signal);color:var(--panel);border-color:var(--signal)}

  .g-cue{display:flex;align-items:center;gap:4px;flex:none}
  .g-cue .grab{width:28px;height:28px;padding:0;font-size:11px;line-height:1;background:var(--panel);border:1px solid var(--rule);color:var(--signal)}
  .g-cue .grab:hover:not(:disabled){border-color:var(--signal);color:var(--signal);background:#F6EAE8}
  .g-cue .grab:disabled{opacity:.28;cursor:default}
  .g-cue .nudge{width:22px;height:28px;padding:0;font-size:11px;line-height:1;background:var(--panel);border:1px solid var(--rule);color:var(--dim)}
  .g-cue .nudge:hover{border-color:var(--brass);color:var(--brass);background:#F7F3E9}
  .g-cue .nudge:active{transform:translateY(1px)}
  .g-cue .nudge:disabled{opacity:.25;cursor:default}
  .g-at{font-family:var(--mono);font-size:11px;color:var(--brass);white-space:nowrap;letter-spacing:.02em;min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
  .g-at.none{color:#A7ABA0}

  .bars{display:flex;flex-direction:column;gap:4px}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 3px 3px 8px;border:1px solid var(--rule);background:#FCFBF7}
  .bar.now{border-color:var(--signal);background:#FBF0EE}
  .bar-sig{font-family:var(--mono);font-size:14px;letter-spacing:.06em}
  .bar-sig em{font-style:normal;color:var(--brass);padding:0 2px}
  .bar-ctl{display:flex;gap:3px}
  .empty{font-size:11.5px;line-height:1.7;color:var(--dim);padding:1px 0 3px}

  .g-add{display:flex;align-items:center;gap:6px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--rule)}
  select{height:34px;padding:0 6px;min-width:62px;font-family:var(--mono);font-size:14px;color:var(--ink);background:#FFF;border:1px solid var(--ink);border-radius:0}
  .slash{font-family:var(--display);font-size:22px;color:var(--brass)}
  .g-add .step{height:34px;min-width:56px}

  .addgroup{display:block;width:calc(100% - 28px);margin:6px 14px 14px;height:40px;background:transparent;border:1px dashed var(--ink);font-size:12px;letter-spacing:.06em}
  .addgroup:hover:not(:disabled){background:#EAE9E2}
  .addgroup:disabled{opacity:.3;cursor:default}

  .pulse{display:flex;align-items:baseline;gap:8px;padding:0 18px 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--dim)}
  .pulse b{font-weight:500;color:var(--ink)}
  .pulse i{font-style:normal;color:var(--brass)}
  .beats{display:flex;flex-wrap:wrap;gap:7px;padding:0 18px 20px;min-height:13px}
  .beat{width:13px;height:13px;border:1px solid var(--ink);border-radius:50%;transition:background 60ms linear,transform 60ms linear}
  .beat.first{border-color:var(--brass);box-shadow:inset 0 0 0 2px rgba(142,113,50,.28)}
  .beat.on{background:var(--signal);border-color:var(--signal);transform:scale(1.35)}
  .beat.first.on{background:var(--brass);border-color:var(--brass);box-shadow:none}

  body.waiting .lamp{background:var(--brass);border-color:var(--brass)}

  .transport{display:grid;grid-template-columns:1.1fr 1fr 1fr;border-top:1px solid var(--ink)}
  .start{height:60px;border:none;font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:0 3px;line-height:1.35}
  .start.primary{background:var(--ink);color:var(--panel)}
  .start.secondary{background:var(--panel);color:var(--ink);border-left:1px solid var(--ink)}
  .start.on{background:var(--signal);color:var(--panel)}
  .start:disabled{opacity:.35;cursor:default}
  .start:not(:disabled):active{transform:translateY(1px)}
  @media (prefers-reduced-motion:reduce){.beat{transition:none}}
</style>
</head>
<body>

<main class="device">
  <div class="head">
    <div class="wordmark">Metronome</div>
    <div class="status"><span class="lamp"></span><span id="statusText">停止中</span></div>
  </div>

  <section class="readout">
    <div class="bpm-line"><span class="bpm-note">♩ =</span><span class="bpm" id="bpmView">120</span><span class="bpm-unit">BPM</span></div>
    <div class="term" id="termView">Allegro</div>
  </section>

  <section class="scale">
    <input type="range" id="tempoRange" min="50" max="250" step="1" value="120" aria-label="テンポ（BPM）">
    <div class="ticks" id="ticks"></div>
  </section>

  <div class="steps">
    <button class="step" data-delta="-10" type="button">−10</button>
    <button class="step" data-delta="-5" type="button">−5</button>
    <button class="step" data-delta="-1" type="button">−1</button>
    <span class="gap"></span>
    <button class="step" data-delta="1" type="button">＋1</button>
    <button class="step" data-delta="5" type="button">＋5</button>
    <button class="step" data-delta="10" type="button">＋10</button>
  </div>

  <form class="entry" id="tempoForm">
    <label for="tempoInput">直接入力</label>
    <input type="number" id="tempoInput" min="50" max="250" step="1" value="120" inputmode="numeric">
    <button class="apply" type="submit">設定</button>
  </form>

  <section class="yt">
    <div class="yt-top">
      <span class="g-label">同時再生</span>
      <span class="yt-hint">YouTube のURLを貼ると、再生ボタンで動画と一緒に鳴ります</span>
    </div>
    <div class="yt-row">
      <input type="url" id="ytUrl" inputmode="url" spellcheck="false"
             placeholder="https://www.youtube.com/watch?v=..." aria-label="YouTube のURL">
      <button class="step" id="ytLoad" type="button">読込</button>
    </div>
    <div class="yt-stage" id="ytStage" hidden><div id="ytFrame"></div></div>
    <div class="yt-foot" id="ytFoot" hidden>
      <label class="yt-sync"><input type="checkbox" id="ytSync" checked><span>メトロノームと同時に再生</span></label>
      <span class="yt-acts">
        <button class="step yt-clear" id="ytOpen" type="button" hidden>別タブで開いて同時に開始</button>
        <button class="step yt-clear" id="ytClear" type="button">動画を外す</button>
      </span>
    </div>
    <p class="yt-msg" id="ytMsg" hidden></p>
  </section>

  <div class="seq-head">
    <div class="seq-top">
      <span class="g-label">シーケンス</span>
      <span class="seq-sum" id="seqSum"></span>
      <span class="hist">
        <button id="undoBtn" type="button" aria-label="元に戻す" title="元に戻す（Ctrl/⌘+Z）">↶</button>
        <button id="redoBtn" type="button" aria-label="やり直す" title="やり直す（Ctrl/⌘+Shift+Z）">↷</button>
        <button id="saveBtn" class="wide" type="button" title="YAMLファイルに保存">保存</button>
        <button id="loadBtn" class="wide" type="button" title="YAMLファイルを読み込む" hidden>読込</button>
        <input type="file" id="ioFile" class="file-input">
        <label class="wide" for="ioFile" id="ioFileLabel" title="YAMLファイルを読み込む">読込</label>
      </span>
    </div>
    <input class="seq-name" id="seqName" type="text" value="シーケンス1"
           placeholder="シーケンス名" aria-label="シーケンス名" maxlength="60">
    <p class="io-msg" id="ioMsg" role="status" hidden></p>
  </div>
  <div class="lead-wrap">
    <div class="lead" id="lead">
      <span class="g-label">開始までの空白</span>
      <input type="number" id="prerollInput" min="0" max="60" step="0.01" value="0.00"
             inputmode="decimal" aria-label="開始までの空白（秒）" title="全体再生のときだけ効きます">
      <span class="unit">秒</span>
      <span class="lead-sep"></span>
      <span class="g-label">全体レック</span>
      <button class="rec" id="recBtn" type="button" title="動画を先頭から流し、各リズムグループの位置を記録します">● REC</button>
      <span class="lead-count" id="prerollCount" hidden></span>
    </div>
  </div>

  <section class="groups" id="groups"></section>
  <button class="addgroup" id="addGroupBtn" type="button">＋ リズムグループを追加</button>

  <div class="pulse" id="pulseView"></div>
  <div class="beats" id="beats" aria-hidden="true"></div>

  <div class="transport">
    <button class="start primary" id="startAllBtn" type="button">全体再生</button>
    <button class="start secondary" id="startSoloBtn" type="button">グループ再生</button>
    <button class="start secondary" id="startLeadBtn" type="button">−5秒から再生</button>
  </div>
</main>

<script>
(function(){
  "use strict";

  const DENOMS = [3,6,9,12,15,2,4,8,16,32];
  const MIN = 50, MAX = 250;
  const TERMS = [[50,65,"Largo"],[66,75,"Adagio"],[76,107,"Andante"],[108,119,"Moderato"],
                 [120,167,"Allegro"],[168,200,"Presto"],[201,250,"Prestissimo"]];
  const NOTE_NAME = {2:"2分音符",4:"4分音符",8:"8分音符",16:"16分音符",32:"32分音符",
                     3:"2分3連",6:"4分3連",12:"8分3連",9:"全音符÷9",15:"全音符÷15"};

  /* ---------- Domain（純粋：エンティティ生成と拍子計算の唯一の真実。DOM は参照しない） ----------
     階層：Sequence › RhythmGroup › RhythmPattern › Rhythm
       Rhythm        {num, den}          … 1拍子（例 7/8）。den ∈ DENOMS, num は 1..den
       RhythmPattern {rhythms:[Rhythm]}  … グループ内の拍子の並び（YAML の pattern に対応）
       RhythmGroup   {id,name,reps,cue,pattern}
     生成はすべてここを通し、reps/cue/name の正規化を1箇所に集約する。 */
  const Domain = {
    makeRhythm(num, den){ return {num: Number(num), den: Number(den)}; },
    // 文字列 "7/8" または {meter} を検証しつつ Rhythm 化。不正なら null（読み込み時の取りこぼし数え上げ用）
    parseRhythm(v){
      if(v == null) return null;
      const m = String(v).trim().match(/^(\d+)\s*\/\s*(\d+)$/);
      if(!m) return null;
      const num = Number(m[1]), den = Number(m[2]);
      if(!DENOMS.includes(den)) return null;
      if(num < 1 || num > den) return null;
      return {num, den};
    },
    formatRhythm(r){ return r.num + "/" + r.den; },
    rhythmSeconds(den, bpm){ return (60/bpm) * (4/den); },
    noteName(den){ return NOTE_NAME[den]; },
    termFor(v){ return (TERMS.find(t=>v>=t[0]&&v<=t[1])||[,,""])[2]; },
    makePattern(rhythms){ return {rhythms: (rhythms||[]).map(r=>Domain.makeRhythm(r.num, r.den))}; },
    makeGroup(spec){
      spec = spec || {};
      const rhythms = spec.rhythms || (spec.pattern && spec.pattern.rhythms) || [];
      const cueRaw = Number(spec.cue);
      return {
        id: uid(),
        name: (spec.name == null || String(spec.name) === "") ? "リズムグループ" : String(spec.name),
        reps: clampInt(spec.reps, 1, 999, 1),
        cue: (spec.cue == null || isNaN(cueRaw) || cueRaw < 0) ? null : Math.round(cueRaw*100)/100,
        pattern: Domain.makePattern(rhythms)
      };
    },
    cloneGroup(g){
      return {
        id: uid(),
        name: g.name + " のコピー",
        reps: g.reps,
        cue: g.cue,
        pattern: {rhythms: g.pattern.rhythms.map(r=>({num:r.num, den:r.den}))}
      };
    }
  };

  const $ = id => document.getElementById(id);
  const bpmView=$("bpmView"), termView=$("termView"), range=$("tempoRange"), input=$("tempoInput");
  const groupsEl=$("groups"), beatsEl=$("beats"), pulseView=$("pulseView");
  const startAllBtn=$("startAllBtn"), startSoloBtn=$("startSoloBtn"), startLeadBtn=$("startLeadBtn"), statusText=$("statusText"),
        prerollInput=$("prerollInput"), prerollCount=$("prerollCount"), leadEl=$("lead"), recBtn=$("recBtn");
  const seqSum=$("seqSum"), undoBtn=$("undoBtn"), redoBtn=$("redoBtn"), addGroupBtn=$("addGroupBtn");
  const seqNameEl=$("seqName");
  const saveBtn=$("saveBtn"), loadBtn=$("loadBtn"), ioFileLabel=$("ioFileLabel"),
        ioFile=$("ioFile"), ioMsg=$("ioMsg");
  const ytUrl=$("ytUrl"), ytLoad=$("ytLoad"), ytStage=$("ytStage"), ytFoot=$("ytFoot"),
        ytSync=$("ytSync"), ytClear=$("ytClear"), ytOpen=$("ytOpen"), ytMsg=$("ytMsg");
  const canSavePicker = typeof window.showSaveFilePicker === "function";
  const canOpenPicker = typeof window.showOpenFilePicker === "function";
  const FILE_TYPES = [{description:"メトロノーム シーケンス", accept:{"text/yaml":[".yml",".yaml"]}}];

  let bpm = 120;
  let pickNum = 4, pickDen = 4;          // 「拍子を追加」用のピッカー状態
  let seqName = "シーケンス1";
  let groupSeq = 1;
  let groups = [Domain.makeGroup({name:"リズムグループ1", rhythms:[{num:4,den:4}], reps:8})];
  let activeId = groups[0].id;
  let resumeActiveId = null;   // 再生前にアクティブだったグループ
  let focusHandleId = null;

  function uid(){ return "g" + Math.random().toString(36).slice(2,9); }
  const findGroup = id => groups.find(g => g.id === id);

  /* ---------- 履歴（シーケンスの編集のみ・テンポは対象外） ---------- */
  /* ---------- History（汎用：past/future スタックと undo/redo。何を記録/復元するかは capture/apply に委譲） ----------
     対象はシーケンスの編集のみ（テンポは対象外）。capture=snapshot・apply=restore で束ねる。 */
  const History = (() => {
    const MAX = 60;
    let past = [], future = [];
    let capture = () => "", apply = () => {}, onChange = () => {};
    return {
      init(o){ capture = o.capture; apply = o.apply; onChange = o.onChange || (()=>{}); },
      commit(){ past.push(capture()); if(past.length > MAX) past.shift(); future.length = 0; onChange(); },
      undo(){ if(!past.length) return; future.push(capture()); apply(past.pop()); onChange(); },
      redo(){ if(!future.length) return; past.push(capture()); apply(future.pop()); onChange(); },
      canUndo(){ return past.length > 0; },
      canRedo(){ return future.length > 0; }
    };
  })();
  const commit = () => History.commit();

  function snapshot(){
    return JSON.stringify({seqName, groups, activeId, groupSeq, pickNum, pickDen});
  }
  function restore(s){
    const d = JSON.parse(s);
    groups = d.groups; activeId = d.activeId; groupSeq = d.groupSeq;
    pickNum = d.pickNum; pickDen = d.pickDen;
    seqName = d.seqName;
    seqNameEl.value = seqName;
    applySeqName();
    if(activeId && !findGroup(activeId)) activeId = null;
    renderGroups(); syncIdle();
  }
  function updateHistoryUI(){
    undoBtn.disabled = !History.canUndo() || running;
    redoBtn.disabled = !History.canRedo() || running;
  }
  History.init({capture: snapshot, apply: restore, onChange: updateHistoryUI});
  undoBtn.addEventListener("click", ()=>History.undo());
  redoBtn.addEventListener("click", ()=>History.redo());

  /* ---------- シーケンス名 ---------- */
  function applySeqName(){
    document.title = (seqName.trim() || "無題のシーケンス") + " — メトロノーム";
  }
  (function bindSeqName(){
    let typing = false;
    seqNameEl.addEventListener("focus", ()=>{ typing = false; });
    seqNameEl.addEventListener("blur", ()=>{
      typing = false;
      if(!seqNameEl.value.trim()){ seqName = "無題のシーケンス"; seqNameEl.value = seqName; applySeqName(); }
    });
    seqNameEl.addEventListener("input", e=>{
      if(!typing){ commit(); typing = true; }   // 連続入力は1手にまとめる
      seqName = e.target.value;
      applySeqName();
    });
  })();

  /* ---------- テンポ ---------- */
  [50,100,150,200,250].forEach(v=>{
    const el=document.createElement("div");
    el.className="tick"; el.style.left=((v-MIN)/(MAX-MIN)*100)+"%";
    el.innerHTML='<i></i><span>'+v+'</span>'; $("ticks").appendChild(el);
  });
  const termFor = v => Domain.termFor(v);

  function setTempo(v, from){
    v = Math.round(Number(v));
    if(isNaN(v)) v = bpm;
    bpm = Math.min(MAX, Math.max(MIN, v));
    bpmView.textContent = bpm;
    termView.textContent = termFor(bpm);
    if(from !== "range") range.value = bpm;
    if(from !== "input") input.value = bpm;
    range.style.setProperty("--p", ((bpm-MIN)/(MAX-MIN)*100)+"%");
    syncIdle();
  }
  range.addEventListener("input", e=>setTempo(e.target.value,"range"));
  input.addEventListener("change", e=>setTempo(e.target.value,"input"));
  $("tempoForm").addEventListener("submit", e=>{e.preventDefault();setTempo(input.value,"input");input.blur();});
  document.querySelectorAll(".steps .step").forEach(b=>{
    b.addEventListener("click", ()=>setTempo(bpm+Number(b.dataset.delta)));
  });

  /* ---------- グループ操作 ---------- */
  function addGroup(){
    commit();
    groupSeq++;
    const g = Domain.makeGroup({name:"リズムグループ"+groupSeq, reps:8});
    groups.push(g);
    activeId = g.id;
    renderGroups();
  }
  function duplicateGroup(id){
    commit();
    const i = groups.findIndex(g=>g.id===id);
    const copy = Domain.cloneGroup(groups[i]);
    groups.splice(i+1, 0, copy);
    activeId = copy.id;
    renderGroups(); syncIdle();
  }
  function removeGroup(id){
    if(groups.length <= 1) return;
    commit();
    const i = groups.findIndex(g=>g.id===id);
    groups.splice(i,1);
    if(activeId === id) activeId = null;
    renderGroups(); syncIdle();
  }
  function moveGroup(from, to){
    if(to < 0 || to >= groups.length || from === to) return;
    commit();
    const [g] = groups.splice(from,1);
    groups.splice(to,0,g);
    focusHandleId = g.id;
    renderGroups();
  }
  function toggleActive(id){
    activeId = (activeId === id) ? null : id;
    renderGroups();
  }
  addGroupBtn.addEventListener("click", addGroup);

  /* ---------- 描画 ---------- */
  function fmtTime(sec){
    if(sec == null) return "—";
    const m = Math.floor(sec / 60), r = sec - m * 60;
    return m + ":" + (r < 10 ? "0" : "") + r.toFixed(2);
  }
  function timesText(g){
    return "×" + g.reps;
  }

  function renderGroups(){
    groupsEl.innerHTML = "";
    groupsEl.classList.toggle("locked", running);
    addGroupBtn.disabled = running;
    seqNameEl.disabled = running;
    prerollInput.disabled = running;
    leadEl.classList.toggle("na", running && isSoloMode(mode));
    updateVideoLock();

    groups.forEach((g, gi)=>{
      const card = document.createElement("article");
      card.className = "group" + (g.id === activeId ? " active" : "");
      card.dataset.id = g.id;
      card.tabIndex = 0;

      /* header */
      const head = document.createElement("div");
      head.className = "g-head";

      const handle = document.createElement("button");
      handle.type = "button"; handle.className = "handle"; handle.textContent = "⠿";
      handle.setAttribute("aria-label", "並び替え（ドラッグ、または上下キー）");
      handle.disabled = running;
      handle.addEventListener("pointerdown", e=>startDrag(e, gi, card));
      handle.addEventListener("keydown", e=>{
        if(e.key === "ArrowUp"){ e.preventDefault(); moveGroup(gi, gi-1); }
        if(e.key === "ArrowDown"){ e.preventDefault(); moveGroup(gi, gi+1); }
      });
      head.appendChild(handle);

      if(g.id === activeId){
        const name = document.createElement("input");
        name.className = "g-name"; name.type = "text"; name.value = g.name;
        name.setAttribute("aria-label", "リズムグループ名");
        let typing = false;
        name.addEventListener("focus", ()=>{ typing = false; });
        name.addEventListener("blur", ()=>{ typing = false; });
        name.addEventListener("input", e=>{
          if(!typing){ commit(); typing = true; }   // 連続入力は1回分の履歴にまとめる
          g.name = e.target.value;
        });
        head.appendChild(name);

        const acts = document.createElement("span");
        acts.className = "g-actions";
        acts.appendChild(mini("⧉","このリズムグループを複製", false, ()=>duplicateGroup(g.id)));
        const del = mini("✕","このリズムグループを削除", groups.length <= 1, ()=>removeGroup(g.id));
        del.classList.add("kill");
        acts.appendChild(del);
        head.appendChild(acts);
      }else{
        const title = document.createElement("span");
        title.className = "g-title";
        title.textContent = g.name;
        head.appendChild(title);

        const cueBox = document.createElement("span");
        cueBox.className = "g-cue";
        cueBox.appendChild(cueGrabButton(g));   // 非アクティブは REC ● だけ
        head.appendChild(cueBox);
      }
      card.appendChild(head);

      /* collapsed summary */
      if(g.id !== activeId){
        const sub = document.createElement("div");
        sub.className = "g-sub";
        if(!g.pattern.rhythms.length){
          const c = document.createElement("span");
          c.className = "chip none"; c.textContent = "拍子なし";
          sub.appendChild(c);
        }else{
          g.pattern.rhythms.forEach((b,bi)=>{
            const c = document.createElement("span");
            c.className = "chip"; c.dataset.bi = bi;
            c.textContent = b.num + "/" + b.den;
            sub.appendChild(c);
          });
        }
        const times = document.createElement("span");
        times.className = "g-times"; times.dataset.role = "times";
        times.title = "再生回数";
        times.textContent = timesText(g);
        sub.appendChild(times);          // ×N は拍子チップの行に右寄せで整列
        card.appendChild(sub);
      }

      /* active body */
      if(g.id === activeId){
        const body = document.createElement("div");
        body.className = "g-body";

        const crow = document.createElement("div");
        crow.className = "g-row";
        const clab = document.createElement("span");
        clab.className = "g-label"; clab.textContent = "動画位置";
        crow.append(clab, cueControls(g));   // 00:00 と ± はアクティブ側・再生回数の上に
        body.appendChild(crow);

        const row = document.createElement("div");
        row.className = "g-row";
        const lab = document.createElement("span");
        lab.className = "g-label"; lab.textContent = "再生回数";
        const reps = document.createElement("div");
        reps.className = "g-reps";
        const x = document.createElement("span"); x.className="x"; x.textContent="×";
        const rin = document.createElement("input");
        rin.type="number"; rin.min="1"; rin.max="999"; rin.value=g.reps;
        rin.setAttribute("aria-label","再生回数");
        rin.addEventListener("change", ()=>{
          commit();
          let v = Math.round(Number(rin.value));
          if(isNaN(v)) v = 1;
          g.reps = Math.min(999, Math.max(1, v));
          rin.value = g.reps;
          renderGroups();
        });
        reps.append(x, rin);
        row.append(lab, reps);
        body.appendChild(row);

        const bars = document.createElement("div");
        bars.className = "bars";
        if(!g.pattern.rhythms.length){
          const p = document.createElement("p");
          p.className = "empty";
          p.textContent = "下の拍子を追加すると、この順に鳴らします。";
          bars.appendChild(p);
        }
        g.pattern.rhythms.forEach((b,bi)=>{
          const rowb = document.createElement("div");
          rowb.className = "bar"; rowb.dataset.bi = bi;
          const sig = document.createElement("span");
          sig.className = "bar-sig";
          sig.innerHTML = b.num + ' <em>/</em> ' + b.den;
          const ctl = document.createElement("span");
          ctl.className = "bar-ctl";
          ctl.appendChild(mini("↑","上へ移動", bi===0, ()=>moveBar(g,bi,-1)));
          ctl.appendChild(mini("↓","下へ移動", bi===g.pattern.rhythms.length-1, ()=>moveBar(g,bi,1)));
          const k = mini("✕","削除", false, ()=>removeBar(g,bi));
          k.classList.add("kill");
          ctl.appendChild(k);
          rowb.append(sig, ctl);
          bars.appendChild(rowb);
        });
        body.appendChild(bars);
        body.appendChild(buildPicker(g));
        card.appendChild(body);
      }

      card.addEventListener("click", e=>{
        if(running) return;                       // 再生中は編集に入らない
        if(e.target.closest("input, select, button")) return;
        toggleActive(g.id);
      });
      card.addEventListener("keydown", e=>{
        if(running) return;
        if(e.key === "Enter" && !e.target.closest("input, select, button")){
          e.preventDefault(); toggleActive(g.id);
        }
      });

      groupsEl.appendChild(card);
    });

    if(focusHandleId){
      const el = groupsEl.querySelector('[data-id="'+focusHandleId+'"] .handle');
      if(el) el.focus();
      focusHandleId = null;
    }
    updateSummary();
    updateTransport();
    updateHistoryUI();
    applyHighlight();
  }

  function updateSummary(){
    let total = 0;
    for(const g of groups) total += g.pattern.rhythms.length * g.reps;
    seqSum.textContent = groups.length + " グループ ・ 全 " + total + " 小節";
  }

  /* 動画位置の微調整。連打は1手の履歴にまとめる */
  let nudgeId = null, nudgeAt = 0;
  function nudge(g, delta, label){
    const b = document.createElement("button");
    b.type = "button"; b.className = "nudge";
    b.textContent = delta < 0 ? "−" : "＋";
    b.title = Math.abs(delta) + "秒" + (delta < 0 ? "もどす" : "すすめる");
    b.setAttribute("aria-label", b.title);
    b.disabled = recording;                  // 全体レック中はタイムコード調整を止める
    b.addEventListener("click", e=>{
      e.stopPropagation();
      const now = Date.now();
      if(!(nudgeId === g.id && now - nudgeAt < 2500)) commit();
      nudgeId = g.id; nudgeAt = now;
      g.cue = Math.max(0, Math.round((g.cue + delta) * 100) / 100);
      label.textContent = fmtTime(g.cue);      // 構造は変わらないので再描画しない
    });
    return b;
  }

  /* いまの動画位置をこのグループに記録する REC（●）ボタン */
  function cueGrabButton(g){
    const grab = document.createElement("button");
    grab.type = "button"; grab.className = "grab"; grab.textContent = "●";
    grab.title = "いまの動画の再生位置をこのグループに記録（グループ再生の頭出しに使います）";
    grab.setAttribute("aria-label", "動画の現在位置を記録");
    grab.disabled = !ytReady || recording;   // 全体レック中は個別レックを止める
    grab.addEventListener("click", e=>{
      e.stopPropagation();
      if(!ytReady) return;
      let t = null;
      try{ t = ytPlayer.getCurrentTime(); }catch(err){}
      if(t == null || isNaN(t)) return;
      commit();
      g.cue = Math.round(t*100)/100;
      renderGroups();
    });
    return grab;
  }

  /* アクティブ側の「動画位置」行：REC ● ＋ 00:00 ＋ ± ＋ ✕ */
  function cueControls(g){
    const box = document.createElement("span");
    box.className = "g-cue";
    box.appendChild(cueGrabButton(g));
    const at = document.createElement("span");
    at.className = "g-at" + (g.cue == null ? " none" : "");
    at.textContent = fmtTime(g.cue);
    at.title = g.cue == null ? "動画位置は未設定" : "グループ再生のとき、この位置から再生します";
    if(g.cue != null){
      box.appendChild(nudge(g, -0.05, at));
      box.appendChild(at);
      box.appendChild(nudge(g, 0.05, at));
      const clr = mini("✕", "動画位置を解除", recording, ()=>{ commit(); g.cue = null; renderGroups(); });
      clr.classList.add("kill");
      clr.style.width = "22px"; clr.style.height = "22px"; clr.style.fontSize = "9px";
      clr.addEventListener("click", e=>e.stopPropagation());
      box.appendChild(clr);
    }else{
      box.appendChild(at);
    }
    return box;
  }

  function mini(label, aria, disabled, fn){
    const b=document.createElement("button");
    b.type="button"; b.className="mini"; b.textContent=label;
    b.setAttribute("aria-label",aria); b.disabled=disabled;
    b.addEventListener("click", fn);
    return b;
  }

  function buildPicker(g){
    const wrap = document.createElement("div");
    wrap.className = "g-add";
    const nSel = document.createElement("select");
    nSel.setAttribute("aria-label","分子");
    const dSel = document.createElement("select");
    dSel.setAttribute("aria-label","分母");
    DENOMS.forEach(d=>{
      const o=document.createElement("option"); o.value=d; o.textContent=d; dSel.appendChild(o);
    });
    dSel.value = String(pickDen);

    function fillNum(){
      nSel.innerHTML = "";
      for(let i=1;i<=pickDen;i++){
        const o=document.createElement("option"); o.value=i; o.textContent=i; nSel.appendChild(o);
      }
      pickNum = Math.min(pickNum, pickDen);
      nSel.value = String(pickNum);
    }
    fillNum();

    dSel.addEventListener("change", ()=>{ pickDen = Number(dSel.value); fillNum(); syncIdle(); });
    nSel.addEventListener("change", ()=>{ pickNum = Number(nSel.value); syncIdle(); });

    const slash = document.createElement("span");
    slash.className="slash"; slash.textContent="/";
    const add = document.createElement("button");
    add.type="button"; add.className="step"; add.textContent="追加";
    add.addEventListener("click", ()=>{
      commit();
      g.pattern.rhythms.push(Domain.makeRhythm(pickNum, pickDen));
      renderGroups(); syncIdle();
    });
    wrap.append(nSel, slash, dSel, add);
    return wrap;
  }

  function moveBar(g, i, dir){
    const rs = g.pattern.rhythms;
    const j = i + dir;
    if(j < 0 || j >= rs.length) return;
    commit();
    [rs[i], rs[j]] = [rs[j], rs[i]];
    renderGroups();
  }
  function removeBar(g, i){
    commit();
    g.pattern.rhythms.splice(i,1);
    renderGroups(); syncIdle();
  }

  /* ---------- ドラッグ並び替え ---------- */
  let drag = null;
  function startDrag(e, index, card){
    if(running || groups.length < 2) return;
    e.preventDefault();
    const cards = [...groupsEl.children];
    drag = {
      index, card, target:index, startY:e.clientY,
      rects: cards.map(c=>c.getBoundingClientRect()),
      pid: e.pointerId
    };
    e.currentTarget.setPointerCapture(e.pointerId);
    card.classList.add("dragging");
    e.currentTarget.addEventListener("pointermove", onDragMove);
    e.currentTarget.addEventListener("pointerup", endDrag);
    e.currentTarget.addEventListener("pointercancel", endDrag);
  }
  function onDragMove(e){
    if(!drag) return;
    drag.card.style.transform = "translateY(" + (e.clientY - drag.startY) + "px)";
    let t = 0;
    drag.rects.forEach((r,i)=>{
      if(i !== drag.index && e.clientY > r.top + r.height/2) t++;
    });
    drag.target = t;
    const cards = [...groupsEl.children].filter((c,i)=>i !== drag.index);
    cards.forEach(c=>c.classList.remove("drop-before","drop-after"));
    if(cards.length){
      if(t < cards.length) cards[t].classList.add("drop-before");
      else cards[cards.length-1].classList.add("drop-after");
    }
  }
  function endDrag(e){
    if(!drag) return;
    const el = e.currentTarget;
    el.removeEventListener("pointermove", onDragMove);
    el.removeEventListener("pointerup", endDrag);
    el.removeEventListener("pointercancel", endDrag);
    drag.card.style.transform = "";
    drag.card.classList.remove("dragging");
    const from = drag.index, to = drag.target;
    drag = null;
    moveGroup(from, to);
    renderGroups();
  }

  /* ---------- 再生 ---------- */
  let ctx=null, running=false, timer=null, finished=false, endTime=0;
  let nextTime=0, beatIdx=0, barIdx=0, repIdx=0, gIdx=0;
  const LOOKAHEAD=25, AHEAD=0.12, queue=[];
  let cur = {gid:null, bar:-1, rep:0};
  let mode = "all", soloId = null;   // "all" = シーケンス全体 / "solo","lead" = 選択中のグループのみ
  const LEAD_SEC = 5;                // −5秒から再生の助走
  const isSoloMode = m => m === "solo" || m === "lead";
  let preroll = 0, firstBeatTime = 0;   // 開始までの空白（秒）と、最初の1打が鳴る時刻

  function readPreroll(){
    let v = Number(prerollInput.value);
    if(isNaN(v)) v = 0;
    v = Math.min(60, Math.max(0, Math.round(v * 100) / 100));
    prerollInput.value = v.toFixed(2);
    preroll = v;
    return v;
  }
  const baseStatus = () => isSoloMode(mode) ? "グループ再生" : "再生中";
  prerollInput.addEventListener("change", readPreroll);

  function plan(){
    if(running && isSoloMode(mode)){
      return groups.filter(g => g.id === soloId && g.pattern.rhythms.length);
    }
    return groups.filter(g => g.pattern.rhythms.length);
  }
  function soloTarget(){
    const g = findGroup(activeId);
    return (g && g.pattern.rhythms.length) ? g : null;
  }
  const LABELS = {all:"全体再生", solo:"グループ再生", lead:"−5秒から再生"};
  function updateTransport(){
    const btns = {all:startAllBtn, solo:startSoloBtn, lead:startLeadBtn};
    if(running || armKind){
      const active = running ? mode : armKind;
      Object.keys(btns).forEach(k=>{
        const on = (k === active);
        btns[k].textContent = on ? "停止" : LABELS[k];
        btns[k].classList.toggle("on", on);
        btns[k].disabled = !on;
        btns[k].title = "";
      });
      recBtn.classList.toggle("on", recording);
      recBtn.textContent = recording ? "■ レック中" : "● REC";
      recBtn.disabled = !recording;
    }else{
      const ready = plan().length > 0;
      const target = soloTarget();
      const cued = target && target.cue != null && ytReady;
      Object.keys(btns).forEach(k=>{
        btns[k].textContent = LABELS[k];
        btns[k].classList.remove("on");
      });
      startAllBtn.disabled = !ready;
      startSoloBtn.disabled = !target;
      startLeadBtn.disabled = !cued;
      startAllBtn.title = ready ? "" : "拍子を1つ以上追加してください";
      startSoloBtn.title = target ? target.name + " だけを再生" : "再生したいリズムグループをタップして選んでください";
      startLeadBtn.title = !target ? "再生したいリズムグループをタップして選んでください"
        : !ytReady ? "動画を読み込むと使えます"
        : target.cue == null ? "このグループに動画位置が記録されていません"
        : "記録位置の5秒前から流して、記録位置でメトロノームを開始します";
      recBtn.classList.remove("on");
      recBtn.textContent = "● REC";
      recBtn.disabled = !ready || !ytReady;
      recBtn.title = !ytReady ? "動画を読み込むと使えます"
        : "動画を先頭から流し、各リズムグループの位置を記録します";
    }
  }
  function resetPointer(){ beatIdx=0; barIdx=0; repIdx=0; gIdx=0; finished=false; }
  const beatSeconds = d => Domain.rhythmSeconds(d, bpm);

  function click(accent, time, span){
    const decay = Math.min(0.045, span * 0.55);
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = "square";
    osc.frequency.value = accent ? 1760 : 880;
    // 立ち上がりの2msランプ（＝冒頭の空白）をなくし、time ちょうどで最大音量から鳴らす。
    // これがあると発音が数ms遅れて「少しズレて」聞こえていた。
    gain.gain.setValueAtTime(accent ? 0.35 : 0.22, time);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + decay);
    osc.connect(gain).connect(ctx.destination);
    osc.start(time); osc.stop(time + decay + 0.015);
  }

  function scheduler(){
    // タブが背面だと setInterval が 1 秒程度まで間引かれるので、先読みを伸ばす
    const limit = ctx.currentTime + (document.hidden ? 1.2 : AHEAD);
    if(finished && ctx.currentTime >= endTime){ stop(true); return; }
    while(!finished && nextTime < limit){
      const gs = plan();
      if(!gs.length){ finished = true; endTime = nextTime; break; }
      if(gIdx >= gs.length) gIdx = 0;
      const g = gs[gIdx];
      const rhythms = g.pattern.rhythms;
      if(barIdx >= rhythms.length) barIdx = 0;
      const bar = rhythms[barIdx];
      if(beatIdx >= bar.num) beatIdx = 0;

      const span = beatSeconds(bar.den);
      click(beatIdx === 0, nextTime, span);
      queue.push({time:nextTime, gid:g.id, rep:repIdx, bar:barIdx, beat:beatIdx, meter:bar});
      nextTime += span;

      beatIdx++;
      if(beatIdx >= bar.num){
        beatIdx = 0; barIdx++;
        if(barIdx >= rhythms.length){
          barIdx = 0; repIdx++;
          if(repIdx >= g.reps){
            repIdx = 0; gIdx++;
            if(gIdx >= gs.length){ finished = true; endTime = nextTime; }
          }
        }
      }
    }
  }

  let shown = "";
  function draw(){
    if(!running) return;
    if(firstBeatTime && ctx.currentTime < firstBeatTime){
      prerollCount.textContent = Math.max(0, firstBeatTime - ctx.currentTime).toFixed(2);
    }else if(document.body.classList.contains("waiting")){
      document.body.classList.remove("waiting");
      leadEl.classList.remove("counting");
      prerollCount.hidden = true;
      statusText.textContent = baseStatus();
    }
    while(queue.length && queue[0].time <= ctx.currentTime){
      const e = queue.shift();
      const key = e.gid + ":" + e.rep + ":" + e.bar;
      if(key !== shown){
        shown = key;
        if(recording && e.gid !== recGid){    // グループが切り替わった最初の1打で記録
          recGid = e.gid;
          stampCue(e.gid, e.time);
        }
        cur = {gid:e.gid, bar:e.bar, rep:e.rep};
        paintBeats(e.meter.num);
        showPulse(e.meter);
        applyHighlight();
      }
      const dots = beatsEl.children;
      for(let i=0;i<dots.length;i++) dots[i].classList.toggle("on", i === e.beat);
    }
    if(finished && ctx.currentTime >= endTime){ stop(true); return; }
    requestAnimationFrame(draw);
  }

  function applyHighlight(){
    [...groupsEl.children].forEach(card=>{
      const g = findGroup(card.dataset.id);
      const on = running && cur.gid === card.dataset.id;
      card.classList.toggle("playing", on);
      card.querySelectorAll("[data-bi]").forEach(n=>{
        n.classList.toggle("now", on && Number(n.dataset.bi) === cur.bar);
      });
      const t = card.querySelector('[data-role="times"]');
      if(t && g){
        t.textContent = on ? (cur.rep+1) + " / " + g.reps : timesText(g);
      }
    });
  }

  function paintBeats(n){
    beatsEl.innerHTML = "";
    for(let i=0;i<n;i++){
      const d = document.createElement("span");
      d.className = "beat" + (i===0 ? " first" : "");
      beatsEl.appendChild(d);
    }
  }
  function showPulse(bar){
    const rate = Math.round((60/beatSeconds(bar.den))*10)/10;
    pulseView.innerHTML = '<i>'+bar.num+'/'+bar.den+'</i><span>'+(NOTE_NAME[bar.den]||("全音符÷"+bar.den))+'</span><b>'+rate+' /分</b>';
  }
  function syncIdle(){
    if(running) return;
    const gs = plan();
    const bar = gs.length ? gs[0].pattern.rhythms[0] : {num:pickNum, den:pickDen};
    paintBeats(bar.num);
    showPulse(bar);
    updateTransport();
  }

  let armKind = null;         // 準備中（動画の頭出し／再生待ち）のモード
  let cueWatch = null;

  function firstGroupFor(kind){
    if(kind !== "all") return soloTarget();
    return groups.filter(g => g.pattern.rhythms.length)[0] || null;
  }
  function cueOf(kind){
    const g = firstGroupFor(kind);
    return (g && typeof g.cue === "number") ? g.cue : null;
  }
  function armCancel(){
    armKind = null; cueWatch = null; topWatch = null; pendingKind = null;
    recording = false; recGid = null;
    clearTimeout(waitTimer);
    videoPause();
    ytSay("", false);
    statusText.textContent = "停止中";
    updateTransport();
  }
  let topWatch = null;
  let recording = false, recGid = null;    // 全体レック

  function startRec(){
    if(running || armKind){ stop(false); return; }       // レック中はトグルで停止
    if(!ytReady){ ytSay("動画を読み込むと全体レックが使えます", true); return; }
    if(!plan().length) return;
    commit();                    // レック1回ぶんをまとめて1手の履歴にする
    recording = true; recGid = null;
    start("all");                // 全体レックは常に全体再生・動画は先頭から
  }

  /* いま鳴り始めたグループに、そのときの動画位置を書き込む */
  function stampCue(gid, evTime){
    const g = findGroup(gid);
    if(!g || !ytReady) return;
    let t = null;
    try{ t = ytPlayer.getCurrentTime(); }catch(err){}
    if(t == null || isNaN(t)) return;
    const late = Math.max(0, ctx.currentTime - evTime);   // 取りこぼしたフレームぶんを引く
    g.cue = Math.max(0, Math.round((t - late) * 100) / 100);
    const card = groupsEl.querySelector('[data-id="' + gid + '"]');
    const at = card && card.querySelector(".g-at");
    if(at){                       // 再描画せず表示だけ差し替える
      at.textContent = fmtTime(g.cue);
      at.classList.remove("none");
      at.classList.add("hit");
    }
  }
  function startFromTop(kind){
    try{
      ytPlayer.seekTo(0, true);
      ytPlayer.playVideo();
    }catch(err){ armKind = null; beginPlayback(kind); return; }
    topWatch = {kind, t0: performance.now()};
    statusText.textContent = "頭出し中";
    ytSay("先頭に戻しています…", false);
    requestAnimationFrame(pollTop);
  }
  function pollTop(){
    if(!topWatch) return;
    let st = -1, t = null;
    try{ st = ytPlayer.getPlayerState(); t = ytPlayer.getCurrentTime(); }catch(err){}
    // 先頭から実際に動き出したことを確認してから刻み始める（ここで空白が効く）
    if(st === 1 && t != null && t > 0.02 && t < 2){
      const kind = topWatch.kind;
      topWatch = null; armKind = null;
      ytSay("", false);
      beginPlayback(kind);
      return;
    }
    if(performance.now() - topWatch.t0 > 6000){
      const kind = topWatch.kind;
      topWatch = null; armKind = null;
      ytSay("動画の応答がないため、メトロノームだけ始めます", true);
      beginPlayback(kind);
      return;
    }
    requestAnimationFrame(pollTop);
  }
  function startAtCue(kind, cue){
    const lead = (kind === "lead");
    const from = lead ? Math.max(0, cue - LEAD_SEC) : cue;
    try{
      ytPlayer.seekTo(from, true);     // lead なら5秒手前、そうでなければ指定秒そのもの
      ytPlayer.playVideo();
    }catch(err){ armKind = null; beginPlayback(kind); return; }
    cueWatch = {target: cue, kind, lead, t0: performance.now(), limit: lead ? (LEAD_SEC + 8) * 1000 : 6000};
    statusText.textContent = "頭出し中";
    ytSay("頭出し中…", false);
    requestAnimationFrame(pollCue);
  }
  function pollCue(){
    if(!cueWatch) return;
    let st = -1, t = null;
    try{ st = ytPlayer.getPlayerState(); t = ytPlayer.getCurrentTime(); }catch(err){}

    if(cueWatch.lead){
      // 5秒手前から流して、記録位置に重なった瞬間に刻み出す。
      // seekTo 直後は getCurrentTime が「巻き戻る前の位置」を数フレーム返すため、
      // 助走開始点(cue-5)まで実際に戻ったのを確認してから計測を始める
      // （確認前だと、記録直後で cue 付近にいる位置を「到達」と誤認して即開始してしまう）
      if(t != null && !isNaN(t)){
        const from = Math.max(0, cueWatch.target - LEAD_SEC);
        if(!cueWatch.seeked && t <= from + 0.5) cueWatch.seeked = true;   // 助走開始点まで戻った
        if(cueWatch.seeked){
          const remain = cueWatch.target - t;
          if(remain <= 0){
            const kind = cueWatch.kind;
            const over = Math.min(-remain, 0.05);
            cueWatch = null; armKind = null;
            ytSay("", false);
            beginPlayback(kind, {skipWait:true, adjust:-over});
            return;
          }
          ytSay("あと " + remain.toFixed(1) + " 秒で開始", false);
        }else{
          ytSay("頭出し中…", false);   // まだ助走開始点に戻っていない
        }
      }
    }else if(st === 1 && t != null && t >= cueWatch.target - 0.1){
      // 指定位置に着いて、実際に再生が始まったフレームで刻み出す
      const kind = cueWatch.kind;
      const over = Math.min(Math.max(0, t - cueWatch.target), 0.05);
      cueWatch = null; armKind = null;
      ytSay("", false);
      beginPlayback(kind, {skipWait:true, adjust:-over});   // 行き過ぎたぶんだけ前倒し
      return;
    }
    if(performance.now() - cueWatch.t0 > cueWatch.limit){
      const kind = cueWatch.kind;
      cueWatch = null; armKind = null;
      ytSay("動画の応答がないため、メトロノームだけ始めます", true);
      beginPlayback(kind, {skipWait:true});
      return;
    }
    requestAnimationFrame(pollCue);
  }

  function beginPlayback(kind, opts){
    if(kind !== "all" && !soloTarget()) return;
    if(kind === "all" && !plan().length) return;
    if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if(ctx.state === "suspended") ctx.resume();
    mode = (kind === "all") ? "all" : kind;
    soloId = (mode === "all") ? null : activeId;
    running = true; shown = "";
    resumeActiveId = activeId;
    activeId = null;               // 再生中は全グループを非アクティブにする
    renderGroups();
    resetPointer();
    queue.length = 0;
    // 空白のぶん最初の予約を後ろへずらす。先読みスケジューラなので、
    // この間はクリックが1つも予約されず、時刻はサンプル精度で保たれる
    // 空白は「全体再生」かつ「動画の頭出しをしていないとき」だけ入れる
    const o = opts || {};
    const wait = (mode === "all" && !o.skipWait) ? readPreroll() : 0;
    const adjust = o.adjust || 0;
    nextTime = Math.max(ctx.currentTime + 0.005, ctx.currentTime + 0.06 + wait + adjust);
    firstBeatTime = wait > 0 ? nextTime : 0;
    timer = setInterval(scheduler, LOOKAHEAD);
    requestAnimationFrame(draw);
    document.body.classList.add("running");
    if(wait > 0){
      document.body.classList.add("waiting");
      leadEl.classList.add("counting");
      statusText.textContent = "待機中";
      prerollCount.hidden = false;
      prerollCount.textContent = wait.toFixed(2);
    }else{
      statusText.textContent = baseStatus();
    }
    updateTransport();
  }
  function stop(completed, fromVideo){
    running = false;
    armKind = null; cueWatch = null; topWatch = null;
    recording = false; recGid = null;
    if(!fromVideo) videoPause();
    clearInterval(timer);
    queue.length = 0;
    [...beatsEl.children].forEach(d=>d.classList.remove("on"));
    cur = {gid:null, bar:-1, rep:0};
    activeId = resumeActiveId;     // 再生前に開いていたグループへ戻す
    resumeActiveId = null;
    renderGroups();
    document.body.classList.remove("running");
    document.body.classList.remove("waiting");
    leadEl.classList.remove("counting");
    prerollCount.hidden = true;
    firstBeatTime = 0;
    mode = "all"; soloId = null;
    statusText.textContent = completed ? "完了" : "停止中";
    resetPointer();
    syncIdle();
    updateTransport();
  }
  /* --- 再生の入口：動画があれば、動画が実際に鳴り出してから刻み始める --- */
  function start(kind){
    if(kind !== "all" && !soloTarget()) return;
    if(kind === "all" && !plan().length) return;
    if(videoArmed() && kind === "all"){       // 全体再生は必ず動画を先頭に戻す
      armKind = kind;
      updateTransport();
      startFromTop(kind);
      return;
    }
    const cue = cueOf(kind);
    if(kind === "lead"){                       // −5秒から再生は、動画と記録位置が揃っているときだけ
      if(!videoArmed() || cue == null) return;
      armKind = kind;
      updateTransport();
      startAtCue(kind, cue);
      return;
    }
    if(videoArmed() && cue != null){          // グループ再生は記録した位置から合わせる
      armKind = kind;
      updateTransport();
      startAtCue(kind, cue);
      return;
    }
    if(videoArmed()){
      armKind = kind;
      updateTransport();
      pendingKind = kind;
      ytSay("動画の再生を待っています…", false);
      try{ ytPlayer.playVideo(); }catch(err){ pendingKind = null; armKind = null; beginPlayback(kind); return; }
      clearTimeout(waitTimer);
      waitTimer = setTimeout(()=>{                 // 反応がなければ単体で始める
        if(pendingKind){ const k = pendingKind; pendingKind = null; armKind = null; ytSay("動画の応答がないため、メトロノームだけ始めます", true); beginPlayback(k); }
      }, 4000);
      return;
    }
    beginPlayback(kind);
  }

  document.addEventListener("visibilitychange", ()=>{ if(running && ctx) scheduler(); });

  recBtn.addEventListener("click", startRec);

  startAllBtn.addEventListener("click", ()=> armKind ? armCancel() : (running ? stop(false) : start("all")));
  startSoloBtn.addEventListener("click", ()=> armKind ? armCancel() : (running ? stop(false) : start("solo")));
  startLeadBtn.addEventListener("click", ()=> armKind ? armCancel() : (running ? stop(false) : start("lead")));
  document.addEventListener("keydown", e=>{
    const mod = e.metaKey || e.ctrlKey;
    if(mod && e.key.toLowerCase() === "z"){
      e.preventDefault();
      e.shiftKey ? History.redo() : History.undo();
      return;
    }
    if(mod && e.key.toLowerCase() === "y"){ e.preventDefault(); History.redo(); return; }
    if(e.code !== "Space") return;
    const t = e.target.tagName;
    if(t==="INPUT" || t==="SELECT" || t==="BUTTON") return;
    e.preventDefault();
    running ? stop(false) : start("all");
  });

  /* ================= YAML 保存 / 読み込み ================= */

  /* ---------- Yaml（純粋：このスキーマ用の最小エンコーダ／パーサ。DOM もアプリ状態も参照しない） ----------
     scalarStr … 値を必要なときだけクォートして書き出す
     parse     … テキストを素の JS オブジェクト（map/list/scalar）へ。ドメインへの変換は applyDoc 側 */
  const Yaml = (() => {
    function scalarStr(v){
      const t = String(v);
      const needsQuote = t === "" || /^\s|\s$/.test(t) || /[:#\[\]{},&*!|>'"%@`]/.test(t)
        || /^(true|false|null|yes|no|on|off|~|-|\d)/i.test(t);
      return needsQuote ? '"' + t.replace(/\\/g,"\\\\").replace(/"/g,'\\"') + '"' : t;
    }
    function stripComment(line){
      let q = null, out = "";
      for(let i=0;i<line.length;i++){
        const c = line[i];
        if(q){ out += c; if(c === q) q = null; continue; }
        if(c === '"' || c === "'"){ q = c; out += c; continue; }
        if(c === "#" && (i === 0 || /\s/.test(line[i-1]))) break;
        out += c;
      }
      return out.replace(/\s+$/, "");
    }
    function unquote(t){
      if(/^".*"$/s.test(t)) return t.slice(1,-1).replace(/\\"/g,'"').replace(/\\\\/g,"\\");
      if(/^'.*'$/s.test(t)) return t.slice(1,-1).replace(/''/g,"'");
      return t;
    }
    function scalar(t){
      t = t.trim();
      if(t.startsWith("[") && t.endsWith("]")){
        const inner = t.slice(1,-1).trim();
        return inner === "" ? [] : inner.split(",").map(x=>scalar(x.trim()));
      }
      if(/^["']/.test(t)) return unquote(t);
      if(t === "" || t === "~" || t === "null") return null;
      if(t === "true") return true;
      if(t === "false") return false;
      if(/^-?\d+(\.\d+)?$/.test(t)) return Number(t);
      return t;
    }
    function parse(text){
      const lines = [];
      text.replace(/\r\n?/g,"\n").split("\n").forEach((raw,idx)=>{
        const line = stripComment(raw);
        if(!line.trim() || /^(---|\.\.\.)\s*$/.test(line.trim())) return;
        lines.push({indent: line.match(/^ */)[0].length, text: line.trim(), no: idx+1});
      });
      let i = 0;
      const isItem = l => l.text === "-" || l.text.startsWith("- ");
      const looksMap = t => /^[^\s].*?:(\s|$)/.test(t);

      function block(indent){
        if(i >= lines.length) return null;
        return isItem(lines[i]) ? list(indent) : map(indent);
      }
      function map(indent){
        const obj = {};
        while(i < lines.length && lines[i].indent === indent && !isItem(lines[i])){
          const l = lines[i];
          const m = l.text.match(/^([^:]+):\s*(.*)$/);
          if(!m) throw new Error(l.no + " 行目を解釈できません: " + l.text);
          const key = m[1].trim(), rest = m[2].trim();
          if(rest === ""){
            i++;
            obj[key] = (i < lines.length && lines[i].indent > indent) ? block(lines[i].indent) : null;
          }else{
            obj[key] = scalar(rest); i++;
          }
        }
        return obj;
      }
      function list(indent){
        const arr = [];
        while(i < lines.length && lines[i].indent === indent && isItem(lines[i])){
          const l = lines[i];
          const off = l.text.match(/^-\s*/)[0].length;
          const rest = l.text.slice(off).trim();
          if(rest === ""){
            i++;
            arr.push(i < lines.length && lines[i].indent > indent ? block(lines[i].indent) : null);
          }else if(looksMap(rest)){
            const virt = l.indent + off;
            lines[i] = {indent: virt, text: rest, no: l.no};
            arr.push(map(virt));
          }else{
            arr.push(scalar(rest)); i++;
          }
        }
        return arr;
      }
      return block(lines.length ? lines[0].indent : 0);
    }
    return { scalarStr, parse };
  })();

  /* --- 書き出し（アプリ状態を YAML 文字列にする） --- */
  function toYaml(){
    const L = ["version: 1", "kind: metronome.sequence", "",
               "name: " + Yaml.scalarStr(seqName), "tempo: " + bpm];
    if(preroll > 0) L.push("preroll: " + preroll.toFixed(2));
    if(ytCurrent) L.push("video: " + Yaml.scalarStr(videoUrl()));
    L.push("", "groups:");
    groups.forEach(g=>{
      L.push("  - name: " + Yaml.scalarStr(g.name));
      L.push("    repeat: " + g.reps);
      if(g.cue != null) L.push("    cue: " + g.cue.toFixed(2));
      L.push("    pattern: [" + g.pattern.rhythms.map(Domain.formatRhythm).join(", ") + "]");
    });
    return L.join("\n") + "\n";
  }
  function fileName(){
    const base = (seqName.trim() || "sequence").replace(/[\\/:*?"<>|\n\r\t]/g, "_").slice(0,60);
    return base + ".metronome.yml";
  }

  /* --- 取り込み --- */
  function clampInt(v, lo, hi, fallback){
    const n = Math.round(Number(v));
    if(isNaN(n)) return fallback;
    return Math.min(hi, Math.max(lo, n));
  }
  function applyDoc(doc){
    if(!doc || typeof doc !== "object" || Array.isArray(doc)) throw new Error("シーケンスの形式ではありません");
    if(!Array.isArray(doc.groups)) throw new Error("groups が見つかりません");

    const notes = [];
    if(doc.version != null && Number(doc.version) !== 1) notes.push("version " + doc.version + " は未知のため v1 として読み込みました");

    let dropped = 0;
    const loaded = doc.groups.map((raw, idx)=>{
      const g = (raw && typeof raw === "object" && !Array.isArray(raw)) ? raw : {};
      const pat = g.pattern;
      const items = Array.isArray(pat) ? pat : (pat == null ? [] : [pat]);
      const rhythms = [];
      items.forEach(it=>{
        const b = Domain.parseRhythm((it && typeof it === "object") ? it.meter : it);
        if(b) rhythms.push(b); else dropped++;
      });
      return Domain.makeGroup({
        name: (g.name == null || String(g.name) === "") ? "リズムグループ"+(idx+1) : String(g.name),
        reps: g.repeat,
        cue: g.cue,
        rhythms
      });
    });
    if(!loaded.length) { loaded.push(Domain.makeGroup({name:"リズムグループ1", reps:1})); notes.push("グループが空だったので、空のグループを1つ作りました"); }
    if(dropped) notes.push(dropped + " 件の拍子は読み込めませんでした（分母は " + DENOMS.join(",") + "、分子は 1〜分母）");

    if(running) stop(false);
    commit();                                  // 読み込みも Undo で戻せる
    seqName = (doc.name == null || String(doc.name) === "") ? "無題のシーケンス" : String(doc.name);
    seqNameEl.value = seqName;
    applySeqName();
    groups = loaded;
    groupSeq = loaded.length;
    activeId = null;
    setTempo(clampInt(doc.tempo, MIN, MAX, 120));
    const pre = Number(doc.preroll);
    prerollInput.value = (isNaN(pre) ? 0 : Math.min(60, Math.max(0, pre))).toFixed(2);
    readPreroll();
    if(doc.video != null){
      const v = parseYouTube(doc.video);
      if(v) mountVideo(v); else notes.push("video のURLを読めませんでした");
    }
    renderGroups();
    syncIdle();

    const bars = loaded.reduce((n,g)=>n+g.pattern.rhythms.length, 0);
    return ["読み込みました：" + loaded.length + " グループ / " + bars + " 小節"].concat(notes).join("\n");
  }

  /* --- 実行（保存・読み込みは1クリックで完了する） --- */
  let msgTimer = null;
  function say(text, bad){
    ioMsg.textContent = text;
    ioMsg.classList.toggle("bad", !!bad);
    ioMsg.hidden = false;
    clearTimeout(msgTimer);
    msgTimer = setTimeout(()=>{ ioMsg.hidden = true; }, bad ? 9000 : 5000);
  }
  function readText(text){
    try{
      say(applyDoc(Yaml.parse(text)), false);
    }catch(err){
      say("読み込めませんでした：" + err.message, true);
    }
  }
  function readFile(file){
    if(!file) return;
    const r = new FileReader();
    r.onload = ()=>readText(String(r.result));
    r.onerror = ()=>say("ファイルを読めませんでした", true);
    r.readAsText(file);
  }

  saveBtn.addEventListener("click", async ()=>{
    const name = fileName(), text = toYaml();
    if(canSavePicker){
      try{
        const handle = await window.showSaveFilePicker({suggestedName:name, types:FILE_TYPES});
        const w = await handle.createWritable();
        await w.write(text);
        await w.close();
        say(handle.name + " に保存しました", false);
        return;
      }catch(err){
        if(err && err.name === "AbortError") return;      // キャンセルは黙って戻る
      }
    }
    try{
      const blob = new Blob([text], {type:"text/yaml;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
      say(name + " を保存しました", false);
    }catch(err){
      say("この環境ではファイルに書き出せません", true);
    }
  });

  loadBtn.addEventListener("click", async ()=>{
    try{
      const [handle] = await window.showOpenFilePicker({multiple:false, types:FILE_TYPES});
      const file = await handle.getFile();
      readText(await file.text());
    }catch(err){
      if(err && err.name === "AbortError") return;
      say("ファイルを開けませんでした", true);
    }
  });

  ioFile.addEventListener("change", ()=>{
    readFile(ioFile.files && ioFile.files[0]);
    ioFile.value = "";
  });

  /* ダイアログが使える環境ではボタン、使えない環境では input[type=file] を出す */
  if(canOpenPicker){
    loadBtn.hidden = false;
    ioFileLabel.hidden = true;
  }

  /* --- ドラッグ＆ドロップ --- */
  let dragDepth = 0;
  document.addEventListener("dragenter", e=>{
    if(!e.dataTransfer || ![...e.dataTransfer.types].includes("Files")) return;
    dragDepth++; document.body.classList.add("dropping");
  });
  document.addEventListener("dragover", e=>{ e.preventDefault(); });
  document.addEventListener("dragleave", ()=>{
    dragDepth = Math.max(0, dragDepth-1);
    if(!dragDepth) document.body.classList.remove("dropping");
  });
  document.addEventListener("drop", e=>{
    e.preventDefault();
    dragDepth = 0; document.body.classList.remove("dropping");
    readFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
  });

  /* ================= YouTube 同時再生 ================= */
  let ytPlayer = null, ytReady = false, pendingKind = null, waitTimer = null, apiTimer = null;
  let ytCurrent = null;
  // file:// や content:// で開くと Referer が付かず、埋め込みが 153 で弾かれる
  const embedBlocked = !/^https?:$/.test(location.protocol);
  const LOCAL_NOTE = "このHTMLをローカルファイルとして開いているため、YouTubeの埋め込みは再生できません（エラー153）。\n"
    + "Webサーバー経由で開くと動きます（例：置いたフォルダで python3 -m http.server → http://localhost:8000/…）。\n"
    + "このままでも「別タブで開いて同時に開始」は使えます。";
  const ERROR_NOTE = {
    2:   "URLが正しくないようです",
    5:   "この動画はプレイヤーで再生できません",
    100: "動画が見つかりません（削除／非公開）",
    101: "この動画は埋め込み再生が許可されていません",
    150: "この動画は埋め込み再生が許可されていません",
    153: LOCAL_NOTE
  };

  function ytSay(text, bad){
    ytMsg.textContent = text;
    ytMsg.classList.toggle("bad", !!bad);
    ytMsg.hidden = !text;
  }
  const videoArmed = () => ytReady && ytSync.checked && !!ytPlayer && !embedBlocked;
  function videoUrl(){
    if(!ytCurrent) return "";
    return "https://www.youtube.com/watch?v=" + ytCurrent.id + (ytCurrent.start ? "&t=" + ytCurrent.start : "");
  }
  function videoPause(){
    if(ytReady && ytPlayer && ytSync.checked){
      try{ ytPlayer.pauseVideo(); }catch(err){}
    }
  }

  function parseYouTube(raw){
    const text = String(raw || "").trim();
    if(!text) return null;
    const m = text.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([A-Za-z0-9_-]{11})/)
           || text.match(/^([A-Za-z0-9_-]{11})$/);
    if(!m) return null;
    let start = 0;
    const t = text.match(/[?&](?:t|start)=([^&#]+)/);
    if(t){
      const v = t[1];
      if(/^\d+s?$/.test(v)) start = parseInt(v, 10);
      else{
        const hms = v.match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/);
        if(hms) start = (+(hms[1]||0))*3600 + (+(hms[2]||0))*60 + (+(hms[3]||0));
      }
    }
    return {id:m[1], start};
  }

  function withApi(cb){
    if(window.YT && window.YT.Player) return cb();
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = function(){
      if(typeof prev === "function") prev();
      clearTimeout(apiTimer);
      cb();
    };
    if(!document.getElementById("yt-api")){
      const tag = document.createElement("script");
      tag.id = "yt-api";
      tag.src = "https://www.youtube.com/iframe_api";
      tag.onerror = ()=>ytSay("YouTube を読み込めませんでした（オフライン、または通信が遮断されています）", true);
      document.head.appendChild(tag);
    }
    clearTimeout(apiTimer);
    apiTimer = setTimeout(()=>{
      if(!(window.YT && window.YT.Player)) ytSay("YouTube を読み込めませんでした（オフライン、または通信が遮断されています）", true);
    }, 8000);
  }

  function mountVideo(v){
    ytCurrent = v;
    ytStage.hidden = false;
    ytFoot.hidden = false;
    ytOpen.hidden = false;
    if(embedBlocked){ ytSay(LOCAL_NOTE, true); }
    else{ ytSay("読み込み中…", false); }
    withApi(()=>{
      if(ytPlayer && ytReady){
        try{ ytPlayer.cueVideoById({videoId:v.id, startSeconds:v.start}); ytSay("", false); return; }catch(err){}
      }
      ytPlayer = new YT.Player("ytFrame", {
        videoId: v.id,
        playerVars: {playsinline:1, rel:0, modestbranding:1, start:v.start},
        events: {
          onReady: ()=>{ ytReady = true; ytSay("", false); renderGroups(); },
          onError: e=>ytSay(ERROR_NOTE[e.data] || ("再生できません（エラー " + e.data + "）"), true),
          onStateChange: e=>{
            if(e.data === YT.PlayerState.PLAYING){
              if(pendingKind){
                const k = pendingKind; pendingKind = null; armKind = null;
                clearTimeout(waitTimer);
                ytSay("", false);
                beginPlayback(k);                    // 動画が鳴り出した瞬間に刻み始める
              }
            }else if(e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED){
              clearTimeout(waitTimer); pendingKind = null;
              if(running && ytSync.checked) stop(false, true);   // 動画を止めたら刻みも止まる
            }
          }
        }
      });
    });
  }

  function applyUrl(){
    const v = parseYouTube(ytUrl.value);
    if(!v){ ytSay("YouTube のURLとして読めませんでした", true); return; }
    mountVideo(v);
  }
  ytLoad.addEventListener("click", applyUrl);
  ytUrl.addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); applyUrl(); } });
  ytUrl.addEventListener("paste", ()=>setTimeout(applyUrl, 0));
  ytOpen.addEventListener("click", ()=>{
    if(!ytCurrent) return;
    const url = "https://www.youtube.com/watch?v=" + ytCurrent.id + (ytCurrent.start ? "&t=" + ytCurrent.start : "");
    if(!running) start("all");          // 先にメトロノームを走らせてから動画を開く
    window.open(url, "_blank", "noopener");
  });
  ytClear.addEventListener("click", ()=>{
    if(running) stop(false);
    try{ ytPlayer && ytPlayer.destroy(); }catch(err){}
    ytPlayer = null; ytReady = false; pendingKind = null;
    const holder = document.createElement("div");
    holder.id = "ytFrame";
    ytStage.innerHTML = ""; ytStage.appendChild(holder);
    ytStage.hidden = true; ytFoot.hidden = true; ytOpen.hidden = true;
    ytCurrent = null;
    ytUrl.value = ""; ytSay("", false);
    renderGroups();
  });

  function updateVideoLock(){
    ytOpen.disabled = false;
    ytUrl.disabled = running;
    ytLoad.disabled = running;
    ytClear.disabled = running;
    ytSync.disabled = running;
  }

  /* ---------- 初期化 ---------- */
  renderGroups();
  readPreroll();
  applySeqName();
  updateHistoryUI();
  setTempo(120);
})();
</script>
</body>
</html>
