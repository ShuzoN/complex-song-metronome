<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シーケンス1 — メトロノーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;600;700&family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&icon_names=fast_forward,fast_rewind,fullscreen,pause,play_arrow,stop&display=block" rel="stylesheet">
<style>
  :root{
    --bg:#A9B0A2; --panel:#F5F4EF; --ink:#191C18; --rule:#C7CABC;
    --signal:#C4362A; --brass:#8E7132; --dim:#6E7268;
    --display:"Big Shoulders Display","Zen Kaku Gothic New",sans-serif;
    --mono:"DM Mono",ui-monospace,monospace;
    --body:"Zen Kaku Gothic New",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}   /* display 指定を持つ要素でも hidden を効かせる */
  body{
    min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--body);
    display:flex;align-items:center;justify-content:center;padding:24px 16px;
    -webkit-font-smoothing:antialiased;
  }
  .device{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--ink);box-shadow:7px 7px 0 rgba(25,28,24,.20);
    display:flex;flex-direction:column;max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px)}
  /* ヘッダ〜グループ一覧＋追加までを1つのスクロール領域に。下部の dock（再生バー＋練習モード）は常に固定表示 */
  .content{flex:1 1 auto;overflow-y:auto;min-height:0}
  /* モバイルはデバイスを全画面化し、下部バーを画面端（左右・下端）まで届かせる。比率はそのまま。PC は中央カードのまま */
  @media (max-width:480px){
    body{padding:0}
    .device{max-width:none;border:none;box-shadow:none;max-height:100vh;max-height:100dvh}
  }

  /* header */
  .head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--ink)}
  .wordmark{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
  .status{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--dim)}
  .lamp{width:9px;height:9px;border:1px solid var(--ink);border-radius:50%}
  body.running .lamp{background:var(--signal);border-color:var(--signal)}
  body.running .status{color:var(--ink)}

  /* tempo */
  .readout{padding:22px 18px 6px;text-align:center}
  .bpm-line{display:flex;align-items:baseline;justify-content:center;gap:10px}
  .bpm-note{font-family:var(--mono);font-size:15px;color:var(--brass);align-self:center;padding-top:6px}
  .bpm{font-family:var(--display);font-weight:700;font-size:clamp(88px,25vw,132px);line-height:.78;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .bpm-unit{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--dim)}
  .term{margin-top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--brass)}

  .scale{padding:18px 18px 4px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;cursor:pointer}
  input[type=range]:focus{outline:none}
  input[type=range]::-webkit-slider-runnable-track{height:3px;background:linear-gradient(to right,var(--signal) var(--p,29%),var(--rule) var(--p,29%))}
  input[type=range]::-moz-range-track{height:3px;background:var(--rule)}
  input[type=range]::-moz-range-progress{height:3px;background:var(--signal)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:20px;margin-top:-9px;background:var(--signal);border:1px solid var(--ink);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
  input[type=range]::-moz-range-thumb{width:24px;height:20px;border:1px solid var(--ink);background:var(--signal);border-radius:0;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
  .ticks{position:relative;height:22px;margin-top:6px}
  .tick{position:absolute;top:0;transform:translateX(-50%);text-align:center}
  .tick i{display:block;width:1px;height:5px;background:var(--rule);margin:0 auto 3px}
  .tick span{font-family:var(--mono);font-size:9.5px;color:#7A7E73}

  button{font-family:var(--mono);color:var(--ink);cursor:pointer}
  .step{min-width:46px;height:40px;padding:0 6px;background:var(--panel);border:1px solid var(--ink);font-size:12px}
  .step:hover{background:#EAE9E2}
  .step:active{transform:translate(1px,1px)}
  .step:disabled{opacity:.28;cursor:default;transform:none}
  :focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .steps{display:flex;justify-content:center;gap:6px;padding:8px 18px 0;flex-wrap:wrap}
  .steps .gap{width:10px}
  form.entry{display:flex;justify-content:center;align-items:center;gap:8px;padding:14px 18px 16px}
  form.entry label{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--dim)}
  input[type=number]{width:82px;height:40px;text-align:center;font-family:var(--mono);font-size:15px;color:var(--ink);background:#FFF;border:1px solid var(--ink);border-radius:0}
  .apply{height:40px;padding:0 14px;background:var(--ink);color:var(--panel);border:1px solid var(--ink);font-size:12px}

  /* volume */
  .vol{padding:6px 18px 16px}
  .vol-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
  .vol-val{font-family:var(--mono);font-size:15px;color:var(--brass);font-variant-numeric:tabular-nums;letter-spacing:.04em}

  /* youtube */
  .yt{border-top:1px solid var(--ink);padding:14px 14px 15px}
  .yt-top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .yt-hint{flex:1;font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.04em;text-align:right}
  .yt-row{display:flex;gap:6px}
  .yt-row input{flex:1;min-width:0;height:36px;padding:0 8px;font-family:var(--mono);font-size:12px;color:var(--ink);background:#FFF;border:1px solid var(--ink);border-radius:0}
  .yt-row input:focus{outline:none;border-color:var(--signal)}
  .yt-row .step{height:36px;min-width:52px}
  .yt-count{margin-left:auto;font-family:var(--mono);font-size:15px;color:var(--brass);font-variant-numeric:tabular-nums;letter-spacing:.04em}
  .yt-stage{position:relative;width:100%;aspect-ratio:16/9;margin-top:10px;background:#0D0F0D;border:1px solid var(--ink)}
  .yt-stage > *{position:absolute;inset:0;width:100%;height:100%;border:0}
  .yt-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
  .yt-sync{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--dim);cursor:pointer}
  .yt-sync input{accent-color:var(--signal);width:14px;height:14px}
  .yt-clear{height:26px;min-width:auto;padding:0 8px;font-size:10.5px;background:var(--panel);border:1px solid var(--rule)}
  .yt-clear:hover{border-color:var(--signal);color:var(--signal)}
  .yt-acts{display:flex;gap:6px}
  .yt-msg{margin-top:8px;font-family:var(--mono);font-size:10.5px;line-height:1.7;color:var(--brass);white-space:pre-line}
  .yt-msg.bad{color:var(--signal)}

  /* sequence header */
  .seq-head{border-top:1px solid var(--ink);padding:13px 14px 0}
  .seq-top{display:flex;align-items:center;gap:10px}
  .seq-name{
    display:block;width:100%;margin:5px 0 0;padding:2px 0 6px;
    font-family:var(--body);font-size:16px;font-weight:500;color:var(--ink);
    background:transparent;border:none;border-bottom:1px solid var(--rule);border-radius:0;
  }
  .seq-name:hover{border-bottom-color:#9AA095}
  .seq-name:focus{outline:none;border-bottom-color:var(--signal)}
  .seq-name::placeholder{color:#A7ABA0}
  .seq-name:disabled{color:var(--ink);border-bottom-color:var(--rule);opacity:.75}
  .seq-sum{flex:1;font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:.06em;text-align:right}
  .hist{display:flex;gap:4px}
  .hist button{width:30px;height:26px;border:1px solid var(--rule);background:var(--panel);font-size:13px;line-height:1;display:grid;place-items:center}
  .hist button:hover:not(:disabled){border-color:var(--ink);background:#EAE9E2}
  .hist button:disabled{opacity:.25;cursor:default}
  .hist button.wide{width:auto;padding:0 8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em}
  .hist button.wide.open{background:var(--ink);color:var(--panel);border-color:var(--ink)}
  /* 未保存（ファイル未書き出し）の間だけ保存ボタンを強調 */
  #saveBtn.unsaved{border-color:var(--signal);color:var(--signal);font-weight:700}
  #saveBtn.unsaved::before{content:"●";font-size:8px;margin-right:4px;vertical-align:1px}

  .hist label.wide{display:inline-flex;align-items:center;justify-content:center;height:26px;padding:0 8px;border:1px solid var(--rule);background:var(--panel);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;cursor:pointer}
  .hist label.wide:hover{border-color:var(--ink);background:#EAE9E2}
  .file-input{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .file-input:focus-visible + label.wide{outline:2px solid var(--signal);outline-offset:2px}
  .io-msg{margin:6px 0 0;font-family:var(--mono);font-size:10.5px;line-height:1.6;color:var(--brass);white-space:pre-line}
  .io-msg.bad{color:var(--signal)}
  body.dropping .device{outline:3px dashed var(--signal);outline-offset:4px}

  /* シーケンス先頭の空白（リード） */
  .lead-wrap{padding:10px 14px 0}
  .lead{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:8px 9px;border:1px dashed var(--rule);background:#FFF}
  .lead.counting{border-color:var(--brass);border-style:solid}
  .lead.counting::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brass)}
  .lead.na{opacity:.4}
  .lead input{width:82px;height:32px;text-align:right;padding:0 8px;font-family:var(--mono);font-size:14px;color:var(--ink);background:#FFF;border:1px solid var(--rule);border-radius:0;font-variant-numeric:tabular-nums}
  .lead input:focus{outline:none;border-color:var(--ink)}
  .lead input:disabled{background:#EDECE6;color:#9A9E93}
  .lead .unit{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .lead-count{margin-left:auto;font-family:var(--mono);font-size:15px;color:var(--brass);font-variant-numeric:tabular-nums;letter-spacing:.04em}
  .lead-sep{width:1px;height:20px;background:var(--rule);margin:0 2px}
  .rec{height:28px;padding:0 10px;border:1px solid var(--signal);background:#F6DCD7;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--signal)}
  .rec:hover:not(:disabled){background:#F0CBC4}
  .rec:disabled{opacity:.32;cursor:default}
  .rec.on{background:var(--signal);border-color:var(--signal);color:#FFF}
  .rec.on:hover:not(:disabled){background:#A62A20;border-color:#A62A20}
  .g-at.hit{color:var(--signal)}

  /* rhythm groups */
  .groups{padding:10px 14px 4px;display:flex;flex-direction:column;gap:8px}
  .g-actions{display:flex;gap:4px;flex:none}
  .group{position:relative;border:1px solid var(--rule);background:#FFF;transition:border-color 120ms}
  .group:not(.active){cursor:pointer}
  .group:not(.active):hover{border-color:#9AA095}
  .groups.locked .group{cursor:default}
  .groups.locked .group:hover{border-color:var(--rule)}
  .groups.locked .group.playing:hover{border-color:var(--rule)}
  .group.active{border-color:var(--ink)}
  .group.playing::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--signal)}
  .group.dragging{z-index:5;box-shadow:5px 5px 0 rgba(25,28,24,.22);border-color:var(--ink)}
  .group.drop-before{box-shadow:inset 0 3px 0 var(--signal)}
  .group.drop-after{box-shadow:inset 0 -3px 0 var(--signal)}

  .g-head{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:8px 9px}
  .handle{width:24px;height:30px;flex:none;border:1px solid var(--rule);background:var(--panel);color:var(--dim);font-size:11px;line-height:1;display:grid;place-items:center;cursor:grab;touch-action:none}
  .handle:active{cursor:grabbing}
  .handle:disabled{opacity:.3;cursor:default}
  .g-name{flex:1 1 110px;min-width:0;height:30px;font-family:var(--body);font-size:13px;color:var(--ink);background:#FFF;border:1px solid var(--rule);border-radius:0;padding:0 7px}
  .g-name:focus{border-color:var(--ink);outline:none}
  .g-title{flex:1 1 90px;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .g-times{font-family:var(--mono);font-size:11.5px;color:var(--brass);white-space:nowrap;letter-spacing:.04em}
  .group.playing .g-times{color:var(--signal)}
  /* 折りたたみ時、タイトルと同じヘッダー行に BPM バッジを右寄せ表示（可変BPM曲の区間判別用）。
     flex 行に置くので、タイトルと横（右寄せ）だけでなく縦（中央）も揃う。再生回数(×N)は従来位置のまま */
  /* 固有BPM／基準追従で見た目は変えない（値は同じ箱表示）。own クラスは追従更新の判定用にのみ使う */
  .g-bpm-tag{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.02em;white-space:nowrap}
  .g-bpm-tag .v{border:1px solid var(--rule);background:#FAF9F5;padding:1px 5px;font-size:11px;font-weight:400;color:var(--ink)}   /* 値は箱（枠）で囲む */
  .group.playing .g-bpm-tag{color:var(--signal)}
  .group.playing .g-bpm-tag .v{border-color:var(--signal);color:var(--signal)}

  .g-sub{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:0 9px 9px 41px}
  .g-sub .g-times{margin-left:auto;font-size:12px}
  .chip{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);padding:2px 6px;background:#FAF9F5;color:var(--dim)}
  .chip.now{background:var(--signal);border-color:var(--signal);color:var(--panel)}
  .chip.none{border-style:dashed}

  .g-body{border-top:1px dashed var(--rule);padding:10px 9px 11px}
  .g-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
  .g-label{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  .g-reps{display:flex;align-items:center;gap:6px}
  .g-reps .x{font-family:var(--display);font-size:20px;color:var(--brass);line-height:1}
  .g-reps input{width:58px;height:32px;font-size:13px}
  /* ヘッダー内のグループ個別BPM。名前とコピー/削除の間にコンパクトに置く（空欄＝基準に追従） */
  .g-hbpm{display:inline-flex;align-items:center;gap:4px;flex:none}
  .g-hbpm .u{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--dim)}
  .g-hbpm input{width:54px;height:30px;font-size:13px}
  /* グループ再生（solo）トグル。展開したカード内。フラットベージュ・全幅 */
  .g-play{margin-top:2px;margin-bottom:0}
  .g-solo{width:100%;height:38px;background:var(--panel);color:var(--ink);border:1px solid var(--rule);
    font-family:var(--mono);font-size:12px;letter-spacing:.04em}
  .g-solo.on{color:var(--signal);border-color:var(--signal)}   /* 再生中＝停止トグル */
  .g-solo:disabled{opacity:.35;cursor:default}
  .g-solo:not(:disabled):active{transform:translateY(1px)}
  /* × [N] 左の現在周回カウンタ（1 × 8 の形）。solo 再生中はライブ更新（highlight） */
  .g-repnow{font-family:var(--mono);font-size:13px;color:var(--ink);min-width:14px;text-align:right}
  .mini{width:28px;height:28px;background:transparent;border:1px solid var(--rule);font-size:11px;line-height:1;display:grid;place-items:center;color:var(--ink)}
  .mini:hover:not(:disabled){background:#EFEEE7;border-color:var(--ink)}
  .mini:disabled{opacity:.25;cursor:default}
  .mini.kill:hover:not(:disabled){background:var(--signal);color:var(--panel);border-color:var(--signal)}

  .g-cue{display:flex;align-items:center;gap:4px;flex:none}
  .g-cue .grab{width:28px;height:28px;padding:0;font-size:11px;line-height:1;background:var(--panel);border:1px solid var(--rule);color:var(--signal)}
  .g-cue .grab:hover:not(:disabled){border-color:var(--signal);color:var(--signal);background:#F6EAE8}
  .g-cue .grab:disabled{opacity:.28;cursor:default}
  .g-cue .nudge{width:22px;height:28px;padding:0;font-size:11px;line-height:1;background:var(--panel);border:1px solid var(--rule);color:var(--dim)}
  .g-cue .nudge:hover{border-color:var(--brass);color:var(--brass);background:#F7F3E9}
  .g-cue .nudge:active{transform:translateY(1px)}
  .g-cue .nudge:disabled{opacity:.25;cursor:default}
  .g-at{font-family:var(--mono);font-size:11px;color:var(--brass);white-space:nowrap;letter-spacing:.02em;min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
  .g-at.none{color:#A7ABA0}

  .bars{display:flex;flex-direction:column;gap:4px}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 3px 3px 8px;border:1px solid var(--rule);background:#FCFBF7}
  .bar.now{border-color:var(--signal);background:#FBF0EE}
  .bar-sig{font-family:var(--mono);font-size:14px;letter-spacing:.06em}
  .bar-sig em{font-style:normal;color:var(--brass);padding:0 2px}
  .bar-ctl{display:flex;gap:3px}
  .empty{font-size:11.5px;line-height:1.7;color:var(--dim);padding:1px 0 3px}

  .g-add{display:flex;align-items:center;gap:6px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--rule)}
  select{height:34px;padding:0 6px;min-width:62px;font-family:var(--mono);font-size:14px;color:var(--ink);background:#FFF;border:1px solid var(--ink);border-radius:0}
  .slash{font-family:var(--display);font-size:22px;color:var(--brass)}
  .g-add .step{height:34px;min-width:56px}

  .addgroup{display:block;width:calc(100% - 28px);margin:6px 14px 14px;height:40px;background:transparent;border:1px dashed var(--ink);font-size:12px;letter-spacing:.06em}
  .addgroup:hover:not(:disabled){background:#EAE9E2}
  .addgroup:disabled{opacity:.3;cursor:default}

  .pulse{display:flex;align-items:baseline;gap:8px;margin-top:14px;padding:0 18px 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--dim)}
  .pulse i{font-style:normal;color:var(--brass)}
  .beats{display:flex;flex-wrap:wrap;gap:7px;padding:0 18px 18px;min-height:13px;border-bottom:1px solid var(--ink)}
  .beat{width:13px;height:13px;border:1px solid var(--ink);border-radius:50%;transition:background 60ms linear,transform 60ms linear}
  .beat.first{border-color:var(--brass);box-shadow:inset 0 0 0 2px rgba(142,113,50,.28)}
  .beat.on{background:var(--signal);border-color:var(--signal);transform:scale(1.35)}
  .beat.first.on{background:var(--brass);border-color:var(--brass);box-shadow:none}

  body.waiting .lamp{background:var(--brass);border-color:var(--brass)}

  /* 選択中（グループ単体再生の対象）カードの表示 */
  .group.selected{border-color:var(--signal)}
  .group.selected::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--signal)}

  /* Material Symbols（Google アイコン）。テキストは ligature 名。読込前/失敗時はサブラベルで意味を担保 */
  .msym{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;
    letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;
    -webkit-font-feature-settings:'liga';font-feature-settings:'liga';-webkit-font-smoothing:antialiased}

  /* ===== 下部固定バー（dock）：拍表示＋再生バー（◁◁ □ ▷▷）＋練習モード入口。編集ペインのどこでも常に見える。
     ベージュ基調のフラットデザイン（濃色の塗りつぶしは使わず、状態はアイコン色で示す） ===== */
  .dock{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
  .dock .pulse{margin-top:10px}
  .dock .beats{border-bottom:none;padding-bottom:12px}

  /* 再生バー：◁◁＝5秒戻す / □＝全体再生・停止（動画時は一時停止・再開） / ▷▷＝5秒送る */
  .playbar{display:grid;grid-template-columns:1fr 1.2fr 1fr;align-items:stretch;border-top:1px solid var(--rule)}
  .pb-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:64px;
    border:none;background:var(--panel);color:var(--ink);font-family:var(--mono);cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  .pb-btn + .pb-btn{border-left:1px solid var(--rule)}
  .pb-glyph{font-size:26px;line-height:1;letter-spacing:-.04em}
  .pb-sub{font-size:9.5px;letter-spacing:.1em;color:var(--dim)}
  .pb-play .pb-glyph{font-size:30px}
  .pb-play.on .pb-glyph{color:var(--signal)}          /* 再生・停止中はアイコンを赤に（塗りつぶさずフラット） */
  .pb-btn:not(:disabled):active{transform:translateY(1px)}
  .pb-btn:disabled{opacity:.3;cursor:default;pointer-events:none}
  @media (prefers-reduced-motion:reduce){.beat{transition:none}}

  /* ===== 全画面モード（横画面・練習HUD）。既存トークンを流用。クラスは fs- で名前空間 =====
     上=セクションタイムライン / 中央=リズムパターンのフォーカス帯（分数・線入り）＋pulse /
     下=操作集約（◁◁・一時停止・▷▷）。サイズはすべて clamp+dvh でビューポート連動。 */
  .fs-enter{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;height:46px;margin:0;
    background:var(--panel);color:var(--ink);border:none;border-top:1px solid var(--rule);
    font-family:var(--mono);font-size:12px;letter-spacing:.12em;cursor:pointer}
  .fs-enter .fs-enter-ic{font-size:18px;color:var(--dim)}
  .fs-enter:active{transform:translateY(1px)}
  body.fs-lock{overflow:hidden}

  .fs-overlay{position:fixed;inset:0;z-index:9990;background:var(--ink);color:var(--panel);
    display:flex;flex-direction:column;overflow:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

  /* 画面の左半分／右半分を大きなタップゾーンに（矢印ボタンに加えて）。
     上部バー（タイムライン・✕）と下部の操作ボタンは z:2 で前面に置き、タップを取り合わない */
  /* 左右のシークは画面端の 1/3 ずつに絞る（中央 1/3 は帯スクロール専用ゾーンに譲る）。 */
  .fs-tapzone{position:absolute;top:calc(env(safe-area-inset-top) + clamp(40px,11dvh,52px));bottom:0;width:33.333%;z-index:1;
    border:none;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;
    display:flex;align-items:center;justify-content:center}
  .fs-tapzone.left{left:0} .fs-tapzone.right{right:0}
  /* 中央 1/3（全高）：帯（カルーセル）を横ドラッグでスクロールする専用ゾーン。左右のシークと領域が重ならない。 */
  .fs-scrollzone{position:absolute;top:calc(env(safe-area-inset-top) + clamp(40px,11dvh,52px));bottom:0;
    left:33.333%;width:33.334%;z-index:1;background:transparent;cursor:grab;
    touch-action:none;-webkit-tap-highlight-color:transparent}
  .fs-scrollzone:active{cursor:grabbing}
  .fs-tapzone:active{background:rgba(245,244,239,.05)}
  /* タップ可能なことを示す控えめなヒント矢印（中央のパターンと重ならないよう外側に薄く） */
  .fs-tapzone .fs-hint{font-family:var(--mono);font-size:clamp(20px,6dvh,26px);color:rgba(245,244,239,.14);
    transition:color 120ms ease}
  .fs-tapzone.left .fs-hint{margin-right:auto;padding-left:clamp(6px,2vw,18px)}
  .fs-tapzone.right .fs-hint{margin-left:auto;padding-right:clamp(6px,2vw,18px)}
  .fs-tapzone:active .fs-hint{color:rgba(245,244,239,.4)}
  .fs-overlay.no-seek .fs-tapzone{pointer-events:none}
  .fs-overlay.no-seek .fs-tapzone .fs-hint{display:none}

  /* 右上に固定表示する ✕ のぶんだけ右パディングを確保し、タイムラインが下に潜り込まないようにする */
  .fs-top{position:relative;z-index:2;flex:0 0 auto;display:flex;align-items:center;gap:clamp(8px,1.6vw,12px);
    padding:clamp(8px,2.4dvh,12px) calc(clamp(12px,2vw,16px) + 48px) 0 clamp(12px,2vw,18px)}
  .fs-rep{font-family:var(--mono);font-size:clamp(11px,3dvh,13px);color:var(--signal);
    font-variant-numeric:tabular-nums;letter-spacing:.04em;white-space:nowrap}
  .fs-rep .of{color:rgba(245,244,239,.4)}
  .fs-rep .u{color:rgba(245,244,239,.45);font-size:.8em;margin-left:2px}
  /* セクション（リズムグループ）バーは横スクロール可能に。グループが多くても ✕ の下や画面外に
     はみ出さず（overflow でボックス内にクリップ）、スワイプで全グループへ到達できる。
     少数グループのときは flex-grow で従来どおり幅いっぱいに広げる。 */
  .fs-timeline{position:relative;flex:1 1 auto;display:flex;gap:3px;height:clamp(24px,7.5dvh,32px);
    overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;
    scroll-snap-type:x proximity;touch-action:pan-x;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .fs-timeline::-webkit-scrollbar{display:none}
  .fs-seg{position:relative;flex-grow:1;flex-basis:0;min-width:clamp(52px,14vw,74px);display:flex;align-items:center;justify-content:center;
    scroll-snap-align:center;
    border:1px solid rgba(245,244,239,.2);background:rgba(245,244,239,.03);overflow:hidden;cursor:pointer;
    font-family:var(--body);font-size:clamp(9px,2.7dvh,11px);letter-spacing:.02em;color:rgba(245,244,239,.5);white-space:nowrap;
    -webkit-tap-highlight-color:transparent}
  .fs-seg:active{background:rgba(245,244,239,.12)}
  .fs-seg.done{opacity:.5}
  .fs-seg.cur{border-color:var(--signal);background:rgba(196,54,42,.16);color:#FFF;font-weight:700}
  .fs-fill{position:absolute;left:0;top:0;bottom:0;background:rgba(196,54,42,.32);z-index:0;transition:width .3s ease}
  .fs-lbl{position:relative;z-index:1;padding:0 6px;overflow:hidden;text-overflow:ellipsis}
  /* ✕ は常にオーバーレイの最前面（フラッシュ z:3・回転案内 z:5 より上）に固定表示し、必ずタップできるようにする */
  .fs-close{position:absolute;z-index:60;
    top:calc(env(safe-area-inset-top) + clamp(8px,2.4dvh,12px));right:calc(env(safe-area-inset-right) + clamp(12px,2vw,16px));
    width:40px;height:30px;border:1px solid rgba(245,244,239,.4);
    background:rgba(25,28,24,.72);color:var(--panel);font-family:var(--mono);font-size:17px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  .fs-close:active{transform:translate(1px,1px)}

  .fs-center{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;
    gap:clamp(8px,2.6dvh,16px);min-height:0;overflow:hidden}
  /* 帯は表示専用（操作は中央スクロールゾーンが担当）。スクロールバーは隠し、両端はマスクでフェード。 */
  .fs-strip-wrap{flex:0 0 auto;position:relative;z-index:2;display:flex;align-items:center;pointer-events:none;
    height:clamp(84px,34dvh,150px);overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 18%,#000 82%,transparent 100%);
            mask-image:linear-gradient(to right,transparent 0,#000 18%,#000 82%,transparent 100%)}
  .fs-strip-wrap::-webkit-scrollbar{display:none}
  .fs-track{display:flex;align-items:center;gap:clamp(8px,1.8vw,14px);padding:0 50vw}
  .fs-fbar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(245,244,239,.26);background:rgba(245,244,239,.04);
    width:clamp(42px,15dvh,66px);height:clamp(42px,16dvh,64px);font-size:clamp(13px,4.4dvh,20px);
    scroll-snap-align:center;
    transition:width .26s ease,height .26s ease,font-size .26s ease,opacity .26s ease,background .26s ease}
  .fs-fbar.done{opacity:.32}
  .fs-fbar.now{width:clamp(80px,30dvh,112px);height:clamp(80px,30dvh,112px);font-size:clamp(26px,9.5dvh,40px);
    background:var(--signal);border-color:var(--signal);box-shadow:0 6px 20px rgba(196,54,42,.32)}
  .fs-fr{display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:var(--mono);font-variant-numeric:tabular-nums;color:rgba(245,244,239,.6);line-height:1}
  .fs-fr .fs-num,.fs-fr .fs-den{font-size:1em}
  .fs-fr .fs-line{width:1em;height:0;border-top:.09em solid rgba(245,244,239,.4);margin:.16em 0}
  .fs-fbar.now .fs-fr{color:#FFF}
  .fs-fbar.now .fs-fr .fs-line{border-top-color:rgba(255,255,255,.85)}
  /* 全リズムグループを1本の帯に連結。境界に区切り線＋グループ名（縦書き）を置き、
     どこからどのグループかを見分けられるようにする（横スクロールで曲全体を辿れる） */
  .fs-gsep{flex:0 0 auto;display:flex;align-items:center;gap:clamp(3px,0.9vw,6px);align-self:center;
    height:clamp(52px,20dvh,84px);margin:0 clamp(2px,0.7vw,8px);padding-left:clamp(4px,1vw,8px);
    border-left:1px solid rgba(245,244,239,.18)}
  .fs-gsep-name{writing-mode:vertical-rl;text-orientation:mixed;max-height:100%;overflow:hidden;
    font-family:var(--body);font-size:clamp(8px,2.2dvh,10px);letter-spacing:.06em;color:rgba(245,244,239,.34)}

  .fs-pulse{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.8dvh,10px);padding:0 20px}
  /* rep（周回）と meter を pulse と同列（拍ドットの下の1行）に並べる */
  .fs-pulse-line{display:flex;align-items:baseline;justify-content:center;gap:clamp(6px,1.6vw,10px);flex-wrap:wrap}
  .fs-sep{font-family:var(--mono);font-size:clamp(10px,2.8dvh,12px);color:rgba(245,244,239,.3)}
  .fs-rep:empty + .fs-sep{display:none}
  .fs-meter{font-family:var(--mono);font-size:clamp(10px,2.8dvh,12px);letter-spacing:.1em;color:rgba(245,244,239,.5)}
  .fs-meter i{font-style:normal;color:var(--brass)}
  .fs-beats{display:flex;flex-wrap:wrap;gap:clamp(8px,2.2vw,12px);justify-content:center;align-items:center;max-width:82vw}
  .fs-beat{width:clamp(10px,2.6dvh,15px);height:clamp(10px,2.6dvh,15px);
    border:1.5px solid rgba(245,244,239,.45);border-radius:50%;transition:background 60ms linear,transform 60ms linear}
  .fs-beat.first{border-color:var(--brass);box-shadow:inset 0 0 0 2.5px rgba(142,113,50,.32)}
  .fs-beat.on{background:var(--signal);border-color:var(--signal);transform:scale(1.4)}
  .fs-beat.first.on{background:var(--brass);border-color:var(--brass);box-shadow:none}

  .fs-controls{position:relative;z-index:2;flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:clamp(18px,5vw,30px);
    padding:clamp(4px,1.4dvh,8px) 16px clamp(8px,2.6dvh,14px)}
  .fs-ctl{display:flex;flex-direction:column;align-items:center;gap:clamp(3px,1dvh,5px);
    background:transparent;border:none;color:var(--panel);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .fs-ctl-glyph{display:flex;align-items:center;justify-content:center;font-family:var(--mono);letter-spacing:-.04em;line-height:1;color:rgba(245,244,239,.92)}
  .fs-ctl-sub{font-family:var(--mono);font-size:clamp(9px,2.6dvh,10px);letter-spacing:.1em;color:rgba(245,244,239,.5)}
  .fs-ctl.fs-seek .fs-ctl-glyph{font-size:clamp(22px,7dvh,30px)}
  .fs-ctl:active .fs-ctl-glyph{opacity:.6}
  .fs-ctl.disabled{opacity:.3;pointer-events:none}
  .fs-ctl.fs-play{gap:clamp(4px,1.2dvh,6px)}
  .fs-ctl.fs-play .fs-ctl-glyph{width:clamp(46px,15dvh,66px);height:clamp(46px,15dvh,66px);border-radius:50%;
    border:1.5px solid rgba(245,244,239,.5);background:rgba(245,244,239,.05);
    transition:transform 90ms ease,background 120ms ease,border-color 120ms ease}
  .fs-ctl.fs-play:active .fs-ctl-glyph{transform:scale(.93)}
  .fs-overlay.is-paused .fs-ctl.fs-play .fs-ctl-glyph{border-color:var(--signal);background:rgba(196,54,42,.2);color:#FFF}
  .fs-overlay.is-busy .fs-controls{opacity:.7}
  .fs-bars2{display:flex;gap:clamp(4px,1.4dvh,6px)}
  .fs-bars2 span{width:clamp(4px,1.4dvh,6px);height:clamp(17px,5.4dvh,24px);background:currentColor;display:block}
  .fs-tri{width:0;height:0;border-style:solid;
    border-width:clamp(9px,2.7dvh,13px) 0 clamp(9px,2.7dvh,13px) clamp(15px,4.5dvh,22px);
    border-color:transparent transparent transparent currentColor;margin-left:clamp(3px,1dvh,4px)}

  .fs-flash{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-size:clamp(44px,14dvh,72px);font-weight:700;color:#FFF;letter-spacing:.02em;
    text-shadow:0 2px 16px rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity 140ms ease}
  .fs-flash.show{opacity:1;transition:opacity 60ms ease}

  .fs-rotate{position:absolute;inset:0;z-index:5;background:var(--ink);color:rgba(245,244,239,.7);
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    font-family:var(--mono);font-size:13px;letter-spacing:.1em}
  .fs-rotate .ic{font-size:44px}
  /* 横向きにできない／したくない場合でも全画面を閉じられるように、回転案内内にも閉じるボタンを置く */
  .fs-rotate-close{margin-top:8px;padding:9px 20px;border:1px solid rgba(245,244,239,.4);
    background:rgba(245,244,239,.06);color:var(--panel);font-family:var(--mono);font-size:12px;letter-spacing:.1em;
    line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .fs-rotate-close:active{transform:translateY(1px)}
  @media (orientation:portrait){ .fs-overlay .fs-rotate{display:flex} }
  @media (prefers-reduced-motion:reduce){.fs-beat,.fs-ctl,.fs-fbar,.fs-track,.fs-flash,.fs-fill{transition:none}}
</style>
</head>
<body>

<main class="device">
  <div class="content">
  <div class="head">
    <div class="wordmark">Metronome</div>
    <div class="status"><span class="lamp"></span><span id="statusText">停止中</span></div>
  </div>

  <section class="readout">
    <div class="bpm-line"><span class="bpm-note">♩ =</span><span class="bpm" id="bpmView">120</span><span class="bpm-unit">BPM</span></div>
    <div class="term" id="termView">Allegro</div>
  </section>

  <section class="scale">
    <input type="range" id="tempoRange" min="50" max="250" step="0.1" value="120" aria-label="テンポ（BPM）">
    <div class="ticks" id="ticks"></div>
  </section>

  <div class="steps">
    <button class="step" data-delta="-10" type="button">−10</button>
    <button class="step" data-delta="-5" type="button">−5</button>
    <span class="gap"></span>
    <button class="step" data-delta="5" type="button">＋5</button>
    <button class="step" data-delta="10" type="button">＋10</button>
  </div>

  <form class="entry" id="tempoForm">
    <label for="tempoInput">直接入力</label>
    <input type="number" id="tempoInput" min="50" max="250" step="0.1" value="120" inputmode="decimal">
    <button class="apply" type="submit">設定</button>
  </form>

  <section class="vol">
    <div class="vol-top">
      <span class="g-label">メトロノームの音量</span>
      <span class="vol-val" id="volVal">50%</span>
    </div>
    <input type="range" id="volRange" min="0" max="100" step="1" value="50" aria-label="メトロノームの音量">
  </section>

  <section class="yt">
    <div class="yt-top">
      <span class="g-label">同時再生</span>
      <span class="yt-hint">YouTube のURLを貼ると、再生ボタンで動画と一緒に鳴ります</span>
    </div>
    <div class="yt-row">
      <input type="url" id="ytUrl" inputmode="url" spellcheck="false"
             placeholder="https://www.youtube.com/watch?v=..." aria-label="YouTube のURL">
      <button class="step" id="ytLoad" type="button">読込</button>
    </div>
    <div class="yt-stage" id="ytStage" hidden><div id="ytFrame"></div></div>
    <div class="yt-foot" id="ytFoot" hidden>
      <label class="yt-sync"><input type="checkbox" id="ytSync" checked><span>メトロノームと同時に再生</span></label>
      <span class="yt-acts">
        <button class="step yt-clear" id="ytClear" type="button">動画を外す</button>
      </span>
    </div>
    <p class="yt-msg" id="ytMsg" hidden></p>
  </section>

  <div class="seq-head">
    <div class="seq-top">
      <span class="g-label">シーケンス</span>
      <span class="seq-sum" id="seqSum"></span>
      <span class="hist">
        <button id="undoBtn" type="button" aria-label="元に戻す" title="元に戻す（Ctrl/⌘+Z）">↶</button>
        <button id="redoBtn" type="button" aria-label="やり直す" title="やり直す（Ctrl/⌘+Shift+Z）">↷</button>
        <button id="saveBtn" class="wide" type="button" title="YAMLファイルに保存">保存</button>
        <button id="loadBtn" class="wide" type="button" title="YAMLファイルを読み込む" hidden>読込</button>
        <input type="file" id="ioFile" class="file-input">
        <label class="wide" for="ioFile" id="ioFileLabel" title="YAMLファイルを読み込む">読込</label>
      </span>
    </div>
    <input class="seq-name" id="seqName" type="text" value="シーケンス1"
           placeholder="シーケンス名" aria-label="シーケンス名" maxlength="60">
    <p class="io-msg" id="ioMsg" role="status" hidden></p>
  </div>

  <div class="lead-wrap">
    <div class="lead" id="lead">
      <span class="g-label">開始までの空白</span>
      <input type="number" id="prerollInput" min="0" max="60" step="0.01" value="0.00"
             inputmode="decimal" aria-label="開始までの空白（秒）" title="全体再生のときだけ効きます">
      <span class="unit">秒</span>
      <span class="lead-sep"></span>
      <span class="g-label">全体レック</span>
      <button class="rec" id="recBtn" type="button" title="動画を先頭から流し、各リズムグループの位置を記録します">● REC</button>
      <span class="lead-count" id="prerollCount" hidden></span>
    </div>
  </div>

  <div class="scroll-body">
    <section class="groups" id="groups"></section>
    <button class="addgroup" id="addGroupBtn" type="button">＋ リズムグループを追加</button>
  </div>
  </div><!-- /content -->

  <!-- ============ 下部固定バー（dock）。編集ペインのどの位置でも常に見える再生バー＋練習モード入口 ============ -->
  <footer class="dock">
    <div class="pulse" id="pulseView"></div>
    <div class="beats" id="beats" aria-hidden="true"></div>

    <!-- 再生バー：◁◁＝5秒戻す / □＝全体再生・停止（動画時は一時停止・再開） / ▷▷＝5秒送る。裏側は既存 Transport / VideoPadService を再利用 -->
    <div class="playbar">
      <button class="pb-btn pb-seek" id="pbSeekL" type="button" aria-label="5秒戻す">
        <span class="pb-glyph msym">fast_rewind</span><span class="pb-sub">5秒戻す</span>
      </button>
      <button class="pb-btn pb-play" id="pbPlay" type="button" aria-label="全体再生／停止">
        <span class="pb-glyph msym" id="pbPlayGlyph">play_arrow</span><span class="pb-sub" id="pbPlaySub">全体再生</span>
      </button>
      <button class="pb-btn pb-seek" id="pbSeekR" type="button" aria-label="5秒送る">
        <span class="pb-glyph msym">fast_forward</span><span class="pb-sub">5秒送る</span>
      </button>
    </div>

    <!-- 全画面（横画面 練習HUD）への入口。常時表示 -->
    <button class="fs-enter" id="fsBtn" type="button"><span class="msym fs-enter-ic">fullscreen</span>練習モード（全画面再生）</button>
  </footer>
</main>

<!-- ============ 全画面モード（横画面 練習HUD）。裏側は既存の Transport / VideoPadService を再利用 ============ -->
<div class="fs-overlay" id="fsOverlay" hidden>
  <!-- ✕ はオーバーレイ直下に置き、常に最前面（z:60）で固定表示する -->
  <button class="fs-close" id="fsClose" type="button" aria-label="全画面を閉じる">✕</button>

  <!-- 左1/3＝5秒戻す／右1/3＝5秒送る／中央1/3（全高）＝帯（カルーセル）の横スクロール専用 -->
  <button class="fs-tapzone left" id="fsTapL" type="button" aria-label="タップで5秒戻す"><span class="fs-hint">◁</span></button>
  <button class="fs-tapzone right" id="fsTapR" type="button" aria-label="タップで5秒送る"><span class="fs-hint">▷</span></button>
  <div class="fs-scrollzone" id="fsScroll" aria-hidden="true"></div>

  <div class="fs-top">
    <div class="fs-timeline" id="fsTimeline"></div>
  </div>

  <div class="fs-center">
    <div class="fs-strip-wrap"><div class="fs-track" id="fsTrack"></div></div>
    <div class="fs-pulse">
      <div class="fs-beats" id="fsBeats" aria-hidden="true"></div>
      <div class="fs-pulse-line">
        <span class="fs-rep" id="fsRep"></span>
        <span class="fs-sep">·</span>
        <span class="fs-meter" id="fsMeter"></span>
      </div>
    </div>
  </div>

  <div class="fs-controls">
    <button class="fs-ctl fs-seek" id="fsSeekL" type="button" aria-label="5秒ずつ戻す">
      <span class="fs-ctl-glyph">◁◁</span><span class="fs-ctl-sub">5秒戻す</span>
    </button>
    <button class="fs-ctl fs-play" id="fsPlay" type="button" aria-label="一時停止／再開">
      <span class="fs-ctl-glyph" id="fsPlayGlyph"><span class="fs-tri"></span></span>
      <span class="fs-ctl-sub" id="fsPlaySub">再生</span>
    </button>
    <button class="fs-ctl fs-seek" id="fsSeekR" type="button" aria-label="5秒ずつ送る">
      <span class="fs-ctl-glyph">▷▷</span><span class="fs-ctl-sub">5秒送る</span>
    </button>
  </div>

  <div class="fs-flash" id="fsFlash" aria-hidden="true"></div>
  <div class="fs-rotate">
    <div class="ic">⟳</div>
    <div>横向きにしてください</div>
    <button class="fs-rotate-close" id="fsRotateClose" type="button">✕ 閉じる</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ============================================================================
     アーキテクチャ（HTML 1ファイル・素の JS・ビルドなし。UI 文言は現状維持）

     レイヤード構成。1つの IIFE の中を宣言順で上から下へ並べ、依存方向は
     「宣言順＋規約」で内向き（ui → usecase → domain）に保つ。infra は usecase が
     定義するインタフェースを実装し、やり取りはプリミティブ／DTO／コールバックで行う。

       domain    … 純粋。エンティティ生成・拍子計算・定数・ID/クランプ・派生計算の唯一の真実
                   Sequence › RhythmGroup › RhythmPattern › Rhythm（DOM も状態も持たない）
       store     … 状態コンテナ。domain entity と編集付随状態を getState/apply/subscribe/
                   snapshot/restore の一定インタフェースで扱う（DOM も再生制御も持たない）
       infra     … ブラウザ API アダプタ。Yaml / SoundGateway / ClockGateway /
                   FileGateway / VideoGateway。結果は戻り値・例外・コールバックで返す
       usecase   … 操作の集約と DTO⇔entity 変換。編集操作はエンティティ階層ごとに分割
                   （SequenceService / GroupService / PatternService / RhythmService）。
                   ほかに HistoryService / SequenceMapper / SequenceIO /
                   PlaybackScheduler / VideoSync / Transport
       ui        … DOM のみ。責務ごとに分割（RhythmView / PatternView / GroupView /
                   SequenceView と TempoView / TransportView / IoView / VideoView）。
                   操作は各サービスを呼び、Store.subscribe と Transport の view を購読して再描画
       bootstrap … 各層を配線（infra を usecase に注入、ui を購読登録）して初期描画

     エンティティ階層（データ構造）:
       Sequence      … 曲ひとつ分（name, tempo, preroll, video, groups）
        └ RhythmGroup … 曲の一区間（id, name, reps, cue, pattern）
            └ RhythmPattern … 拍子の並び（rhythms）。YAML の pattern に対応
                └ Rhythm … 1拍子 例 7/8（num, den）。UI 表示は「拍子」

     再生タイミングの定数は不変（LOOKAHEAD=25 / AHEAD=0.12 ほか）。
     ============================================================================ */

  /* ========================================================================
     domain … 純粋層：エンティティ生成・拍子計算・定数・ID/クランプの唯一の真実。
     DOM・アプリ状態・ファイル・AudioContext・YouTube を一切参照しない。
     階層：Sequence › RhythmGroup › RhythmPattern › Rhythm
       Rhythm        {num, den}          … 1拍子（例 7/8）。den ∈ DENOMS, num は 1..den
       RhythmPattern {rhythms:[Rhythm]}  … 拍子の並び（YAML の pattern に対応）
       RhythmGroup   {id,name,reps,cue,pattern}
       Sequence      {name,tempo,preroll,video,groups} … 曲ひとつ分
     生成はすべてここを通し、reps/cue/name/tempo/preroll の正規化を1箇所に集約する。
     ======================================================================== */
  const Domain = (() => {
    const DENOMS = [2,3,4,6,8,9,12,15,16,32];
    const NUM_MAX = 16;                     // 分子（拍数）の上限。分母から独立（例：5/4 のような変拍子を許容）
    const MIN = 50, MAX = 250;
    const TERMS = [[50,65,"Largo"],[66,75,"Adagio"],[76,107,"Andante"],[108,119,"Moderato"],
                   [120,167,"Allegro"],[168,200,"Presto"],[201,250,"Prestissimo"]];
    const NOTE_NAME = {2:"2分音符",4:"4分音符",8:"8分音符",16:"16分音符",32:"32分音符",
                       3:"2分3連",6:"4分3連",12:"8分3連",9:"全音符÷9",15:"全音符÷15"};

    const uid = () => "g" + Math.random().toString(36).slice(2,9);
    function clampInt(v, lo, hi, fallback){
      const n = Math.round(Number(v));
      if(isNaN(n)) return fallback;
      return Math.min(hi, Math.max(lo, n));
    }
    // テンポ専用クランプ：小数第1位（0.1刻み）へ丸めて [MIN, MAX] に収める。小数BPM（例 175.5）を許容
    function clampTempo(v, fallback){
      const n = Number(v);
      if(isNaN(n)) return fallback;
      const r = Math.round(n * 10) / 10;
      return Math.min(MAX, Math.max(MIN, r));
    }
    // グループ個別 BPM の正規化：null/空/不正なら null（＝基準 BPM に追従）、値があれば clampTempo
    function normBpm(v){
      if(v == null || v === "") return null;
      const n = Number(v);
      if(isNaN(n)) return null;
      return clampTempo(n, null);
    }
    // 実効 BPM：グループの上書きがあればそれ、無ければ基準（上部メトロノーム）の BPM
    const effectiveBpm = (group, baseBpm) => (group && group.bpm != null) ? group.bpm : baseBpm;
    const makeRhythm = (num, den) => ({num: Number(num), den: Number(den)});
    // 文字列 "7/8" または {meter} を検証しつつ Rhythm 化。不正なら null（読み込み時の取りこぼし数え上げ用）
    function parseRhythm(v){
      if(v == null) return null;
      const m = String(v).trim().match(/^(\d+)\s*\/\s*(\d+)$/);
      if(!m) return null;
      const num = Number(m[1]), den = Number(m[2]);
      if(!DENOMS.includes(den)) return null;
      if(num < 1 || num > NUM_MAX) return null;
      return {num, den};
    }
    const formatRhythm = r => r.num + "/" + r.den;
    const rhythmSeconds = (den, bpm) => (60/bpm) * (4/den);
    const termFor = v => (TERMS.find(t=>v>=t[0]&&v<=t[1])||[,,""])[2];
    const makePattern = rhythms => ({rhythms: (rhythms||[]).map(r=>makeRhythm(r.num, r.den))});
    // 動画位置（cue）1つ分の正規化：null / 0以上を小数2桁へ
    function normCue(v){
      const n = Number(v);
      return (v == null || isNaN(n) || n < 0) ? null : Math.round(n * 100) / 100;
    }
    // rep 単位のタイムコード配列を reps の長さに整える（不足は null 埋め、超過は切り詰め）
    function fitCues(arr, reps){
      const out = [];
      for(let i = 0; i < reps; i++) out.push(normCue(arr && arr[i]));
      return out;
    }
    function makeGroup(spec){
      spec = spec || {};
      const rhythms = spec.rhythms || (spec.pattern && spec.pattern.rhythms) || [];
      const reps = clampInt(spec.reps, 1, 999, 1);
      return {
        id: uid(),
        name: (spec.name == null || String(spec.name) === "") ? "リズムグループ" : String(spec.name),
        reps: reps,
        bpm: normBpm(spec.bpm),                 // このグループ個別の BPM。null=基準（上部メトロノーム）に追従
        cue: normCue(spec.cue),                 // グループ先頭（=rep0）の動画位置。後方互換で維持
        repCues: fitCues(spec.repCues, reps),   // 各くり返し(rep)の動画位置。パッドの位置突き合わせに使う（UI なし）
        pattern: makePattern(rhythms)
      };
    }
    function cloneGroup(g){
      return {
        id: uid(),
        name: g.name + " のコピー",
        reps: g.reps,
        bpm: g.bpm != null ? g.bpm : null,
        cue: g.cue,
        repCues: fitCues(g.repCues, g.reps),
        pattern: {rhythms: g.pattern.rhythms.map(r=>({num:r.num, den:r.den}))}
      };
    }
    // Sequence entity：バラバラの name/tempo/preroll/video/groups を1つに正規化する
    function makeSequence(spec){
      spec = spec || {};
      const pre = Number(spec.preroll);
      return {
        name: (spec.name == null || String(spec.name) === "") ? "無題のシーケンス" : String(spec.name),
        tempo: clampTempo(spec.tempo, 120),
        preroll: isNaN(pre) ? 0 : Math.min(60, Math.max(0, pre)),
        video: spec.video == null ? null : spec.video,
        groups: (spec.groups || []).map(g => (g && g.id) ? g : makeGroup(g))
      };
    }
    // 派生計算：サマリー表示（くり返し込みの総小節数）と、取り込みメッセージ（くり返し無視の拍子数）
    const summaryCounts = groups => ({
      groups: groups.length,
      bars: groups.reduce((n,g)=>n + g.pattern.rhythms.length * g.reps, 0)
    });
    const totalBars = groups => groups.reduce((n,g)=>n + g.pattern.rhythms.length, 0);

    return {
      DENOMS, NUM_MAX, MIN, MAX, TERMS, NOTE_NAME,
      uid, clampInt, clampTempo, normBpm, effectiveBpm, normCue, fitCues, makeRhythm, parseRhythm, formatRhythm, rhythmSeconds,
      termFor, makePattern, makeGroup, cloneGroup,
      makeSequence, summaryCounts, totalBars
    };
  })();


  const $ = id => document.getElementById(id);

  /* ========================================================================
     store … 状態コンテナ。domain entity（RhythmGroup 群）と編集用の付随状態を
     一定インタフェース（getState/select/apply/subscribe/snapshot/restore）で扱う。
     DOM も再生時制御（running/mode…）も持たない（それらは usecase/transport 側）。
     ======================================================================== */
  const Store = (() => {
    const state = {
      bpm: 120,
      pickNum: 4, pickDen: 4,          // 「拍子を追加」用のピッカー状態
      seqName: "シーケンス1",
      groupSeq: 1,
      groups: [Domain.makeGroup({name:"リズムグループ1", rhythms:[{num:4,den:4}], reps:8})],
      activeId: null,
      preroll: 0
    };
    state.activeId = state.groups[0].id;
    const listeners = [];
    const emit = meta => { for(const fn of listeners) fn(meta || {}); };
    return {
      getState: () => state,
      select: fn => fn(state),
      // patch は部分オブジェクト、または state を直接いじる updater 関数。meta は UI への変更ヒント
      apply(patch, meta){
        if(typeof patch === "function") patch(state);
        else if(patch) Object.assign(state, patch);
        emit(meta);
      },
      subscribe(fn){ listeners.push(fn); },
      findGroup: id => state.groups.find(g => g.id === id),
      // 履歴に載せる編集状態のみを直列化（テンポ・preroll は対象外）
      snapshot(){
        return JSON.stringify({
          seqName: state.seqName, groups: state.groups, activeId: state.activeId,
          groupSeq: state.groupSeq, pickNum: state.pickNum, pickDen: state.pickDen
        });
      },
      restore(s){
        const d = JSON.parse(s);
        state.groups = d.groups; state.activeId = d.activeId; state.groupSeq = d.groupSeq;
        state.pickNum = d.pickNum; state.pickDen = d.pickDen; state.seqName = d.seqName;
        if(state.activeId && !state.groups.some(g=>g.id===state.activeId)) state.activeId = null;
      }
    };
  })();

  /* ========================================================================
     infra … ブラウザ API アダプタ層。usecase からはプリミティブ／DTO で呼ばれ、
     結果は戻り値・例外・コールバックで返す（DOM の say などは呼ばない）。
       Yaml         … このスキーマ用の最小エンコーダ／パーサ（純粋）
       SoundGateway … AudioContext のライフサイクルとクリック音合成
       ClockGateway … タイミング源（AudioContext 時刻・setInterval・rAF・背面判定）
       FileGateway  … 保存／読込（File System Access API と Blob/input フォールバック）
       VideoGateway … YouTube IFrame API アダプタ
     ======================================================================== */

  /* ---------- Yaml（純粋：このスキーマ用の最小エンコーダ／パーサ。DOM もアプリ状態も参照しない） ----------
     scalarStr … 値を必要なときだけクォートして書き出す
     stringify … 保存用 DTO（version/kind/name/tempo/preroll/video/groups）を YAML 文字列へ
     parse     … テキストを素の JS オブジェクト（map/list/scalar）へ。ドメインへの変換は Mapper 側 */
  const Yaml = (() => {
    function scalarStr(v){
      const t = String(v);
      const needsQuote = t === "" || /^\s|\s$/.test(t) || /[:#\[\]{},&*!|>'"%@`]/.test(t)
        || /^(true|false|null|yes|no|on|off|~|-|\d)/i.test(t);
      return needsQuote ? '"' + t.replace(/\\/g,"\\\\").replace(/"/g,'\\"') + '"' : t;
    }
    function stripComment(line){
      let q = null, out = "";
      for(let i=0;i<line.length;i++){
        const c = line[i];
        if(q){ out += c; if(c === q) q = null; continue; }
        if(c === '"' || c === "'"){ q = c; out += c; continue; }
        if(c === "#" && (i === 0 || /\s/.test(line[i-1]))) break;
        out += c;
      }
      return out.replace(/\s+$/, "");
    }
    function unquote(t){
      if(/^".*"$/s.test(t)) return t.slice(1,-1).replace(/\\"/g,'"').replace(/\\\\/g,"\\");
      if(/^'.*'$/s.test(t)) return t.slice(1,-1).replace(/''/g,"'");
      return t;
    }
    function scalar(t){
      t = t.trim();
      if(t.startsWith("[") && t.endsWith("]")){
        const inner = t.slice(1,-1).trim();
        return inner === "" ? [] : inner.split(",").map(x=>scalar(x.trim()));
      }
      if(/^["']/.test(t)) return unquote(t);
      if(t === "" || t === "~" || t === "null") return null;
      if(t === "true") return true;
      if(t === "false") return false;
      if(/^-?\d+(\.\d+)?$/.test(t)) return Number(t);
      return t;
    }
    function parse(text){
      const lines = [];
      text.replace(/\r\n?/g,"\n").split("\n").forEach((raw,idx)=>{
        const line = stripComment(raw);
        if(!line.trim() || /^(---|\.\.\.)\s*$/.test(line.trim())) return;
        lines.push({indent: line.match(/^ */)[0].length, text: line.trim(), no: idx+1});
      });
      let i = 0;
      const isItem = l => l.text === "-" || l.text.startsWith("- ");
      const looksMap = t => /^[^\s].*?:(\s|$)/.test(t);

      function block(indent){
        if(i >= lines.length) return null;
        return isItem(lines[i]) ? list(indent) : map(indent);
      }
      function map(indent){
        const obj = {};
        while(i < lines.length && lines[i].indent === indent && !isItem(lines[i])){
          const l = lines[i];
          const m = l.text.match(/^([^:]+):\s*(.*)$/);
          if(!m) throw new Error(l.no + " 行目を解釈できません: " + l.text);
          const key = m[1].trim(), rest = m[2].trim();
          if(rest === ""){
            i++;
            obj[key] = (i < lines.length && lines[i].indent > indent) ? block(lines[i].indent) : null;
          }else{
            obj[key] = scalar(rest); i++;
          }
        }
        return obj;
      }
      function list(indent){
        const arr = [];
        while(i < lines.length && lines[i].indent === indent && isItem(lines[i])){
          const l = lines[i];
          const off = l.text.match(/^-\s*/)[0].length;
          const rest = l.text.slice(off).trim();
          if(rest === ""){
            i++;
            arr.push(i < lines.length && lines[i].indent > indent ? block(lines[i].indent) : null);
          }else if(looksMap(rest)){
            const virt = l.indent + off;
            lines[i] = {indent: virt, text: rest, no: l.no};
            arr.push(map(virt));
          }else{
            arr.push(scalar(rest)); i++;
          }
        }
        return arr;
      }
      return block(lines.length ? lines[0].indent : 0);
    }
    // 保存用 DTO → YAML（version/kind/name/tempo/[preroll]/[video]/groups[{name,repeat,[cue],pattern}]）
    function stringify(dto){
      const L = ["version: " + dto.version, "kind: " + dto.kind, "",
                 "name: " + scalarStr(dto.name), "tempo: " + dto.tempo];
      if(dto.preroll != null) L.push("preroll: " + dto.preroll.toFixed(2));
      if(dto.video) L.push("video: " + scalarStr(dto.video));
      L.push("", "groups:");
      dto.groups.forEach(g=>{
        L.push("  - name: " + scalarStr(g.name));
        L.push("    repeat: " + g.repeat);
        if(g.bpm != null) L.push("    bpm: " + g.bpm);   // 上書きがあるグループだけ出力
        if(g.cue != null) L.push("    cue: " + g.cue.toFixed(2));
        if(g.repCues) L.push("    repCues: [" + g.repCues.map(v => v == null ? "null" : v.toFixed(2)).join(", ") + "]");
        L.push("    pattern: [" + g.pattern.join(", ") + "]");
      });
      return L.join("\n") + "\n";
    }
    return { scalarStr, parse, stringify };
  })();

  /* ---------- DraftGateway（下書きの永続化境界。localStorage を安全に叩く純粋アダプタ。
     Safari プライベートや QuotaExceeded でも例外を投げず、使えなければ黙って no-op に倒す） ---------- */
  const DraftGateway = (() => {
    const PREFIX = "csm:draft:";              // 曲名ごとの下書き（localStorage は origin 単位なので識別子は自前で付ける）
    const POINTER = "csm:draft.active";       // 直近に編集していた曲名（起動時復元の手がかり）
    // 実書き込みで使用可否を一度だけ判定（getItem だけでは Safari プライベートを見抜けない）
    const available = (() => {
      try{
        const k = "csm:draft.probe";
        window.localStorage.setItem(k, "1");
        window.localStorage.removeItem(k);
        return true;
      }catch(_){ return false; }
    })();
    const keyFor = name => PREFIX + name;
    function read(name){
      if(!available) return null;
      try{ return window.localStorage.getItem(keyFor(name)); }catch(_){ return null; }
    }
    function write(name, text){
      if(!available) return false;
      try{ window.localStorage.setItem(keyFor(name), text); return true; }catch(_){ return false; }
    }
    function remove(name){
      if(!available) return;
      try{ window.localStorage.removeItem(keyFor(name)); }catch(_){}
    }
    function setActive(name){
      if(!available) return;
      try{ name == null ? window.localStorage.removeItem(POINTER) : window.localStorage.setItem(POINTER, name); }catch(_){}
    }
    function getActive(){
      if(!available) return null;
      try{ return window.localStorage.getItem(POINTER); }catch(_){ return null; }
    }
    return { available, read, write, remove, setActive, getActive };
  })();

  /* ---------- SoundGateway（AudioContext のライフサイクルとクリック音合成。刻みの進行や DOM は持たない） ---------- */
  const SoundGateway = (() => {
    let ctx = null;
    // 音量係数。スライダー50%＝1.0（既定音量）、0%＝0.0（無音）、100%＝2.0（最大）。
    let vol = 1;
    function ensure(){
      if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if(ctx.state === "suspended") ctx.resume();
      return ctx;
    }
    function now(){ return ctx ? ctx.currentTime : 0; }
    function setVolume(factor){ vol = Math.max(0, factor); }
    function click(accent, time, span){
      const peak = (accent ? 0.35 : 0.22) * vol;
      if(peak < 0.0002) return;   // 無音（スライダー0%付近）なら発音しない
      const decay = Math.min(0.045, span * 0.55);
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = "square";
      osc.frequency.value = accent ? 1760 : 880;
      // 立ち上がりの2msランプ（＝冒頭の空白）をなくし、time ちょうどで最大音量から鳴らす。
      // これがあると発音が数ms遅れて「少しズレて」聞こえていた。
      gain.gain.setValueAtTime(peak, time);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + decay);
      osc.connect(gain).connect(ctx.destination);
      osc.start(time); osc.stop(time + decay + 0.015);
    }
    return { ensure, now, click, setVolume, get ready(){ return !!ctx; } };
  })();

  /* ---------- ClockGateway（タイミング源。刻みは AudioContext 時刻、UI 更新は rAF、先読みは setInterval） ---------- */
  const ClockGateway = {
    now(){ return SoundGateway.now(); },   // AudioContext 時刻（刻みの基準）
    perf(){ return performance.now(); },   // 経過時間の計測（頭出しのタイムアウト用）
    hidden(){ return document.hidden; },   // 背面タブ判定（先読み延長用）
    every(ms, fn){ const id = setInterval(fn, ms); return () => clearInterval(id); },
    frame(fn){ return requestAnimationFrame(fn); }
  };

  /* ---------- FileGateway（保存／読込のブラウザ境界。文字列とやり取りし、DOM メッセージは呼ばない） ---------- */
  const FileGateway = (() => {
    const canSavePicker = typeof window.showSaveFilePicker === "function";
    const canOpenPicker = typeof window.showOpenFilePicker === "function";
    const FILE_TYPES = [{description:"メトロノーム シーケンス", accept:{"text/yaml":[".yml",".yaml"]}}];
    // 保存：ダイアログ→（不可／失敗なら）Blob ダウンロード。{name,via} / {cancelled} を返し、書けなければ例外
    async function save(name, text){
      if(canSavePicker){
        try{
          const handle = await window.showSaveFilePicker({suggestedName:name, types:FILE_TYPES});
          const w = await handle.createWritable();
          await w.write(text);
          await w.close();
          return {name: handle.name, via: "picker"};
        }catch(err){
          if(err && err.name === "AbortError") return {cancelled: true};   // キャンセルは黙って戻る
          // それ以外は Blob フォールバックへ
        }
      }
      try{
        const blob = new Blob([text], {type:"text/yaml;charset=utf-8"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url), 1000);
        return {name, via: "blob"};
      }catch(err){
        throw new Error("write-unavailable");
      }
    }
    async function open(){
      const [handle] = await window.showOpenFilePicker({multiple:false, types:FILE_TYPES});
      const file = await handle.getFile();
      return await file.text();
    }
    function readFile(file){
      return new Promise((resolve, reject)=>{
        const r = new FileReader();
        r.onload = () => resolve(String(r.result));
        r.onerror = () => reject(new Error("read-failed"));
        r.readAsText(file);
      });
    }
    return { canSavePicker, canOpenPicker, save, open, readFile };
  })();

  /* ---------- VideoGateway（YouTube IFrame API アダプタ。usecase へは秒数／状態などプリミティブで返す） ----------
     再生位置・状態はメソッドで、頭出し中の状態変化はコールバック（onReady/onPlaying/onStopped/onMsg）で通知する。 */
  const VideoGateway = (() => {
    let ytPlayer = null, ytReady = false, apiTimer = null, ytCurrent = null;
    let deps = { onMsg(){}, onReady(){}, onPlaying(){}, onStopped(){}, syncEnabled(){ return false; } };
    const stage = $("ytStage"), foot = $("ytFoot");
    // file:// や content:// で開くと Referer が付かず、埋め込みが 153 で弾かれる
    const embedBlocked = !/^https?:$/.test(location.protocol);
    const LOCAL_NOTE = "このHTMLをローカルファイルとして開いているため、YouTubeの埋め込みは再生できません（エラー153）。\n"
      + "Webサーバー経由で開くと動きます（例：置いたフォルダで python3 -m http.server → http://localhost:8000/…）。";
    const ERROR_NOTE = {
      2:   "URLが正しくないようです",
      5:   "この動画はプレイヤーで再生できません",
      100: "動画が見つかりません（削除／非公開）",
      101: "この動画は埋め込み再生が許可されていません",
      150: "この動画は埋め込み再生が許可されていません",
      153: LOCAL_NOTE
    };

    function parse(raw){
      const text = String(raw || "").trim();
      if(!text) return null;
      const m = text.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([A-Za-z0-9_-]{11})/)
             || text.match(/^([A-Za-z0-9_-]{11})$/);
      if(!m) return null;
      let start = 0;
      const t = text.match(/[?&](?:t|start)=([^&#]+)/);
      if(t){
        const v = t[1];
        if(/^\d+s?$/.test(v)) start = parseInt(v, 10);
        else{
          const hms = v.match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/);
          if(hms) start = (+(hms[1]||0))*3600 + (+(hms[2]||0))*60 + (+(hms[3]||0));
        }
      }
      return {id:m[1], start};
    }
    function withApi(cb){
      if(window.YT && window.YT.Player) return cb();
      const prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = function(){
        if(typeof prev === "function") prev();
        clearTimeout(apiTimer);
        cb();
      };
      if(!document.getElementById("yt-api")){
        const tag = document.createElement("script");
        tag.id = "yt-api";
        tag.src = "https://www.youtube.com/iframe_api";
        tag.onerror = ()=>deps.onMsg("YouTube を読み込めませんでした（オフライン、または通信が遮断されています）", true);
        document.head.appendChild(tag);
      }
      clearTimeout(apiTimer);
      apiTimer = setTimeout(()=>{
        if(!(window.YT && window.YT.Player)) deps.onMsg("YouTube を読み込めませんでした（オフライン、または通信が遮断されています）", true);
      }, 8000);
    }
    function mount(v){
      ytCurrent = v;
      stage.hidden = false;
      foot.hidden = false;
      if(embedBlocked){ deps.onMsg(LOCAL_NOTE, true); }
      else{ deps.onMsg("読み込み中…", false); }
      withApi(()=>{
        if(ytPlayer && ytReady){
          try{ ytPlayer.cueVideoById({videoId:v.id, startSeconds:v.start}); deps.onMsg("", false); return; }catch(err){}
        }
        ytPlayer = new YT.Player("ytFrame", {
          videoId: v.id,
          playerVars: {playsinline:1, rel:0, modestbranding:1, start:v.start},
          events: {
            onReady: ()=>{ ytReady = true; deps.onReady(); },
            onError: e=>deps.onMsg(ERROR_NOTE[e.data] || ("再生できません（エラー " + e.data + "）"), true),
            onStateChange: e=>{
              if(e.data === YT.PlayerState.PLAYING){ deps.onPlaying(); }
              else if(e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED){ deps.onStopped(); }
            }
          }
        });
      });
    }
    function clear(){
      try{ ytPlayer && ytPlayer.destroy(); }catch(err){}
      ytPlayer = null; ytReady = false;
      const holder = document.createElement("div");
      holder.id = "ytFrame";
      stage.innerHTML = ""; stage.appendChild(holder);
      stage.hidden = true; foot.hidden = true;
      ytCurrent = null;
    }
    function url(){
      if(!ytCurrent) return "";
      return "https://www.youtube.com/watch?v=" + ytCurrent.id + (ytCurrent.start ? "&t=" + ytCurrent.start : "");
    }
    function armed(){ return ytReady && deps.syncEnabled() && !!ytPlayer && !embedBlocked; }
    function pause(){ if(ytReady && ytPlayer && deps.syncEnabled()){ try{ ytPlayer.pauseVideo(); }catch(err){} } }
    // プレイヤ操作（例外は呼び出し側で握る＝原実装と同じ挙動）
    function seekTo(sec, allow){ ytPlayer.seekTo(sec, allow); }
    function play(){ ytPlayer.playVideo(); }
    function time(){ return ytPlayer.getCurrentTime(); }
    function duration(){ return ytPlayer.getDuration(); }
    function stateCode(){ return ytPlayer.getPlayerState(); }

    return {
      init(o){ deps = Object.assign(deps, o); },
      parse, mount, clear, url, armed, pause, seekTo, play, time, duration, stateCode,
      syncOn: () => deps.syncEnabled(),
      ready: () => ytReady
    };
  })();


  /* ========================================================================
     usecase … 操作インタフェースの集約と DTO⇔entity 変換。ui からはここだけを呼び、
     infra は内向き（コールバック／戻り値）で使う。DOM 反映は ui に委譲する。
       HistoryService … 汎用 undo/redo（capture/apply は Store.snapshot/restore に配線）
       編集操作サービス … エンティティ階層ごとに分割。SequenceService（全体設定＋グループ集合）/
                     GroupService（名前・くり返し・cue）/ PatternService（拍子の並び）/
                     RhythmService（追加ピッカー）。各操作は commit＋Store.apply を束ねる
       SequenceMapper … entity ⇔ 保存用 DTO（reps⇔repeat の対応もここ）
       SequenceIO     … 保存／読込のオーケストレーション（結果メッセージを戻り値で返す）
       PlaybackScheduler … 先読みスケジューラ（クリック予約とビートイベント列 queue）
       VideoSync      … 動画の頭出し／助走／cue 記録（VideoGateway を駆動）
       Transport      … 再生ステートマシン（all/solo/lead・preroll・全REC・動画同期の統括）
     ======================================================================== */

  /* ---------- HistoryService（汎用：past/future スタックと undo/redo。記録/復元は capture/apply に委譲） ---------- */
  const HistoryService = (() => {
    const MAX = 60;
    let past = [], future = [];
    let capture = () => "", apply = () => {}, onChange = () => {};
    return {
      init(o){ capture = o.capture; apply = o.apply; onChange = o.onChange || (()=>{}); },
      commit(){ past.push(capture()); if(past.length > MAX) past.shift(); future.length = 0; onChange(); },
      undo(){ if(!past.length) return; future.push(capture()); apply(past.pop()); onChange(); },
      redo(){ if(!future.length) return; past.push(capture()); apply(future.pop()); onChange(); },
      canUndo(){ return past.length > 0; },
      canRedo(){ return future.length > 0; }
    };
  })();

  /* ---------- 編集操作サービス（エンティティ階層ごとに責務を分割。UI はこれらを呼ぶ） ----------
     Store.apply の meta フラグ（UI への再描画ヒント）：
       render=グループ再描画 / idle=停止時プレビュー更新 / tempo=テンポ表示 /
       preroll=空白入力の整形 / seqName=名前入力＋タイトル / seqTitle=タイトルのみ /
       focusHandle=並び替え後にフォーカスするハンドルの id
     各サービスは HistoryService.commit()（テンポ・名前入力中・微調整・ピッカーを除く）と
     Store.apply() を束ね、DOM には触れない。 */

  /* SequenceService … シーケンス全体：全体設定（名前/テンポ/空白）とグループ集合の操作 */
  const SequenceService = (() => {
    return {
      setName(name){
        Store.apply(s => { s.seqName = name; }, {seqTitle:true});
      },
      setTempo(v, from){            // テンポは履歴対象外
        const cur = Store.getState().bpm;
        v = Number(v);
        if(isNaN(v)) v = cur;
        const bpm = Math.min(Domain.MAX, Math.max(Domain.MIN, Math.round(v * 10) / 10));
        Store.apply({bpm}, {tempo:true, idle:true, from});
      },
      setPreroll(raw){              // 空白（秒）。0..60 に丸めて 2桁へ。meta で入力欄も整形
        let v = Number(raw);
        if(isNaN(v)) v = 0;
        v = Math.min(60, Math.max(0, Math.round(v * 100) / 100));
        Store.apply({preroll: v}, {preroll:true});
        return v;
      },
      addGroup(){
        HistoryService.commit();
        Store.apply(s => {
          s.groupSeq++;
          const g = Domain.makeGroup({name:"リズムグループ"+s.groupSeq, reps:8});
          s.groups.push(g);
          s.activeId = g.id;
        }, {render:true});
      },
      duplicateGroup(id){
        HistoryService.commit();
        Store.apply(s => {
          const i = s.groups.findIndex(g=>g.id===id);
          const copy = Domain.cloneGroup(s.groups[i]);
          s.groups.splice(i+1, 0, copy);
          s.activeId = copy.id;
        }, {render:true, idle:true});
      },
      removeGroup(id){
        if(Store.getState().groups.length <= 1) return;
        HistoryService.commit();
        Store.apply(s => {
          const i = s.groups.findIndex(g=>g.id===id);
          s.groups.splice(i,1);
          if(s.activeId === id) s.activeId = null;
        }, {render:true, idle:true});
      },
      moveGroup(from, to){
        const s = Store.getState();
        if(to < 0 || to >= s.groups.length || from === to) return;
        HistoryService.commit();
        const id = s.groups[from].id;
        Store.apply(st => { const [g] = st.groups.splice(from,1); st.groups.splice(to,0,g); }, {render:true, focusHandle:id});
      },
      toggleActive(id){
        Store.apply(s => { s.activeId = (s.activeId === id) ? null : id; }, {render:true});
      },
      setActive(id){                 // 選択（トグルせず必ずそのグループを対象に）：再生モードの頭出し対象
        Store.apply(s => { s.activeId = id; }, {render:true});
      },
      // 読み込んだ Sequence でまるごと差し替える（applyDoc 相当の副作用オーケストレーション）
      replaceSequence(sequence, notes, rawVideo){
        if(Transport.running()) Transport.stop(false);
        HistoryService.commit();                            // 読み込みも Undo で戻せる
        Store.apply(s => {
          s.seqName = sequence.name;
          s.groups = sequence.groups;
          s.groupSeq = sequence.groups.length;
          s.activeId = null;
        }, {seqName:true});
        SequenceService.setTempo(sequence.tempo);
        SequenceService.setPreroll(sequence.preroll);
        if(rawVideo != null){
          const v = VideoGateway.parse(rawVideo);
          if(v) VideoGateway.mount(v); else notes.push("video のURLを読めませんでした");
        }
        Store.apply(null, {render:true, idle:true});
      }
    };
  })();

  /* GroupService … リズムグループ単体の属性：名前・くり返し・動画位置（cue / rep 単位の repCues） */
  const GroupService = (() => {
    return {
      setName(id, name){
        Store.apply(s => { const g = s.groups.find(x=>x.id===id); if(g) g.name = name; }, {});
      },
      setReps(id, value){
        HistoryService.commit();
        Store.apply(s => {
          const g = s.groups.find(x=>x.id===id);
          let v = Math.round(Number(value));
          if(isNaN(v)) v = 1;
          g.reps = Math.min(999, Math.max(1, v));
          g.repCues = Domain.fitCues(g.repCues, g.reps);   // reps に合わせて rep 別 cue の長さを同期
        }, {render:true});
      },
      // このグループ個別の BPM。空/不正なら null＝基準（上部メトロノーム）に追従
      setBpm(id, value){
        HistoryService.commit();
        Store.apply(s => {
          const g = s.groups.find(x=>x.id===id);
          if(g) g.bpm = Domain.normBpm(value);
        }, {render:true});
      },
      setCue(id, value){            // グループ先頭（rep0）の記録・解除（commit＋再描画）
        HistoryService.commit();
        Store.apply(s => {
          const g = s.groups.find(x=>x.id===id);
          if(g){ g.cue = value; if(Array.isArray(g.repCues)) g.repCues[0] = value; }
        }, {render:true});
      },
      nudgeCue(id, value){          // ± 微調整（commit は呼び出し側で連打をまとめる。再描画なし）
        Store.apply(s => {
          const g = s.groups.find(x=>x.id===id);
          if(g){ g.cue = value; if(Array.isArray(g.repCues)) g.repCues[0] = value; }
        }, {});
      }
    };
  })();

  /* PatternService … リズムパターン（グループ内の拍子の並び）の編集 */
  const PatternService = (() => {
    return {
      addRhythm(id, num, den){
        HistoryService.commit();
        Store.apply(s => { s.groups.find(x=>x.id===id).pattern.rhythms.push(Domain.makeRhythm(num, den)); }, {render:true, idle:true});
      },
      moveRhythm(id, i, dir){
        const g = Store.findGroup(id);
        const rs = g.pattern.rhythms;
        const j = i + dir;
        if(j < 0 || j >= rs.length) return;
        HistoryService.commit();
        Store.apply(() => { [rs[i], rs[j]] = [rs[j], rs[i]]; }, {render:true});
      },
      removeRhythm(id, i){
        HistoryService.commit();
        Store.apply(s => { s.groups.find(x=>x.id===id).pattern.rhythms.splice(i,1); }, {render:true, idle:true});
      }
    };
  })();

  /* RhythmService … 1拍子（リズム）を組むための「拍子を追加」ピッカー状態（再描画は呼び出し側で） */
  const RhythmService = (() => {
    return {
      setPicker(num, den){
        Store.apply(s => { if(num != null) s.pickNum = num; if(den != null) s.pickDen = den; }, {});
      }
    };
  })();

  /* ---------- SequenceMapper（entity ⇔ 保存用 DTO。書き側 repeat⇔実行時 reps の対応もここ） ---------- */
  const SequenceMapper = (() => {
    function toDto(seq){
      return {
        version: 1,
        kind: "metronome.sequence",
        name: seq.name,
        tempo: seq.tempo,
        preroll: (seq.preroll > 0) ? seq.preroll : null,
        video: seq.video || null,
        groups: seq.groups.map(g => ({
          name: g.name,
          repeat: g.reps,
          // グループ個別 BPM は上書きがあるときだけ出力（無ければ非出力＝基準追従・後方互換）
          bpm: (g.bpm != null) ? g.bpm : null,
          cue: (g.cue != null) ? g.cue : null,
          // rep 別 cue は1つでも記録があるときだけ出力（無ければ従来どおり非出力＝後方互換）
          repCues: (g.repCues && g.repCues.some(v => v != null)) ? g.repCues.slice(0, g.reps) : null,
          pattern: g.pattern.rhythms.map(Domain.formatRhythm)
        }))
      };
    }
    // 取り込み（Yaml.parse の生オブジェクト → entity）。寛容側：不正な拍子だけ落として数え上げる
    function toEntity(doc){
      if(!doc || typeof doc !== "object" || Array.isArray(doc)) throw new Error("シーケンスの形式ではありません");
      if(!Array.isArray(doc.groups)) throw new Error("groups が見つかりません");

      const notes = [];
      if(doc.version != null && Number(doc.version) !== 1) notes.push("version " + doc.version + " は未知のため v1 として読み込みました");

      let dropped = 0;
      const groups = doc.groups.map((raw, idx)=>{
        const g = (raw && typeof raw === "object" && !Array.isArray(raw)) ? raw : {};
        const pat = g.pattern;
        const items = Array.isArray(pat) ? pat : (pat == null ? [] : [pat]);
        const rhythms = [];
        items.forEach(it=>{
          const b = Domain.parseRhythm((it && typeof it === "object") ? it.meter : it);
          if(b) rhythms.push(b); else dropped++;
        });
        return Domain.makeGroup({
          name: (g.name == null || String(g.name) === "") ? "リズムグループ"+(idx+1) : String(g.name),
          reps: g.repeat,
          bpm: g.bpm,                                    // 無指定/不正は normBpm が null 化＝基準追従
          cue: g.cue,
          repCues: Array.isArray(g.repCues) ? g.repCues : null,
          rhythms
        });
      });
      if(!groups.length){ groups.push(Domain.makeGroup({name:"リズムグループ1", reps:1})); notes.push("グループが空だったので、空のグループを1つ作りました"); }
      if(dropped) notes.push(dropped + " 件の拍子は読み込めませんでした（分母は " + Domain.DENOMS.join(",") + "、分子は 1〜" + Domain.NUM_MAX + "）");

      const sequence = Domain.makeSequence({ name: doc.name, tempo: doc.tempo, preroll: doc.preroll, video: doc.video, groups });
      return { sequence, notes, rawVideo: doc.video };
    }
    return { toDto, toEntity };
  })();

  /* ---------- SequenceIO（保存／読込のオーケストレーション。DOM の say は呼ばず結果を戻り値で返す） ---------- */
  const SequenceIO = (() => {
    function fileName(name){
      const base = (name.trim() || "sequence").replace(/[\\/:*?"<>|\n\r\t]/g, "_").slice(0,60);
      return base + ".metronome.yml";
    }
    // 現在の状態から Sequence entity を組む（tempo=bpm、video=読み込み中の URL）
    function currentSequence(){
      const s = Store.getState();
      return Domain.makeSequence({
        name: s.seqName, tempo: s.bpm, preroll: s.preroll,
        video: VideoGateway.url() || null, groups: s.groups
      });
    }
    async function save(){
      const seq = currentSequence();
      const dto = SequenceMapper.toDto(seq);
      const text = Yaml.stringify(dto);
      const name = fileName(seq.name);
      let r;
      try{ r = await FileGateway.save(name, text); }
      catch(err){ return { message: "この環境ではファイルに書き出せません", bad: true }; }
      if(r.cancelled) return null;                       // キャンセルは黙って戻る
      return { message: r.name + (r.via === "picker" ? " に保存しました" : " を保存しました"), bad: false };
    }
    // 生テキスト → 取り込み。成功メッセージ（注記込み）を返す。失敗は例外
    function importText(text){
      const { sequence, notes, rawVideo } = SequenceMapper.toEntity(Yaml.parse(text));
      SequenceService.replaceSequence(sequence, notes, rawVideo);   // video 読めなければ notes に注記が追加される
      const bars = Domain.totalBars(sequence.groups);
      return ["読み込みました：" + sequence.groups.length + " グループ / " + bars + " 小節"].concat(notes).join("\n");
    }
    return { fileName, currentSequence, save, importText };
  })();

  /* ---------- DraftService（未保存の編集を localStorage に自動退避し、離脱時に警告）----------
     ・canonical … 「保存されるのと同じ YAML テキスト」。生成は決定論的（キー順固定・toFixed(2) 正規化）
                   なので、文字列比較だけで差分＝未保存判定ができる（deepEqual 不要）。
     ・baseline  … 最後にファイル保存/読込した時点の canonical。これと違えば「未保存」。
     ・下書きは未保存のときだけ localStorage に置き、保存/一致で消す（＝下書きの存在＝未保存）。
     ・キーは曲名。リネーム時は旧キーを消して新キーへ移す。 */
  const DraftService = (() => {
    let baseline = "";        // 最後に保存/読込した時点の canonical YAML
    let dirty = false;
    let activeName = null;    // 現在 draft を書いているキー名（リネーム追従用）
    let timer = null;
    let onDirtyChange = () => {};

    function canonical(){
      return Yaml.stringify(SequenceMapper.toDto(SequenceIO.currentSequence()));
    }
    function setDirty(v){
      if(dirty === v) return;
      dirty = v;
      try{ onDirtyChange(v); }catch(_){}
    }
    // 現在状態を評価して下書きを書く/消す（debounce 先の実体）
    function persist(){
      const name = Store.getState().seqName;
      const cur = canonical();
      const nowDirty = (cur !== baseline);
      if(activeName != null && activeName !== name) DraftGateway.remove(activeName);  // リネーム追従：旧キー掃除
      if(nowDirty){
        DraftGateway.write(name, cur);
        DraftGateway.setActive(name);
        activeName = name;
      }else if(activeName != null){
        DraftGateway.remove(activeName);
        DraftGateway.setActive(null);
        activeName = null;
      }
      setDirty(nowDirty);
    }
    // Store 購読フック。名前やテンポはキーストロークごとに来るので debounce
    function schedule(){
      clearTimeout(timer);
      timer = setTimeout(persist, 300);
    }
    // 保存/読込の成功時：今の状態を基準に据え直し、下書きを片付ける（＝クリーン）
    function markClean(){
      clearTimeout(timer);
      if(activeName != null) DraftGateway.remove(activeName);
      DraftGateway.remove(Store.getState().seqName);
      DraftGateway.setActive(null);
      activeName = null;
      baseline = canonical();
      setDirty(false);
    }
    function isDirty(){ return dirty; }

    // 起動時：直近アクティブな下書きがあれば復元し、未保存として扱う。復元したら true
    function init(opts){
      onDirtyChange = (opts && opts.onDirtyChange) || (() => {});
      baseline = canonical();                       // 既定（初期）状態を基準に
      let restored = false;
      const name = DraftGateway.getActive();
      if(name != null){
        const text = DraftGateway.read(name);
        if(text){
          try{
            SequenceIO.importText(text);            // ファイル読込と同じ経路で復元
            activeName = name;
            setDirty(true);                          // baseline（初期状態）と違う＝未保存
            restored = true;
          }catch(_){ DraftGateway.remove(name); DraftGateway.setActive(null); }
        }
      }
      Store.subscribe(schedule);                    // 以後の編集を自動退避
      return restored;
    }
    return { init, markClean, isDirty, persist };
  })();

  /* ---------- PlaybackService（再生タイムラインの唯一の所有者・singleton） ----------
     「鳴らすべきリズムの並び」を平坦なリスト（timeline）として1つだけ保持する。
     生成・更新・削除ができるのはこのサービスだけ。他（スケジューラ／各再生ボタン）は読み取り専用。
     ・events … 対象プランを group×rep×bar×beat で平坦化した不変配列。各要素は座標＋拍情報＋動画位置 vt。
                これをパースすれば任意地点のメトロノーム座標が分かり、vt で動画位置とも突き合わせできる。
     ・timeline state それ自体も singleton（frame スロット1つ）。update で丸ごと差し替え、clear で破棄。
     ・タイミング（発音時刻）は現行どおりスケジューラ側で bpm から都度計算する（テンポ追従を維持）。
     ・vt は各 rep の repCues（無ければ rep0 は group.cue）でアンカーし、rep 内は bpm 補間。
       VideoPadService が indexAtVideo(vt) で「動画位置に一致する拍」を引き当て、そこからフィットさせる。 */
  const PlaybackService = (() => {
    const isSoloMode = m => m === "solo";
    let frame = null;                          // 唯一の timeline state（singleton）
    // 対象グループ列（solo/lead は該当グループのみ、他は拍子を持つ全グループ）
    function targetGroups(mode, soloId){
      const groups = Store.getState().groups;
      if(isSoloMode(mode) && soloId){
        return groups.filter(g => g.id === soloId && g.pattern.rhythms.length);
      }
      return groups.filter(g => g.pattern.rhythms.length);
    }
    // 現在の対象グループ列（guards / UI 用。running 依存で従来の plan() と同一）
    function plan(){
      if(Transport.running() && Transport.isSolo()){ return targetGroups(Transport.mode(), Transport.soloId()); }
      return targetGroups("all", null);
    }
    function build(groups, bpm){
      const events = [];
      let off = 0, vt = 0;                      // off=先頭からの累積秒, vt=動画タイムコード
      groups.forEach(g => {
        const rc = Array.isArray(g.repCues) ? g.repCues : null;
        const rhythms = g.pattern.rhythms;
        // gbpm=このグループの個別 BPM（null=基準追従）。off/vt は実効 BPM で積算し、
        // イベントには gbpm（上書き値 or null）を焼き込む＝スケジューラ側でテンポ追従を保つため
        const gbpm = (g.bpm != null) ? g.bpm : null;
        const ebpm = Domain.effectiveBpm(g, bpm);
        for(let rep = 0; rep < g.reps; rep++){
          // 各 rep の先頭で動画位置アンカー：repCues[rep]（無ければ rep0 は group.cue）。単調増加へクランプ
          const anc = (rc && rc[rep] != null) ? rc[rep] : (rep === 0 && g.cue != null ? g.cue : null);
          if(anc != null) vt = Math.max(vt, anc);
          for(let bar = 0; bar < rhythms.length; bar++){
            const m = rhythms[bar];
            const span = Domain.rhythmSeconds(m.den, ebpm);
            for(let beat = 0; beat < m.num; beat++){
              events.push(Object.freeze({off, vt, gid:g.id, gbpm, rep, bar, beat, meter:m, accent:(beat===0)}));
              off += span; vt += span;
            }
          }
        }
      });
      return Object.freeze({events: Object.freeze(events), dur: off});
    }
    return {
      // ---- ライフサイクル（書けるのはここだけ） ----
      update(mode, soloId){ frame = build(targetGroups(mode, soloId), Store.getState().bpm); return frame; },
      clear(){ frame = null; },
      // ---- 読み取り専用 ----
      ready: () => !!frame,
      count: () => frame ? frame.events.length : 0,
      at: i => frame ? frame.events[i] : null,
