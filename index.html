      }

      card.addEventListener("click", e=>{
        if(Transport.running()) return;                       // 再生中は編集に入らない
        if(e.target.closest("input, select, button")) return;
        SequenceService.toggleActive(g.id);
      });
      card.addEventListener("keydown", e=>{
        if(Transport.running()) return;
        if(e.key === "Enter" && !e.target.closest("input, select, button")){
          e.preventDefault(); SequenceService.toggleActive(g.id);
        }
      });
      return card;
    }

    /* 全体レックで書き込んだ cue を、再描画せず表示だけ差し替える */
    function stampCueView(gid, cue){
      const el = groupsEl.querySelector('[data-id="' + gid + '"]');
      const at = el && el.querySelector(".g-at");
      if(at){
        at.textContent = Fmt.time(cue);
        at.classList.remove("none");
        at.classList.add("hit");
      }
    }
    return { card, stampCueView };
  })();

  /* ---------- SequenceView（シーケンス：グループ一覧・サマリー・名前・履歴・並び替え） ---------- */
  const SequenceView = (() => {
    /* ドラッグ並び替え */
    let drag = null;
    function startDrag(e, index, card){
      if(Transport.running() || state().groups.length < 2) return;
      e.preventDefault();
      const cards = [...groupsEl.children];
      drag = {
        index, card, target:index, startY:e.clientY,
        rects: cards.map(c=>c.getBoundingClientRect()),
        pid: e.pointerId
      };
      e.currentTarget.setPointerCapture(e.pointerId);
      card.classList.add("dragging");
      e.currentTarget.addEventListener("pointermove", onDragMove);
      e.currentTarget.addEventListener("pointerup", endDrag);
      e.currentTarget.addEventListener("pointercancel", endDrag);
    }
    function onDragMove(e){
      if(!drag) return;
      drag.card.style.transform = "translateY(" + (e.clientY - drag.startY) + "px)";
      let t = 0;
      drag.rects.forEach((r,i)=>{
        if(i !== drag.index && e.clientY > r.top + r.height/2) t++;
      });
      drag.target = t;
      const cards = [...groupsEl.children].filter((c,i)=>i !== drag.index);
      cards.forEach(c=>c.classList.remove("drop-before","drop-after"));
      if(cards.length){
        if(t < cards.length) cards[t].classList.add("drop-before");
        else cards[cards.length-1].classList.add("drop-after");
      }
    }
    function endDrag(e){
      if(!drag) return;
      const el = e.currentTarget;
      el.removeEventListener("pointermove", onDragMove);
      el.removeEventListener("pointerup", endDrag);
      el.removeEventListener("pointercancel", endDrag);
      drag.card.style.transform = "";
      drag.card.classList.remove("dragging");
      const from = drag.index, to = drag.target;
      drag = null;
      SequenceService.moveGroup(from, to);
      render();
    }

    function summary(){
      const c = Domain.summaryCounts(state().groups);
      seqSum.textContent = c.groups + " グループ ・ 全 " + c.bars + " 小節";
    }
    function applyTitle(){
      document.title = (state().seqName.trim() || "無題のシーケンス") + " — メトロノーム";
    }
    function updateHistory(){
      undoBtn.disabled = !HistoryService.canUndo() || Transport.running();
      redoBtn.disabled = !HistoryService.canRedo() || Transport.running();
    }

    function render(){
      const running = Transport.running();
      const st = state();
      groupsEl.innerHTML = "";
      groupsEl.classList.toggle("locked", running);
      addGroupBtn.disabled = running;
      seqNameEl.disabled = running;
      prerollInput.disabled = running;
      leadEl.classList.toggle("na", running && Transport.isSolo());
      VideoView.updateLock();

      st.groups.forEach((g, gi)=> groupsEl.appendChild(GroupView.card(g, gi)));

      if(focusHandleId){
        const el = groupsEl.querySelector('[data-id="'+focusHandleId+'"] .handle');
        if(el) el.focus();
        focusHandleId = null;
      }
      summary();
      TransportView.update();
      updateHistory();
      TransportView.highlight();
    }

    function afterRestore(){      // undo/redo 後の再同期
      seqNameEl.value = state().seqName;
      applyTitle();
      render();
      TransportView.syncIdle();
    }

    function bind(){
      let typing = false;
      seqNameEl.addEventListener("focus", ()=>{ typing = false; });
      seqNameEl.addEventListener("blur", ()=>{
        typing = false;
        if(!seqNameEl.value.trim()){ SequenceService.setName("無題のシーケンス"); seqNameEl.value = "無題のシーケンス"; }
      });
      seqNameEl.addEventListener("input", e=>{
        if(!typing){ HistoryService.commit(); typing = true; }   // 連続入力は1手にまとめる
        SequenceService.setName(e.target.value);
      });
      addGroupBtn.addEventListener("click", ()=>SequenceService.addGroup());
      undoBtn.addEventListener("click", ()=>HistoryService.undo());
      redoBtn.addEventListener("click", ()=>HistoryService.redo());
    }

    return { startDrag, render, summary, applyTitle, updateHistory, afterRestore, bind };
  })();

  /* ---------- TempoView（テンポ表示と操作） ---------- */
  const TempoView = (() => {
    function render(from){
      const bpm = state().bpm;
      bpmView.textContent = bpm;
      termView.textContent = Domain.termFor(bpm);
      if(from !== "range") range.value = bpm;
      if(from !== "input") input.value = bpm;
      range.style.setProperty("--p", ((bpm-Domain.MIN)/(Domain.MAX-Domain.MIN)*100)+"%");
    }
    function bind(){
      [50,100,150,200,250].forEach(v=>{
        const el=document.createElement("div");
        el.className="tick"; el.style.left=((v-Domain.MIN)/(Domain.MAX-Domain.MIN)*100)+"%";
        el.innerHTML='<i></i><span>'+v+'</span>'; $("ticks").appendChild(el);
      });
      range.addEventListener("input", e=>SequenceService.setTempo(e.target.value,"range"));
      input.addEventListener("change", e=>SequenceService.setTempo(e.target.value,"input"));
      $("tempoForm").addEventListener("submit", e=>{e.preventDefault();SequenceService.setTempo(input.value,"input");input.blur();});
      document.querySelectorAll(".steps .step").forEach(b=>{
        b.addEventListener("click", ()=>SequenceService.setTempo(state().bpm+Number(b.dataset.delta)));
      });
    }
    return { render, bind };
  })();

  /* ---------- TransportView（再生ボタン・状態・拍表示・ハイライト・空白／待機の表示） ---------- */
  const TransportView = (() => {
    const LABELS = {all:"全体再生", solo:"グループ再生", lead:"−5秒から再生"};

    function paintBeats(n){
      beatsEl.innerHTML = "";
      for(let i=0;i<n;i++){
        const d = document.createElement("span");
        d.className = "beat" + (i===0 ? " first" : "");
        beatsEl.appendChild(d);
      }
    }
    function showPulse(bar){
      const rate = Math.round((60/Domain.rhythmSeconds(bar.den, state().bpm))*10)/10;
      pulseView.innerHTML = '<i>'+bar.num+'/'+bar.den+'</i><span>'+(Domain.NOTE_NAME[bar.den]||("全音符÷"+bar.den))+'</span><b>'+rate+' /分</b>';
    }
    function setBeatDot(beat){
      const dots = beatsEl.children;
      for(let i=0;i<dots.length;i++) dots[i].classList.toggle("on", i === beat);
    }
    function clearBeats(){ [...beatsEl.children].forEach(d=>d.classList.remove("on")); }

    function highlight(){
      const running = Transport.running(), cur = Transport.cur();
      [...groupsEl.children].forEach(card=>{
        const g = findGroup(card.dataset.id);
        const on = running && cur.gid === card.dataset.id;
        card.classList.toggle("playing", on);
        card.querySelectorAll("[data-bi]").forEach(n=>{
          n.classList.toggle("now", on && Number(n.dataset.bi) === cur.bar);
        });
        const t = card.querySelector('[data-role="times"]');
        if(t && g){
          t.textContent = on ? (cur.rep+1) + " / " + g.reps : Fmt.times(g);
        }
      });
    }
    function syncIdle(){
      if(Transport.running()) return;
      const gs = PlaybackScheduler.plan();
      const bar = gs.length ? gs[0].pattern.rhythms[0] : {num: state().pickNum, den: state().pickDen};
      paintBeats(bar.num);
      showPulse(bar);
      update();
    }
    function update(){
      const btns = {all:startAllBtn, solo:startSoloBtn, lead:startLeadBtn};
      const running = Transport.running(), armKind = Transport.armKind(), recording = Transport.recording();
      if(running || armKind){
        const active = running ? Transport.mode() : armKind;
        Object.keys(btns).forEach(k=>{
          const on = (k === active);
          btns[k].textContent = on ? "停止" : LABELS[k];
          btns[k].classList.toggle("on", on);
          btns[k].disabled = !on;
          btns[k].title = "";
        });
        recBtn.classList.toggle("on", recording);
        recBtn.textContent = recording ? "■ レック中" : "● REC";
        recBtn.disabled = !recording;
      }else{
        const ready = PlaybackScheduler.plan().length > 0;
        const target = Transport.soloTarget();
        const cued = target && target.cue != null && VideoGateway.ready();
        Object.keys(btns).forEach(k=>{
          btns[k].textContent = LABELS[k];
          btns[k].classList.remove("on");
        });
        startAllBtn.disabled = !ready;
        startSoloBtn.disabled = !target;
        startLeadBtn.disabled = !cued;
        startAllBtn.title = ready ? "" : "拍子を1つ以上追加してください";
        startSoloBtn.title = target ? target.name + " だけを再生" : "再生したいリズムグループをタップして選んでください";
        startLeadBtn.title = !target ? "再生したいリズムグループをタップして選んでください"
          : !VideoGateway.ready() ? "動画を読み込むと使えます"
          : target.cue == null ? "このグループに動画位置が記録されていません"
          : "記録位置の5秒前から流して、記録位置でメトロノームを開始します";
        recBtn.classList.remove("on");
        recBtn.textContent = "● REC";
        recBtn.disabled = !ready || !VideoGateway.ready();
        recBtn.title = !VideoGateway.ready() ? "動画を読み込むと使えます"
          : "動画を先頭から流し、各リズムグループの位置を記録します";
      }
    }
    function status(text){ statusText.textContent = text; }
    function readPreroll(){ return SequenceService.setPreroll(prerollInput.value); }
    // 空白（preroll）待機の表示
    function setRunning(on){ document.body.classList.toggle("running", on); }
    function startWaiting(str){
      document.body.classList.add("waiting");
      leadEl.classList.add("counting");
      statusText.textContent = "待機中";
      prerollCount.hidden = false;
      prerollCount.textContent = str;
    }
    function clearWaiting(){
      document.body.classList.remove("waiting");
      leadEl.classList.remove("counting");
      prerollCount.hidden = true;
    }
    function isWaiting(){ return document.body.classList.contains("waiting"); }
    function endWaiting(base){
      document.body.classList.remove("waiting");
      leadEl.classList.remove("counting");
      prerollCount.hidden = true;
      statusText.textContent = base;
    }
    function prerollTick(str){ prerollCount.textContent = str; }

    function bind(){
      recBtn.addEventListener("click", ()=>Transport.startRec());
      prerollInput.addEventListener("change", ()=>SequenceService.setPreroll(prerollInput.value));
      startAllBtn.addEventListener("click", ()=> Transport.armKind() ? Transport.armCancel() : (Transport.running() ? Transport.stop(false) : Transport.start("all")));
      startSoloBtn.addEventListener("click", ()=> Transport.armKind() ? Transport.armCancel() : (Transport.running() ? Transport.stop(false) : Transport.start("solo")));
      startLeadBtn.addEventListener("click", ()=> Transport.armKind() ? Transport.armCancel() : (Transport.running() ? Transport.stop(false) : Transport.start("lead")));
      document.addEventListener("keydown", e=>{
        const mod = e.metaKey || e.ctrlKey;
        if(mod && e.key.toLowerCase() === "z"){
          e.preventDefault();
          e.shiftKey ? HistoryService.redo() : HistoryService.undo();
          return;
        }
        if(mod && e.key.toLowerCase() === "y"){ e.preventDefault(); HistoryService.redo(); return; }
        if(e.code !== "Space") return;
        const t = e.target.tagName;
        if(t==="INPUT" || t==="SELECT" || t==="BUTTON") return;
        e.preventDefault();
        Transport.running() ? Transport.stop(false) : Transport.start("all");
      });
      document.addEventListener("visibilitychange", ()=>Transport.wake());
    }
    return {
      paintBeats, showPulse, setBeatDot, clearBeats, highlight, syncIdle, update, status, readPreroll,
      setRunning, startWaiting, clearWaiting, isWaiting, endWaiting, prerollTick, bind
    };
  })();

  /* ---------- IoView（保存／読込のメッセージ表示とバインド） ---------- */
  const IoView = (() => {
    let msgTimer = null;
    function say(text, bad){
      ioMsg.textContent = text;
      ioMsg.classList.toggle("bad", !!bad);
      ioMsg.hidden = false;
      clearTimeout(msgTimer);
      msgTimer = setTimeout(()=>{ ioMsg.hidden = true; }, bad ? 9000 : 5000);
    }
    function importAndSay(text){
      try{ say(SequenceIO.importText(text), false); }
      catch(err){ say("読み込めませんでした：" + err.message, true); }
    }
    function bind(){
      saveBtn.addEventListener("click", async ()=>{
        const r = await SequenceIO.save();
        if(r) say(r.message, r.bad);
      });
      loadBtn.addEventListener("click", async ()=>{
        try{ importAndSay(await FileGateway.open()); }
        catch(err){
          if(err && err.name === "AbortError") return;
          say("ファイルを開けませんでした", true);
        }
      });
      ioFile.addEventListener("change", ()=>{
        const file = ioFile.files && ioFile.files[0];
        if(file) FileGateway.readFile(file).then(importAndSay).catch(()=>say("ファイルを読めませんでした", true));
        ioFile.value = "";
      });
      /* ダイアログが使える環境ではボタン、使えない環境では input[type=file] を出す */
      if(FileGateway.canOpenPicker){
        loadBtn.hidden = false;
        ioFileLabel.hidden = true;
      }
      // ドラッグ＆ドロップ
      let dragDepth = 0;
      document.addEventListener("dragenter", e=>{
        if(!e.dataTransfer || ![...e.dataTransfer.types].includes("Files")) return;
        dragDepth++; document.body.classList.add("dropping");
      });
      document.addEventListener("dragover", e=>{ e.preventDefault(); });
      document.addEventListener("dragleave", ()=>{
        dragDepth = Math.max(0, dragDepth-1);
        if(!dragDepth) document.body.classList.remove("dropping");
      });
      document.addEventListener("drop", e=>{
        e.preventDefault();
        dragDepth = 0; document.body.classList.remove("dropping");
        const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if(file) FileGateway.readFile(file).then(importAndSay).catch(()=>say("ファイルを読めませんでした", true));
      });
    }
    return { say, bind };
  })();

  /* ---------- VideoView（YouTube のメッセージ・ロック・操作） ---------- */
  const VideoView = (() => {
    function ytSay(text, bad){
      ytMsg.textContent = text;
      ytMsg.classList.toggle("bad", !!bad);
      ytMsg.hidden = !text;
    }
    function updateLock(){
      const running = Transport.running();
      ytOpen.disabled = false;
      ytUrl.disabled = running;
      ytLoad.disabled = running;
      ytClear.disabled = running;
      ytSync.disabled = running;
    }
    function syncEnabled(){ return ytSync.checked; }
    function bind(){
      function applyUrl(){
        const v = VideoGateway.parse(ytUrl.value);
        if(!v){ ytSay("YouTube のURLとして読めませんでした", true); return; }
        VideoGateway.mount(v);
      }
      ytLoad.addEventListener("click", applyUrl);
      ytUrl.addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); applyUrl(); } });
      ytUrl.addEventListener("paste", ()=>setTimeout(applyUrl, 0));
      ytOpen.addEventListener("click", ()=>{
        const cur = VideoGateway.current();
        if(!cur) return;
        const url = "https://www.youtube.com/watch?v=" + cur.id + (cur.start ? "&t=" + cur.start : "");
        if(!Transport.running()) Transport.start("all");          // 先にメトロノームを走らせてから動画を開く
        window.open(url, "_blank", "noopener");
      });
      ytClear.addEventListener("click", ()=>{
        if(Transport.running()) Transport.stop(false);
        VideoGateway.clear();
        Transport.clearPending();
        ytUrl.value = ""; ytSay("", false);
        SequenceView.render();
      });
    }
    return { ytSay, updateLock, syncEnabled, bind };
  })();

  /* ---------- 連携：Transport への view（DOM 反映）と Store の購読ディスパッチ ---------- */
  const view = {
    render: SequenceView.render,
    syncIdle: TransportView.syncIdle,
    updateTransport: TransportView.update,
    status: TransportView.status,
    videoMsg: VideoView.ytSay,
    setRunning: TransportView.setRunning,
    startWaiting: TransportView.startWaiting,
    clearWaiting: TransportView.clearWaiting,
    isWaiting: TransportView.isWaiting,
    endWaiting: TransportView.endWaiting,
    prerollTick: TransportView.prerollTick,
    clearBeats: TransportView.clearBeats,
    paintBeats: TransportView.paintBeats,
    showPulse: TransportView.showPulse,
    highlight: TransportView.highlight,
    setBeatDot: TransportView.setBeatDot,
    readPreroll: TransportView.readPreroll,
    stampCueView: GroupView.stampCueView
  };
  // Store の変更を meta フラグに応じて各ビューへ配る
  function dispatch(meta){
    meta = meta || {};
    if(meta.seqName){ seqNameEl.value = state().seqName; SequenceView.applyTitle(); }
    if(meta.seqTitle){ SequenceView.applyTitle(); }
    if(meta.tempo){ TempoView.render(meta.from); }
    if(meta.preroll){ prerollInput.value = state().preroll.toFixed(2); }
    if(meta.render){ if(meta.focusHandle != null) focusHandleId = meta.focusHandle; SequenceView.render(); }
    if(meta.idle){ TransportView.syncIdle(); }
  }

  /* ========================================================================
     bootstrap … 各層を配線（infra を usecase に注入、ui を購読登録）して初期描画する。
     ======================================================================== */
  HistoryService.init({
    capture: () => Store.snapshot(),
    apply: s => { Store.restore(s); SequenceView.afterRestore(); },
    onChange: () => SequenceView.updateHistory()
  });
  VideoGateway.init({
    onMsg: (text, bad) => VideoView.ytSay(text, bad),
    onReady: () => { VideoView.ytSay("", false); SequenceView.render(); },
    onPlaying: () => Transport.onVideoPlaying(),
    onStopped: () => Transport.onVideoStopped(),
    syncEnabled: () => VideoView.syncEnabled()
  });
  Transport.init({ view });
  VideoSync.init({ view });
  Store.subscribe(dispatch);
  TempoView.bind();
  SequenceView.bind();
  TransportView.bind();
  IoView.bind();
  VideoView.bind();

  /* ---------- 初期化 ---------- */
  SequenceView.render();
  TransportView.readPreroll();
  SequenceView.applyTitle();
  SequenceView.updateHistory();
  SequenceService.setTempo(120);
})();
</script>
</body>
