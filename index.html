      // vt 以上の最初の index（二分探索）。VideoPadService が動画位置→開始拍の突き合わせに使う。
      indexAtVideo(vtq){
        if(!frame) return 0;
        const ev = frame.events; let lo = 0, hi = ev.length;
        while(lo < hi){ const mid = (lo + hi) >> 1; if(ev[mid].vt < vtq) lo = mid + 1; else hi = mid; }
        return lo;
      },
      plan
    };
  })();

  /* ---------- PlaybackScheduler（先読みスケジューラ。PlaybackService の timeline を読み、クリックを予約して queue を積む） ----------
     ドット描画／REC 判定など DOM 由来は含めない。発音時刻は bpm から都度計算し、テンポ追従を維持する。 */
  const PlaybackScheduler = (() => {
    const LOOKAHEAD = 25, AHEAD = 0.12, queue = [];
    let nextTime = 0, i = 0, finished = false, endTime = 0;
    // イベントの拍長。gbpm（グループ個別 BPM）があればそれ、無ければ基準 BPM を都度参照
    // （＝上書きなしグループは再生中も上部スライダーに追従、上書きグループは固定値で鳴る）
    const beatSeconds = e => Domain.rhythmSeconds(e.meter.den, (e.gbpm != null) ? e.gbpm : Store.getState().bpm);
    function resetPointer(){ i = 0; finished = false; }
    function prime(startTime){ resetPointer(); queue.length = 0; nextTime = startTime; }
    // 任意の index から刻み直す（パッドの動画シーク／一時停止復帰でメトロノームをフィットさせる）
    function primeAtIndex(startTime, index){
      const n = PlaybackService.count();
      i = Math.max(0, Math.min(index|0, n));     // n（末尾＝以降イベント無し）まで許容
      finished = (i >= n); queue.length = 0; nextTime = startTime;
    }
    function pump(limit){
      const n = PlaybackService.count();
      if(!n){ finished = true; endTime = nextTime; return; }
      while(!finished && nextTime < limit){
        const e = PlaybackService.at(i);
        const span = beatSeconds(e);
        SoundGateway.click(e.accent, nextTime, span);
        queue.push({time:nextTime, gid:e.gid, rep:e.rep, bar:e.bar, beat:e.beat, meter:e.meter});
        nextTime += span;
        i++;
        if(i >= n){ finished = true; endTime = nextTime; }
      }
    }
    return {
      LOOKAHEAD, AHEAD, queue, resetPointer, prime, primeAtIndex, pump,
      plan: () => PlaybackService.plan(),
      finished: () => finished, endTime: () => endTime
    };
  })();

  /* ---------- VideoSync（動画の頭出し／助走／cue 記録。VideoGateway を駆動し、頭出し完了で Transport へ戻す） ---------- */
  const VideoSync = (() => {
    let topWatch = null, cueWatch = null;
    let view = {};
    // 動画同期の遅延補正（秒）。メトロノームの発音は「音声出力遅延 − 動画出力遅延」ぶん
    // 動画より遅れて聞こえるため、記録位置より少し手前を狙って刻み出す＝実音が cue に重なる。
    // 実測でおおよそ 8分音符ぶん（♩=115 換算 ≒ 0.26 秒）。耳で合わせて調整可。
    const CUE_LATENCY = 0.26;
    // 記録位置(cue) → メトロノーム再生の狙い位置。発音遅延ぶん手前へ。cue を再生に使うときは
    // 必ずこの関数を通す（頭出し・カウントインの基準はすべて compensate(cue)）。
    function compensate(cue){ return Math.max(0, cue - CUE_LATENCY); }
    function cancel(){ topWatch = null; cueWatch = null; }

    function startFromTop(kind){
      try{
        VideoGateway.seekTo(0, true);
        VideoGateway.play();
      }catch(err){ Transport.clearArm(); Transport.beginPlayback(kind); return; }
      topWatch = {kind, t0: ClockGateway.perf()};
      view.status("頭出し中");
      view.videoMsg("先頭に戻しています…", false);
      ClockGateway.frame(pollTop);
    }
    function pollTop(){
      if(!topWatch) return;
      let st = -1, t = null;
      try{ st = VideoGateway.stateCode(); t = VideoGateway.time(); }catch(err){}
      // 先頭から実際に動き出したことを確認してから刻み始める（ここで空白が効く）
      if(st === 1 && t != null && t > 0.02 && t < 2){
        const kind = topWatch.kind;
        topWatch = null; Transport.clearArm();
        view.videoMsg("", false);
        Transport.beginPlayback(kind);
        return;
      }
      if(ClockGateway.perf() - topWatch.t0 > 6000){
        const kind = topWatch.kind;
        topWatch = null; Transport.clearArm();
        view.videoMsg("動画の応答がないため、メトロノームだけ始めます", true);
        Transport.beginPlayback(kind);
        return;
      }
      ClockGateway.frame(pollTop);
    }
    function startAtCue(kind, cue){
      // aim=実音を cue に重ねる補正位置。fire=そこからカウントイン(前グループ末尾の1〜2小節)ぶん
      // 手前＝助走の刻み出し位置。
      // グループ再生は前グループ末尾の助走を挟む。全体再生は助走なし（先頭グループの頭出しのみ）
      const aim = compensate(cue);
      const useCountIn = (kind !== "all");
      const ciDur = useCountIn ? Transport.countInFor(Transport.soloTarget()).dur : 0;
      const fire = Math.max(0, aim - ciDur);
      const from = fire;
      try{
        VideoGateway.seekTo(from, true);     // カウントイン開始点へ頭出し
        VideoGateway.play();
      }catch(err){ Transport.clearArm(); Transport.beginPlayback(kind); return; }
      // 手前へ頭出しして実到達を確認してから target で刻む（到達検知）。
      cueWatch = {target: fire, from, kind, index: 0, countIn: useCountIn, resume: false, jump: false,
                  t0: ClockGateway.perf(), limit: 6000};
      view.status("頭出し中");
      view.videoMsg("頭出し中…", false);
      ClockGateway.frame(pollCue);
    }
    // パッド用：timeline の index 番目の拍（その動画位置 vt）へ寄せ、実到達後に beginPlayback(index) で刻み出す。
    // ボタン再生と同じ pollCue／beginPlayback を共有（空白判定＝実再生フレーム待ち・遅延補正・overshoot 前倒し）。
    const SNAP_LEAD = 0.4;
    function startAtIndex(index){
      const ev = PlaybackService.at(index);
      if(!ev){ Transport.clearArm(); return; }   // 対象拍なし（曲末尾より後）→ 動画だけ動かしメトロノームは止めたまま
      const aim = compensate(ev.vt);
      const from = Math.max(0, aim - SNAP_LEAD);
      try{
        VideoGateway.seekTo(from, true);
        VideoGateway.play();
      }catch(err){ Transport.clearArm(); Transport.beginPlayback("all", {skipWait:true, index, resume:true}); return; }
      cueWatch = {target: aim, from, kind: "all", index, countIn: false, resume: true, jump: true,
                  t0: ClockGateway.perf(), limit: (SNAP_LEAD + 8) * 1000};
      view.status("頭出し中");
      view.videoMsg("位置を合わせています…", false);
      ClockGateway.frame(pollCue);
    }
    function pollCue(){
      if(!cueWatch) return;
      let st = -1, t = null;
      try{ st = VideoGateway.stateCode(); t = VideoGateway.time(); }catch(err){}

      if(cueWatch.jump){
        // 手前(from)へ寄せて実到達を確認してから target で刻み出す（lead＝5秒手前 / パッド＝SNAP_LEAD 手前）。
        // seekTo 直後は getCurrentTime が「移動前の位置」を数フレーム返すため、from まで実到達を確認してから計測。
        if(t != null && !isNaN(t)){
          if(!cueWatch.seeked && t <= cueWatch.from + 0.5) cueWatch.seeked = true;
          if(cueWatch.seeked){
            const remain = cueWatch.target - t;
            if(remain <= 0){
              const w = cueWatch; const over = Math.min(-remain, 0.05);
              cueWatch = null; Transport.clearArm();
              view.videoMsg("", false);
              Transport.beginPlayback(w.kind, {skipWait:true, adjust:-over, countIn:w.countIn, index:w.index, resume:w.resume});
              return;
            }
            view.videoMsg("あと " + remain.toFixed(1) + " 秒で開始", false);
          }else{
            view.videoMsg("頭出し中…", false);   // まだ寄せ先まで到達していない
          }
        }
      }else if(st === 1 && t != null && t >= cueWatch.target - 0.1){
        // 指定位置に着いて、実際に再生が始まったフレームで刻み出す
        const w = cueWatch;
        const over = Math.min(Math.max(0, t - cueWatch.target), 0.05);
        cueWatch = null; Transport.clearArm();
        view.videoMsg("", false);
        Transport.beginPlayback(w.kind, {skipWait:true, adjust:-over, countIn:w.countIn, index:w.index});   // 行き過ぎたぶんだけ前倒し
        return;
      }
      if(ClockGateway.perf() - cueWatch.t0 > cueWatch.limit){
        const w = cueWatch;
        cueWatch = null; Transport.clearArm();
        view.videoMsg("動画の応答がないため、メトロノームだけ始めます", true);
        Transport.beginPlayback(w.kind, {skipWait:true, index:w.index, resume:w.resume});
        return;
      }
      ClockGateway.frame(pollCue);
    }
    // いま鳴り始めた rep に、そのときの動画位置を書き込む（全体レック）。rep0 はグループ cue も維持
    function stampCue(gid, rep, evTime){
      const g = Store.findGroup(gid);
      if(!g || !VideoGateway.ready()) return;
      let t = null;
      try{ t = VideoGateway.time(); }catch(err){}
      if(t == null || isNaN(t)) return;
      const late = Math.max(0, ClockGateway.now() - evTime);   // 取りこぼしたフレームぶんを引き、拍の実時刻の動画位置へ戻す
      const val = Math.max(0, Math.round((t - late) * 100) / 100);   // grab と同じく生の動画位置で記録（発音遅延の補正は再生側 compensate に一本化）
      if(!Array.isArray(g.repCues)) g.repCues = Domain.fitCues(null, g.reps);
      g.repCues[rep] = val;
      if(rep === 0){ g.cue = val; view.stampCueView(gid, val); }   // グループ表示は rep0 のみ（rep チップ UI なし）
    }
    return { init(o){ view = o.view || view; }, compensate, cancel, startFromTop, startAtCue, startAtIndex, stampCue };
  })();

  /* ---------- Transport（再生ステートマシン：all/solo・preroll・全REC・動画同期を統括） ----------
     ClockGateway/SoundGateway/VideoSync/Store/PlaybackScheduler をオーケストレーションし、
     UI へは view（onTick/onStatus/updateTransport 相当）経由で反映を委譲する。 */
  const Transport = (() => {
    const COUNT_IN_SEC = 2.0;                 // 助走カウントインの目安の長さ（秒）。bpm で本数が決まる
    const COUNT_IN_MAX_BARS = 2;              // 前グループ末尾から取り込むリズムの上限（1〜2小節）
    // タイムライン更新（再生のたびに作り直す）の準備バッファ。更新→読取は実測で約0.1ms（717拍の実曲）
    // と軽く、build は同期実行されるため大きな待ちは不要。即時再生（全体再生）にごく短い余白だけ置く。
    // ブロック再生（グループ再生）は助走の余白に吸収されるため追加ディレイなし。
    const IMMEDIATE_LEAD = 0.15;
    let running = false;
    let mode = "all", soloId = null;          // "all"=全体 / "solo"=選択グループのみ
    let armKind = null, pendingKind = null, waitTimer = null;   // 準備中（頭出し／再生待ち）
    let recording = false;                    // 全体レック（各 rep の頭で repCues を記録）
    let resumeActiveId = null;                // 再生前にアクティブだったグループ
    let firstBeatTime = 0;                    // 最初の1打が鳴る時刻（空白があるとき）
    let cur = {gid:null, bar:-1, rep:0};
    let shown = "";
    let cancelTimer = null;
    let view = {
      render(){}, syncIdle(){}, updateTransport(){}, status(){}, videoMsg(){},
      setRunning(){}, startWaiting(){}, clearWaiting(){}, isWaiting(){ return false; },
      endWaiting(){}, prerollTick(){}, clearBeats(){}, paintBeats(){}, showPulse(){},
      highlight(){}, setBeatDot(){}, readPreroll(){ return 0; }, stampCueView(){}, padUpdate(){}
    };
    const isSoloMode = m => m === "solo";
    const baseStatus = () => isSoloMode(mode) ? "グループ再生" : "再生中";

    function soloTarget(){
      const g = Store.findGroup(Store.getState().activeId);
      return (g && g.pattern.rhythms.length) ? g : null;
    }
    // 助走カウントイン：対象の「前のリズムグループ」の末尾から、目安秒数に達するまで（最大2小節）を取る。
    // 前グループが無ければ対象自身の先頭1小節でフォールバック。本数は bpm 依存（小節長が変わるため）。
    function countInFor(target){
      if(!target) return {bars:[], dur:0};
      const st = Store.getState();
      const idx = st.groups.indexOf(target);
      let prev = null;
      for(let i = idx - 1; i >= 0; i--){ if(st.groups[i].pattern.rhythms.length){ prev = st.groups[i]; break; } }
      const srcGroup = prev || target;
      const src = prev ? prev.pattern.rhythms : target.pattern.rhythms.slice(0, 1);
      // 助走は「出所グループ」の実効 BPM で鳴らす（177→88 の境界で誤テンポにならないように）
      const ciBpm = Domain.effectiveBpm(srcGroup, st.bpm);
      const bars = [];
      let dur = 0;
      for(let i = src.length - 1; i >= 0; i--){
        bars.unshift(src[i]);
        dur += src[i].num * Domain.rhythmSeconds(src[i].den, ciBpm);
        if(dur >= COUNT_IN_SEC || bars.length >= COUNT_IN_MAX_BARS) break;
      }
      return {bars, dur, bpm: ciBpm};
    }
    function firstGroupFor(kind){
      if(kind !== "all") return soloTarget();
      return Store.getState().groups.filter(g => g.pattern.rhythms.length)[0] || null;
    }
    function cueOf(kind){
      const g = firstGroupFor(kind);
      return (g && typeof g.cue === "number") ? g.cue : null;
    }

    function schedulerTick(){
      // タブが背面だと setInterval が 1 秒程度まで間引かれるので、先読みを伸ばす
      const limit = ClockGateway.now() + (ClockGateway.hidden() ? 1.2 : PlaybackScheduler.AHEAD);
      if(PlaybackScheduler.finished() && ClockGateway.now() >= PlaybackScheduler.endTime()){ stop(true); return; }
      PlaybackScheduler.pump(limit);
    }
    function draw(){
      if(!running) return;
      const now = ClockGateway.now();
      if(firstBeatTime && now < firstBeatTime){
        view.prerollTick(Math.max(0, firstBeatTime - now).toFixed(2));
      }else if(view.isWaiting()){
        view.endWaiting(baseStatus());
      }
      const queue = PlaybackScheduler.queue;
      while(queue.length && queue[0].time <= now){
        const e = queue.shift();
        const key = e.gid + ":" + e.rep + ":" + e.bar;
        if(key !== shown){
          shown = key;
          if(recording && e.bar === 0){    // 各くり返し(rep)の頭で記録（rep0=グループ先頭も含む）
            VideoSync.stampCue(e.gid, e.rep, e.time);
          }
          cur = {gid:e.gid, bar:e.bar, rep:e.rep};
          view.paintBeats(e.meter.num);
          view.showPulse(e.meter);
          view.highlight();
        }
        view.setBeatDot(e.beat);
      }
      if(PlaybackScheduler.finished() && now >= PlaybackScheduler.endTime()){ stop(true); return; }
      ClockGateway.frame(draw);
    }

    // 単一の再生開始経路。ボタン再生は index 0（＝先頭）、パッドは opts.index（動画位置に一致する拍）から。
    // opts: {skipWait, adjust, lead, countIn, index, resume}
    //   resume=true … セッション継続中の再フィット（timeline 再構築・activeId 退避・全再描画をしない）
    function beginPlayback(kind, opts){
      const o = opts || {};
      if(kind !== "all" && !soloTarget()) return;
      if(kind === "all" && !PlaybackScheduler.plan().length) return;
      SoundGateway.ensure();
      mode = (kind === "all") ? "all" : kind;
      soloId = (mode === "all") ? null : Store.getState().activeId;
      const ciTarget = soloTarget();          // カウントイン基準（activeId を消す前に取得）
      running = true; shown = "";             // 先に running を立て、下の再描画でトグル（停止）状態を反映する
      if(!o.resume){
        PlaybackService.update(mode, soloId); // 更新：再生のたびに timeline を丸ごと作り直す（singleton を差し替え）
        resumeActiveId = Store.getState().activeId;
        // グループ再生／5秒前は対象グループを展開したまま（アクティブ維持）。全体再生は全グループ非アクティブに
        Store.apply({activeId: isSoloMode(mode) ? soloId : null});
        view.render();
      }
      // 空白のぶん最初の予約を後ろへずらす。先読みスケジューラなので、
      // この間はクリックが1つも予約されず、時刻はサンプル精度で保たれる
      // 空白は「全体再生」かつ「動画の頭出しをしていないとき」だけ入れる（パッド/動画同期は skipWait）
      const wait = (mode === "all" && !o.skipWait) ? view.readPreroll() : 0;
      const adjust = o.adjust || 0;
      const lead = o.lead || 0;               // 即時再生（動画なし全体再生）の準備ディレイ。約1秒後から鳴らす
      // 助走カウントイン（動画同期時のみ）：前グループ末尾の1〜2小節を downbeat の手前に実際の拍子で
      // 鳴らし、切り替わりの少し前からメトロノームが聞こえるようにする（音のみ・拍ドットは downbeat から）
      const ci = o.countIn ? countInFor(ciTarget) : {bars:[], dur:0};
      const ciDur = ci.dur;
      const ciBpm = ci.bpm != null ? ci.bpm : Store.getState().bpm;   // 助走の実効テンポ（出所グループ基準）
      // 先読みマージンは最小限に。さらに setInterval の初回発火（約25ms先）を待たず、
      // prime 直後に一度だけ同期でスケジュールすることで「頭出し確定 → 発音」の固定遅延を詰める。
      // （グループ再生／−5秒再生で頭の拍が後ろへズレて聞こえていたのはこの初回オフセットが主因）
      const t0 = ClockGateway.now();
      const start = Math.max(t0 + 0.005, t0 + 0.02 + wait + ciDur + adjust + lead);
      PlaybackScheduler.primeAtIndex(start, o.index || 0);   // index 既定 0 = 従来の prime と同じ
      firstBeatTime = (wait > 0 || lead > 0) ? start : 0;
      let ct = start - ciDur;                 // カウントインの先頭。各小節の頭のみアクセント
      for(const bar of ci.bars){
        const beat = Domain.rhythmSeconds(bar.den, ciBpm);
        for(let k = 0; k < bar.num; k++){ if(ct > t0) SoundGateway.click(k === 0, ct, beat); ct += beat; }
      }
      schedulerTick();     // 初回分を即予約（以降は下の setInterval が継続）
      cancelTimer = ClockGateway.every(PlaybackScheduler.LOOKAHEAD, schedulerTick);
      ClockGateway.frame(draw);
      view.setRunning(true);
      if(wait > 0){ view.startWaiting(wait.toFixed(2)); }
      else{ view.status(baseStatus()); }
      view.updateTransport();
      view.padUpdate();
    }
    // メトロノームの run ループだけ停止（timeline/mode は保持）。パッドのシーク・一時停止で使う。
    function halt(){
      if(cancelTimer){ cancelTimer(); cancelTimer = null; }
      PlaybackScheduler.queue.length = 0;
      running = false; firstBeatTime = 0;
      view.clearBeats();
    }
    function stop(completed, fromVideo){
      running = false;
      armKind = null; VideoSync.cancel();
      recording = false;
      if(!fromVideo) VideoGateway.pause();
      if(cancelTimer){ cancelTimer(); cancelTimer = null; }
      PlaybackScheduler.queue.length = 0;
      PlaybackService.clear();                     // timeline（singleton state）を破棄
      view.clearBeats();
      cur = {gid:null, bar:-1, rep:0};
      Store.apply({activeId: resumeActiveId});     // 再生前に開いていたグループへ戻す
      resumeActiveId = null;
      view.render();
      view.setRunning(false);
      view.clearWaiting();
      firstBeatTime = 0;
      mode = "all"; soloId = null;
      view.status(completed ? "完了" : "停止中");
      PlaybackScheduler.resetPointer();
      view.syncIdle();
      view.updateTransport();
      view.padUpdate();
    }
    /* --- 再生の入口：動画があれば、動画が実際に鳴り出してから刻み始める --- */
    function start(kind){
      if(kind !== "all" && !soloTarget()) return;
      if(kind === "all" && !PlaybackScheduler.plan().length) return;
      const cue = cueOf(kind);
      // 全体レック／cue 未記録の全体再生は先頭(0秒)から（従来どおり・preroll あり）。頭出しへは即入る（0.15s の間は廃止）
      if(VideoGateway.armed() && kind === "all" && (recording || cue == null)){
        armKind = kind;
        view.updateTransport();
        VideoSync.startFromTop(kind);
        return;
      }
      // 全体（cue記録済み）／グループ再生は記録した位置から合わせる（cue−補正へ寄せ、実到達フレームで刻む）
      if(VideoGateway.armed() && cue != null){
        armKind = kind;
        view.updateTransport();
        VideoSync.startAtCue(kind, cue);
        return;
      }
      if(VideoGateway.armed()){
        armKind = kind;
        view.updateTransport();
        pendingKind = kind;
        view.videoMsg("動画の再生を待っています…", false);
        try{ VideoGateway.play(); }catch(err){ pendingKind = null; armKind = null; beginPlayback(kind); return; }
        clearTimeout(waitTimer);
        waitTimer = setTimeout(()=>{                 // 反応がなければ単体で始める
          if(pendingKind){ const k = pendingKind; pendingKind = null; armKind = null; view.videoMsg("動画の応答がないため、メトロノームだけ始めます", true); beginPlayback(k); }
        }, 4000);
        return;
      }
      beginPlayback(kind, kind === "all" ? {lead: IMMEDIATE_LEAD} : null);   // 動画なしの即時全体再生は約1秒後から
    }
    function armCancel(){
      armKind = null; VideoSync.cancel(); pendingKind = null;
      recording = false;
      clearTimeout(waitTimer);
      VideoGateway.pause();
      view.videoMsg("", false);
      view.status("停止中");
      view.updateTransport();
      view.padUpdate();
    }
    function startRec(){
      if(running || armKind){ stop(false); return; }       // レック中はトグルで停止
      if(!VideoGateway.ready()){ view.videoMsg("動画を読み込むと全体レックが使えます", true); return; }
      if(!PlaybackScheduler.plan().length) return;
      HistoryService.commit();                    // レック1回ぶんをまとめて1手の履歴にする
      recording = true;
      start("all");                // 全体レックは常に全体再生・動画は先頭から
    }
    function wake(){ if(running && SoundGateway.ready) schedulerTick(); }
    // VideoGateway からの状態通知
    function onVideoPlaying(){
      if(pendingKind){
        const k = pendingKind; pendingKind = null; armKind = null;
        clearTimeout(waitTimer);
        view.videoMsg("", false);
        beginPlayback(k);                    // 動画が鳴り出した瞬間に刻み始める
      }
    }
    function onVideoStopped(){
      clearTimeout(waitTimer); pendingKind = null;
      if(running && VideoGateway.syncOn()) stop(false, true);   // 動画を止めたら刻みも止まる
    }

    return {
      init(o){ view = o.view || view; },
      running: () => running,
      isSolo: () => isSoloMode(mode),
      mode: () => mode,
      soloId: () => soloId,
      armKind: () => armKind,
      recording: () => recording,
      cur: () => cur,
      soloTarget, countInFor,
      clearArm(){ armKind = null; },
      clearPending(){ pendingKind = null; },
      halt,
      start, stop, startRec, beginPlayback, armCancel, wake, onVideoPlaying, onVideoStopped
    };
  })();

  /* ---------- VideoPadService（再生パッドの統括：動画マスター、メトロノームは付随してフィット） ----------
     パッドの役割は「動画をシームレスに ±5秒／再生／一時停止する」だけ。VideoGateway（動画）を操作し、
     PlaybackService(timeline) の indexAtVideo で「今の動画位置に一致する拍」を引き当て、
     あとは **ボタン再生と同じ VideoSync.startAtIndex → pollCue → beginPlayback** に委ねて刻み直す
     （空白判定＝実再生フレーム待ち・遅延補正・overshoot 前倒しをボタンと完全共有）。ここは統括のみ。 */
  const VideoPadService = (() => {
    let paused = false;
    let jumpPending = false;               // シーク/再開を要求してから実際に鳴り出すまで
    let view = { padUpdate(){}, setRunning(){}, status(){}, updateTransport(){} };

    function ensureTimeline(){ if(!PlaybackService.ready()) PlaybackService.update("all", null); }
    // 鳴り出したら（Transport.running）自動的に解除。到達待ちの間だけ true。
    function busy(){ if(jumpPending && Transport.running()) jumpPending = false; return jumpPending; }
    // 動画位置 videoTime に一致する拍へフィット（無ければ動画だけ動かす）
    function fitAt(videoTime){
      ensureTimeline();
      const target = Math.max(0, videoTime);
      const index = PlaybackService.indexAtVideo(target);   // ★真の動画時刻から引く（compensate 後ではない）
      Transport.halt();                    // run ループだけ止める（lamp は保持＝シークのちらつき防止）
      if(PlaybackService.at(index)){
        jumpPending = true;
        VideoSync.startAtIndex(index);     // ボタンと同じ poll→beginPlayback 経路（index 指定・resume）
      }else{                               // 対象拍なし（曲末尾より後）：動画だけ動かしメトロノームは止めたまま
        jumpPending = false;
        try{ VideoGateway.seekTo(target, true); }catch(err){}
      }
      view.padUpdate();
    }

    return {
      init(o){ if(o && o.view) view = o.view; },
      isPaused: () => paused,
      isBusy: () => busy(),
      ready: () => VideoGateway.ready(),
      // セッション中（再生 or 一時停止）で着地待ちでないときだけシーク/トグルを受ける
      active: () => (Transport.running() || paused) && !busy(),
      // 左右パッド：合算済みの量を1回で。現在動画位置 ± delta へ寄せてフィット。
      seekBy(deltaSec){
        if(busy() || !VideoGateway.ready()) return;
        if(!Transport.running() && !paused) return;      // セッションが無いときは無視（開始は中央/ボタンで）
        let t = 0; try{ t = VideoGateway.time(); }catch(err){ return; }
        if(t == null || isNaN(t)) t = 0;
        let dur = 0; try{ dur = VideoGateway.duration(); }catch(err){}
        let target = t + deltaSec;
        if(target < 0) target = 0;
        if(dur > 0 && target > dur - 0.1) target = Math.max(0, dur - 0.1);
        paused = false;
        fitAt(target);
      },
      // 中央：一時停止／再開（動画マスター。メトロノームは付随）。停止中は現在位置から開始。
      togglePause(){
        if(busy() || !VideoGateway.ready()) return;
        if(Transport.running() && !paused){              // 再生中 → 一時停止（動画もメトロノームも止める）
          Transport.halt();
          try{ VideoGateway.pause(); }catch(err){}
          paused = true;
          view.setRunning(false); view.status("一時停止"); view.updateTransport(); view.padUpdate();
          return;
        }
        let t = 0; try{ t = VideoGateway.time(); }catch(err){}   // 一時停止中 / 停止中 → 現在位置から再開
        if(t == null || isNaN(t)) t = 0;
        paused = false;
        fitAt(t);
      }
    };
  })();


  /* ========================================================================
     ui … DOM のみ。責務ごとにビュー部品へ分割し、操作は各サービス／Transport を呼び、
     状態変化は Store.subscribe と Transport の view コールバックを購読して再描画する。
     ビジネスロジックは持たない。エンティティ階層に沿った分割：
       RhythmView   … 1拍子（チップ／編集行）      ← Rhythm
       PatternView  … 拍子の並び＋追加ピッカー      ← RhythmPattern
       GroupView    … グループのカード＋動画位置     ← RhythmGroup
       SequenceView … グループ一覧・サマリー・名前・履歴・並び替え ← Sequence
     ほかは責務ごとに TempoView / TransportView / IoView / VideoView へ分割。
     ======================================================================== */

  // ---- 共有の DOM 参照 ----
  const bpmView=$("bpmView"), termView=$("termView"), range=$("tempoRange"), input=$("tempoInput");
  const groupsEl=$("groups"), beatsEl=$("beats"), pulseView=$("pulseView");
  const statusText=$("statusText"),
        prerollInput=$("prerollInput"), prerollCount=$("prerollCount"), leadEl=$("lead"), recBtn=$("recBtn");
  const seqSum=$("seqSum"), undoBtn=$("undoBtn"), redoBtn=$("redoBtn"), addGroupBtn=$("addGroupBtn");
  const seqNameEl=$("seqName");
  const pbPlay=$("pbPlay"), pbSeekL=$("pbSeekL"), pbSeekR=$("pbSeekR"),
        pbPlayGlyph=$("pbPlayGlyph"), pbPlaySub=$("pbPlaySub");
  const saveBtn=$("saveBtn"), loadBtn=$("loadBtn"), ioFileLabel=$("ioFileLabel"),
        ioFile=$("ioFile"), ioMsg=$("ioMsg");
  const ytUrl=$("ytUrl"), ytLoad=$("ytLoad"), ytSync=$("ytSync"), ytClear=$("ytClear"), ytMsg=$("ytMsg");

  // ---- 共有ヘルパ ----
  const state = () => Store.getState();
  const findGroup = id => Store.findGroup(id);
  let focusHandleId = null;                   // 並び替え後にフォーカスするハンドル
  // 表示用の整形（純粋）
  const Fmt = {
    time(sec){
      if(sec == null) return "—";
      const m = Math.floor(sec / 60), r = sec - m * 60;
      return m + ":" + (r < 10 ? "0" : "") + r.toFixed(2);
    },
    times(g){ return "×" + g.reps; },
    bpm(b){ return Number.isInteger(b) ? String(b) : b.toFixed(1); }   // 小数BPM（例 175.5）は1桁表示
  };
  function mini(label, aria, disabled, fn){
    const b=document.createElement("button");
    b.type="button"; b.className="mini"; b.textContent=label;
    b.setAttribute("aria-label",aria); b.disabled=disabled;
    b.addEventListener("click", fn);
    return b;
  }

  /* 再生ペイン（編集／再生モード）は廃止。常に編集ビューで、再生操作は下部固定バー（PlaybarView）と
     各グループカード内のボタンから行う。 */

  /* ---------- RhythmView（リズム：1拍子の描画） ---------- */
  const RhythmView = {
    chip(b, bi){                               // 折りたたみ時の拍子チップ
      const c = document.createElement("span");
      c.className = "chip"; c.dataset.bi = bi;
      c.textContent = b.num + "/" + b.den;
      return c;
    },
    barRow(g, b, bi){                          // 展開時の編集行（上下移動・削除つき）
      const rowb = document.createElement("div");
      rowb.className = "bar"; rowb.dataset.bi = bi;
      const sig = document.createElement("span");
      sig.className = "bar-sig";
      sig.innerHTML = b.num + ' <em>/</em> ' + b.den;
      const ctl = document.createElement("span");
      ctl.className = "bar-ctl";
      ctl.appendChild(mini("↑","上へ移動", bi===0, ()=>PatternService.moveRhythm(g.id,bi,-1)));
      ctl.appendChild(mini("↓","下へ移動", bi===g.pattern.rhythms.length-1, ()=>PatternService.moveRhythm(g.id,bi,1)));
      const k = mini("✕","削除", false, ()=>PatternService.removeRhythm(g.id,bi));
      k.classList.add("kill");
      ctl.appendChild(k);
      rowb.append(sig, ctl);
      return rowb;
    }
  };

  /* ---------- PatternView（リズムパターン：拍子の並びの編集 ＋ 追加ピッカー） ---------- */
  const PatternView = {
    bars(g){
      const bars = document.createElement("div");
      bars.className = "bars";
      if(!g.pattern.rhythms.length){
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "下の拍子を追加すると、この順に鳴らします。";
        bars.appendChild(p);
      }
      g.pattern.rhythms.forEach((b,bi)=> bars.appendChild(RhythmView.barRow(g, b, bi)));
      return bars;
    },
    picker(g){
      const wrap = document.createElement("div");
      wrap.className = "g-add";
      const nSel = document.createElement("select");
      nSel.setAttribute("aria-label","分子");
      const dSel = document.createElement("select");
      dSel.setAttribute("aria-label","分母");
      Domain.DENOMS.forEach(d=>{
        const o=document.createElement("option"); o.value=d; o.textContent=d; dSel.appendChild(o);
      });
      dSel.value = String(state().pickDen);

      function fillNum(){
        nSel.innerHTML = "";
        for(let i=1;i<=Domain.NUM_MAX;i++){
          const o=document.createElement("option"); o.value=i; o.textContent=i; nSel.appendChild(o);
        }
        const pn = Math.min(state().pickNum, Domain.NUM_MAX);
        RhythmService.setPicker(pn, null);
        nSel.value = String(pn);
      }
      fillNum();

      dSel.addEventListener("change", ()=>{ RhythmService.setPicker(null, Number(dSel.value)); fillNum(); TransportView.syncIdle(); });
      nSel.addEventListener("change", ()=>{ RhythmService.setPicker(Number(nSel.value), null); TransportView.syncIdle(); });

      const slash = document.createElement("span");
      slash.className="slash"; slash.textContent="/";
      const add = document.createElement("button");
      add.type="button"; add.className="step"; add.textContent="追加";
      add.addEventListener("click", ()=>PatternService.addRhythm(g.id, state().pickNum, state().pickDen));
      wrap.append(nSel, slash, dSel, add);
      return wrap;
    }
  };

  /* ---------- GroupView（リズムグループ：カード1枚 ＋ 動画位置コントロール） ---------- */
  const GroupView = (() => {
    let nudgeId = null, nudgeAt = 0;   // 微調整の連打を1手の履歴にまとめる

    function nudge(g, delta, label){
      const b = document.createElement("button");
      b.type = "button"; b.className = "nudge";
      b.textContent = delta < 0 ? "−" : "＋";
      b.title = Math.abs(delta) + "秒" + (delta < 0 ? "もどす" : "すすめる");
      b.setAttribute("aria-label", b.title);
      b.disabled = Transport.recording();                  // 全体レック中はタイムコード調整を止める
      b.addEventListener("click", e=>{
        e.stopPropagation();
        const now = Date.now();
        if(!(nudgeId === g.id && now - nudgeAt < 2500)) HistoryService.commit();
        nudgeId = g.id; nudgeAt = now;
        const nv = Math.max(0, Math.round((g.cue + delta) * 100) / 100);
        GroupService.nudgeCue(g.id, nv);
        label.textContent = Fmt.time(nv);      // 構造は変わらないので再描画しない
      });
      return b;
    }
    /* いまの動画位置をこのグループに記録する REC（●）ボタン */
    function cueGrabButton(g){
      const grab = document.createElement("button");
      grab.type = "button"; grab.className = "grab"; grab.textContent = "●";
      grab.title = "いまの動画の再生位置をこのグループに記録（グループ再生の頭出しに使います）";
      grab.setAttribute("aria-label", "動画の現在位置を記録");
      grab.disabled = !VideoGateway.ready() || Transport.recording();   // 全体レック中は個別レックを止める
      grab.addEventListener("click", e=>{
        e.stopPropagation();
        if(!VideoGateway.ready()) return;
        let t = null;
        try{ t = VideoGateway.time(); }catch(err){}
        if(t == null || isNaN(t)) return;
        GroupService.setCue(g.id, Math.round(t*100)/100);
      });
      return grab;
    }
    /* アクティブ側の「動画位置」行：REC ● ＋ 00:00 ＋ ± ＋ ✕（全REC でも自動取得） */
    function cueControls(g){
      const box = document.createElement("span");
      box.className = "g-cue";
      box.appendChild(cueGrabButton(g));
      const at = document.createElement("span");
      at.className = "g-at" + (g.cue == null ? " none" : "");
      at.textContent = Fmt.time(g.cue);
      at.title = g.cue == null ? "動画位置は未設定" : "グループ再生のとき、この位置から再生します";
      if(g.cue != null){
        box.appendChild(nudge(g, -0.05, at));
        box.appendChild(at);
        box.appendChild(nudge(g, 0.05, at));
        const clr = mini("✕", "動画位置を解除", Transport.recording(), ()=>GroupService.setCue(g.id, null));
        clr.classList.add("kill");
        clr.style.width = "22px"; clr.style.height = "22px"; clr.style.fontSize = "9px";
        clr.addEventListener("click", e=>e.stopPropagation());
        box.appendChild(clr);
      }else{
        box.appendChild(at);
      }
      return box;
    }

    function card(g, gi){
      const st = state();
      const running = Transport.running();
      const active = g.id === st.activeId;        // 選択＝展開して編集。単体再生（solo/lead）の対象でもある
      const expanded = active;
      const card = document.createElement("article");
      card.className = "group" + (active ? " active selected" : "");
      card.dataset.id = g.id;
      card.tabIndex = 0;

      /* header */
      const head = document.createElement("div");
      head.className = "g-head";

      {                                          // 並び替えハンドル（常時。再生中のみ無効）
        const handle = document.createElement("button");
        handle.type = "button"; handle.className = "handle"; handle.textContent = "⠿";
        handle.setAttribute("aria-label", "並び替え（ドラッグ、または上下キー）");
        handle.disabled = running;
        handle.addEventListener("pointerdown", e=>SequenceView.startDrag(e, gi, card));
        handle.addEventListener("keydown", e=>{
          if(e.key === "ArrowUp"){ e.preventDefault(); SequenceService.moveGroup(gi, gi-1); }
          if(e.key === "ArrowDown"){ e.preventDefault(); SequenceService.moveGroup(gi, gi+1); }
        });
        head.appendChild(handle);
      }

      if(expanded){
        const name = document.createElement("input");
        name.className = "g-name"; name.type = "text"; name.value = g.name;
        name.setAttribute("aria-label", "リズムグループ名");
        let typing = false;
        name.addEventListener("focus", ()=>{ typing = false; });
        name.addEventListener("blur", ()=>{ typing = false; });
        name.addEventListener("input", e=>{
          if(!typing){ HistoryService.commit(); typing = true; }   // 連続入力は1回分の履歴にまとめる
          GroupService.setName(g.id, e.target.value);
        });
        head.appendChild(name);

        /* グループ個別 BPM（名前とコピー/削除の間にインライン配置）。空欄＝基準テンポに追従、
           値を入れるとその区間だけ固定。プレースホルダに基準値を出して「空欄で何に追従するか」を示す */
        {
          const bp = document.createElement("span");
          bp.className = "g-hbpm";
          bp.addEventListener("click", e=>e.stopPropagation());   // ラベル部クリックで折りたたまないように
          const u = document.createElement("span"); u.className = "u"; u.textContent = "bpm";
          const baseTxt = Number.isInteger(st.bpm) ? String(st.bpm) : st.bpm.toFixed(1);
          const bin = document.createElement("input");
          bin.type = "number"; bin.min = String(Domain.MIN); bin.max = String(Domain.MAX);
          bin.step = "0.1"; bin.inputMode = "decimal";
          bin.value = (g.bpm != null) ? g.bpm : "";
          bin.placeholder = baseTxt;
          bin.disabled = running;
          bin.title = "このグループのBPM。空欄にすると基準テンポ（" + baseTxt + "）に追従します";
          bin.setAttribute("aria-label", "このリズムグループのBPM（空欄で基準テンポに追従）");
          bin.addEventListener("change", ()=>GroupService.setBpm(g.id, bin.value));
          bp.append(u, bin);
          head.appendChild(bp);
        }

        const acts = document.createElement("span");
        acts.className = "g-actions";
        acts.appendChild(mini("⧉","このリズムグループを複製", false, ()=>SequenceService.duplicateGroup(g.id)));
        const del = mini("✕","このリズムグループを削除", st.groups.length <= 1, ()=>SequenceService.removeGroup(g.id));
        del.classList.add("kill");
        acts.appendChild(del);
        head.appendChild(acts);
      }else{
        const title = document.createElement("span");
        title.className = "g-title";
        title.textContent = g.name;
        head.appendChild(title);

        // このブロックの実効BPM（g.bpm があればそれ、無ければ基準テンポに追従）をタイトルと同じ行に右寄せ表示。
        // ヘッダーの flex 行に入れることで、タイトルと横（右寄せ）だけでなく縦（中央）も揃う
        const own = g.bpm != null;
        const bpmTag = document.createElement("span");
        bpmTag.className = "g-bpm-tag" + (own ? " own" : "");
        bpmTag.dataset.role = "bpm";
        bpmTag.title = own ? "このグループ固有のBPM" : "基準テンポ（" + Fmt.bpm(st.bpm) + "）に追従中のBPM";
        const bpmLabel = document.createElement("span"); bpmLabel.textContent = "bpm";
        const bpmVal = document.createElement("b"); bpmVal.className = "v"; bpmVal.textContent = Fmt.bpm(Domain.effectiveBpm(g, st.bpm));
        bpmTag.append(bpmLabel, bpmVal);
        head.appendChild(bpmTag);
      }
      card.appendChild(head);

      /* collapsed summary */
      if(!expanded){
        const sub = document.createElement("div");
        sub.className = "g-sub";
        if(!g.pattern.rhythms.length){
          const c = document.createElement("span");
          c.className = "chip none"; c.textContent = "拍子なし";
          sub.appendChild(c);
        }else{
          g.pattern.rhythms.forEach((b,bi)=> sub.appendChild(RhythmView.chip(b, bi)));
        }
        const times = document.createElement("span");
        times.className = "g-times"; times.dataset.role = "times";
        times.title = "再生回数";
        times.textContent = Fmt.times(g);
        sub.appendChild(times);          // ×N は従来どおり拍子チップ行に右寄せ（変更なし）
        card.appendChild(sub);
      }

      /* active body */
      if(expanded){
        const body = document.createElement("div");
        body.className = "g-body";

        const crow = document.createElement("div");
        crow.className = "g-row";
        const clab = document.createElement("span");
        clab.className = "g-label"; clab.textContent = "動画位置";
        crow.append(clab, cueControls(g));   // 00:00 と ± はアクティブ側・再生回数の上に
        body.appendChild(crow);

        const row = document.createElement("div");
        row.className = "g-row";
        const lab = document.createElement("span");
        lab.className = "g-label"; lab.textContent = "再生回数";
        const reps = document.createElement("div");
        reps.className = "g-reps";
        // × [N] の左に現在の周回。停止中は「1」、solo 再生中は highlight() がライブ更新（1 × 8 の形）
        const now = document.createElement("span");
        now.className = "g-repnow"; now.dataset.role = "repnow";
        now.title = "現在の周回";
        const soloNow = running && Transport.mode() === "solo" && Transport.soloId() === g.id;
        now.textContent = soloNow ? (Transport.cur().rep + 1) : 1;
        const x = document.createElement("span"); x.className="x"; x.textContent="×";
        const rin = document.createElement("input");
        rin.type="number"; rin.min="1"; rin.max="999"; rin.value=g.reps;
        rin.setAttribute("aria-label","再生回数");
        rin.addEventListener("change", ()=>GroupService.setReps(g.id, rin.value));
        reps.append(now, x, rin);
        row.append(lab, reps);
        body.appendChild(row);

        body.appendChild(PatternView.bars(g));
        body.appendChild(PatternView.picker(g));

        /* グループ再生（solo）トグル。展開したこのグループを対象に再生し、再生中もこのカードは畳まず、
           同じボタンで停止できる（対象＝soloTarget()=activeId＝このグループ）。裏側は全体再生と同じ Transport。 */
        const prow = document.createElement("div");
        prow.className = "g-row g-play";
        const hasBars = g.pattern.rhythms.length > 0;
        const busy = running || !!Transport.armKind();       // 何か再生／準備中
        // このカード（＝activeId のグループ）が solo で稼働中か。稼働中はボタンを「停止」トグルに
        const soloOn = (running && Transport.mode() === "solo" && Transport.soloId() === g.id) || Transport.armKind() === "solo";

        const solo = document.createElement("button");
        solo.type = "button"; solo.className = "g-solo";
        solo.textContent = soloOn ? "停止" : "グループ再生";
        solo.classList.toggle("on", soloOn);
        solo.disabled = soloOn ? false : (busy || !hasBars);
        solo.title = soloOn ? "停止" : hasBars ? "このリズムグループだけを再生" : "拍子を1つ以上追加してください";
        solo.addEventListener("click", ()=> Transport.armKind() ? Transport.armCancel()
                             : (Transport.running() ? Transport.stop(false) : Transport.start("solo")));
        prow.appendChild(solo);
        body.appendChild(prow);
        card.appendChild(body);
      }

      card.addEventListener("click", e=>{
        if(Transport.running()) return;                       // 再生中は編集に入らない
        if(e.target.closest("input, select, button")) return;
        SequenceService.toggleActive(g.id);
      });
      card.addEventListener("keydown", e=>{
        if(Transport.running()) return;
        if(e.key === "Enter" && !e.target.closest("input, select, button")){
          e.preventDefault();
          SequenceService.toggleActive(g.id);
        }
      });
      return card;
    }

    /* 全体レックで書き込んだ cue を、再描画せず表示だけ差し替える */
    function stampCueView(gid, cue){
      const el = groupsEl.querySelector('[data-id="' + gid + '"]');
      const at = el && el.querySelector(".g-at");
      if(at){
        at.textContent = Fmt.time(cue);
        at.classList.remove("none");
        at.classList.add("hit");
      }
    }
    return { card, stampCueView };
  })();

  /* ---------- SequenceView（シーケンス：グループ一覧・サマリー・名前・履歴・並び替え） ---------- */
  const SequenceView = (() => {
    /* ドラッグ並び替え */
    let drag = null;
    function startDrag(e, index, card){
      if(Transport.running() || state().groups.length < 2) return;
      e.preventDefault();
      const cards = [...groupsEl.children];
      drag = {
        index, card, target:index, startY:e.clientY,
        rects: cards.map(c=>c.getBoundingClientRect()),
        pid: e.pointerId
      };
      e.currentTarget.setPointerCapture(e.pointerId);
      card.classList.add("dragging");
      e.currentTarget.addEventListener("pointermove", onDragMove);
      e.currentTarget.addEventListener("pointerup", endDrag);
      e.currentTarget.addEventListener("pointercancel", endDrag);
    }
    function onDragMove(e){
      if(!drag) return;
      drag.card.style.transform = "translateY(" + (e.clientY - drag.startY) + "px)";
      let t = 0;
      drag.rects.forEach((r,i)=>{
        if(i !== drag.index && e.clientY > r.top + r.height/2) t++;
      });
      drag.target = t;
      const cards = [...groupsEl.children].filter((c,i)=>i !== drag.index);
      cards.forEach(c=>c.classList.remove("drop-before","drop-after"));
      if(cards.length){
        if(t < cards.length) cards[t].classList.add("drop-before");
        else cards[cards.length-1].classList.add("drop-after");
      }
    }
    function endDrag(e){
      if(!drag) return;
      const el = e.currentTarget;
      el.removeEventListener("pointermove", onDragMove);
      el.removeEventListener("pointerup", endDrag);
      el.removeEventListener("pointercancel", endDrag);
      drag.card.style.transform = "";
      drag.card.classList.remove("dragging");
      const from = drag.index, to = drag.target;
      drag = null;
      SequenceService.moveGroup(from, to);
      render();
    }

    function summary(){
      const c = Domain.summaryCounts(state().groups);
      seqSum.textContent = c.groups + " グループ ・ 全 " + c.bars + " 小節";
    }
    function applyTitle(){
      const unsaved = DraftService.isDirty();
      document.title = (unsaved ? "*" : "") + (state().seqName.trim() || "無題のシーケンス") + " — メトロノーム";
      saveBtn.classList.toggle("unsaved", unsaved);
    }
    function updateHistory(){
      undoBtn.disabled = !HistoryService.canUndo() || Transport.running();
      redoBtn.disabled = !HistoryService.canRedo() || Transport.running();
    }

    function render(){
      const running = Transport.running();
      const st = state();
      groupsEl.innerHTML = "";
      groupsEl.classList.toggle("locked", running);
      addGroupBtn.disabled = running;
      seqNameEl.disabled = running;
      prerollInput.disabled = running;
      leadEl.classList.toggle("na", running && Transport.isSolo());
      VideoView.updateLock();

      st.groups.forEach((g, gi)=> groupsEl.appendChild(GroupView.card(g, gi)));

      if(focusHandleId){
        const el = groupsEl.querySelector('[data-id="'+focusHandleId+'"] .handle');
        if(el) el.focus();
        focusHandleId = null;
      }
      summary();
      TransportView.update();
      updateHistory();
      TransportView.highlight();
    }

    // 基準テンポ変更時、追従中（own でない）ブロックの折りたたみBPM表示だけ軽く更新（全再描画は避ける）
    function syncBpm(){
      const st = state();
      [...groupsEl.children].forEach(card=>{
        const tag = card.querySelector('[data-role="bpm"]');
        if(!tag || tag.classList.contains("own")) return;   // 固有BPMは基準に追従しないので触らない
        const val = tag.querySelector(".v");
        const g = st.groups.find(x=>x.id === card.dataset.id);
        if(g && val) val.textContent = Fmt.bpm(Domain.effectiveBpm(g, st.bpm));
      });
    }

    function afterRestore(){      // undo/redo 後の再同期
      seqNameEl.value = state().seqName;
      applyTitle();
      render();
      TransportView.syncIdle();
    }

    function bind(){
      let typing = false;
      seqNameEl.addEventListener("focus", ()=>{ typing = false; });
      seqNameEl.addEventListener("blur", ()=>{
        typing = false;
        if(!seqNameEl.value.trim()){ SequenceService.setName("無題のシーケンス"); seqNameEl.value = "無題のシーケンス"; }
      });
      seqNameEl.addEventListener("input", e=>{
        if(!typing){ HistoryService.commit(); typing = true; }   // 連続入力は1手にまとめる
        SequenceService.setName(e.target.value);
      });
      addGroupBtn.addEventListener("click", ()=>SequenceService.addGroup());
      undoBtn.addEventListener("click", ()=>HistoryService.undo());
      redoBtn.addEventListener("click", ()=>HistoryService.redo());
    }

    return { startDrag, render, summary, applyTitle, updateHistory, afterRestore, syncBpm, bind };
  })();

  /* ---------- TempoView（テンポ表示と操作） ---------- */
  const TempoView = (() => {
    const fmtBpm = b => Number.isInteger(b) ? String(b) : b.toFixed(1);   // 小数BPMは1桁表示（桁ブレ回避）
    function render(from){
      const bpm = state().bpm;
      bpmView.textContent = fmtBpm(bpm);
      termView.textContent = Domain.termFor(bpm);
      if(from !== "range") range.value = bpm;
      if(from !== "input") input.value = fmtBpm(bpm);
      range.style.setProperty("--p", ((bpm-Domain.MIN)/(Domain.MAX-Domain.MIN)*100)+"%");
    }
    function bind(){
      [50,100,150,200,250].forEach(v=>{
        const el=document.createElement("div");
        el.className="tick"; el.style.left=((v-Domain.MIN)/(Domain.MAX-Domain.MIN)*100)+"%";
        el.innerHTML='<i></i><span>'+v+'</span>'; $("ticks").appendChild(el);
      });
      range.addEventListener("input", e=>SequenceService.setTempo(e.target.value,"range"));
      input.addEventListener("change", e=>SequenceService.setTempo(e.target.value,"input"));
      $("tempoForm").addEventListener("submit", e=>{e.preventDefault();SequenceService.setTempo(input.value,"input");input.blur();});
      document.querySelectorAll(".steps .step").forEach(b=>{
        b.addEventListener("click", ()=>SequenceService.setTempo(state().bpm+Number(b.dataset.delta)));
      });
    }
    return { render, bind };
  })();

  /* ---------- VolumeView（メトロノーム音量。スライダー50%＝既定、0-100%で調整） ---------- */
  const VolumeView = (() => {
    const slider = $("volRange"), valView = $("volVal");
    function apply(pct){
      SoundGateway.setVolume(pct / 50);              // 50%→1.0（既定）、0%→0、100%→2.0
      valView.textContent = pct + "%";
      slider.style.setProperty("--p", pct + "%");    // 塗り（トラック）を値に合わせる
    }
    function bind(){
      slider.addEventListener("input", e => apply(Number(e.target.value)));
      apply(Number(slider.value));                   // 初期値（50%）を反映
    }
    return { bind };
  })();

  /* ---------- TransportView（再生ボタン・状態・拍表示・ハイライト・空白／待機の表示） ---------- */
  const TransportView = (() => {
    function paintBeats(n){
      beatsEl.innerHTML = "";
      for(let i=0;i<n;i++){
        const d = document.createElement("span");
        d.className = "beat" + (i===0 ? " first" : "");
        beatsEl.appendChild(d);
      }
    }
    function showPulse(bar){
      pulseView.innerHTML = '<i>'+bar.num+'/'+bar.den+'</i><span>'+(Domain.NOTE_NAME[bar.den]||("全音符÷"+bar.den))+'</span>';
    }
    function setBeatDot(beat){
      const dots = beatsEl.children;
      for(let i=0;i<dots.length;i++) dots[i].classList.toggle("on", i === beat);
    }
    function clearBeats(){ [...beatsEl.children].forEach(d=>d.classList.remove("on")); }

    function highlight(){
      const running = Transport.running(), cur = Transport.cur();
      [...groupsEl.children].forEach(card=>{
        const g = findGroup(card.dataset.id);
        const on = running && cur.gid === card.dataset.id;
        card.classList.toggle("playing", on);
        card.querySelectorAll("[data-bi]").forEach(n=>{
          n.classList.toggle("now", on && Number(n.dataset.bi) === cur.bar);
        });
        const t = card.querySelector('[data-role="times"]');
        if(t && g){
          t.textContent = on ? (cur.rep+1) + " / " + g.reps : Fmt.times(g);
        }
        // 展開カードの × [N] 左の現在周回も同期。solo 再生中だけ周回を進める
        const rn = card.querySelector('[data-role="repnow"]');
        if(rn && g) rn.textContent = on ? cur.rep+1 : 1;
      });
    }
    function syncIdle(){
      if(Transport.running()) return;
      const gs = PlaybackScheduler.plan();
      const bar = gs.length ? gs[0].pattern.rhythms[0] : {num: state().pickNum, den: state().pickDen};
      paintBeats(bar.num);
      showPulse(bar);
      update();
    }
    function update(){
      const running = Transport.running(), armKind = Transport.armKind(), recording = Transport.recording();
      if(running || armKind){
        recBtn.classList.toggle("on", recording);
        recBtn.textContent = recording ? "■ レック中" : "● REC";
        recBtn.disabled = !recording;
      }else{
        const ready = PlaybackScheduler.plan().length > 0;
        recBtn.classList.remove("on");
        recBtn.textContent = "● REC";
        recBtn.disabled = !ready || !VideoGateway.ready();
        recBtn.title = !VideoGateway.ready() ? "動画を読み込むと使えます"
          : "動画を先頭から流し、各リズムグループの位置を記録します";
      }
      PlaybarView.update();   // 下部固定バー（◁◁ □ ▷▷）の表示・状態を同期
    }
    function status(text){ statusText.textContent = text; }
    function readPreroll(){ return SequenceService.setPreroll(prerollInput.value); }
    // 空白（preroll）待機の表示
    function setRunning(on){ document.body.classList.toggle("running", on); }
    function startWaiting(str){
      document.body.classList.add("waiting");
      leadEl.classList.add("counting");
      statusText.textContent = "待機中";
      prerollCount.hidden = false;
      prerollCount.textContent = str;
    }
    function clearWaiting(){
      document.body.classList.remove("waiting");
      leadEl.classList.remove("counting");
      prerollCount.hidden = true;
    }
    function isWaiting(){ return document.body.classList.contains("waiting"); }
    function endWaiting(base){
      document.body.classList.remove("waiting");
      leadEl.classList.remove("counting");
      prerollCount.hidden = true;
      statusText.textContent = base;
    }
    function prerollTick(str){ prerollCount.textContent = str; }

    function bind(){
      recBtn.addEventListener("click", ()=>Transport.startRec());
      prerollInput.addEventListener("change", ()=>SequenceService.setPreroll(prerollInput.value));
      document.addEventListener("keydown", e=>{
        const mod = e.metaKey || e.ctrlKey;
        if(mod && e.key.toLowerCase() === "z"){
          e.preventDefault();
          e.shiftKey ? HistoryService.redo() : HistoryService.undo();
          return;
        }
        if(mod && e.key.toLowerCase() === "y"){ e.preventDefault(); HistoryService.redo(); return; }
        if(e.code !== "Space") return;
        const t = e.target.tagName;
        if(t==="INPUT" || t==="SELECT" || t==="BUTTON") return;
        e.preventDefault();
        Transport.running() ? Transport.stop(false) : Transport.start("all");
      });
      document.addEventListener("visibilitychange", ()=>Transport.wake());
    }
    return {
      paintBeats, showPulse, setBeatDot, clearBeats, highlight, syncIdle, update, status, readPreroll,
      setRunning, startWaiting, clearWaiting, isWaiting, endWaiting, prerollTick, bind
    };
  })();

  /* ---------- PlaybarView（下部固定の再生バー：◁◁＝5秒戻す／□＝全体再生・停止／▷▷＝5秒送る） ----------
     UI 専用。全画面 HUD 下部コントロール（FullscreenView.center/seek）と同じ挙動をメイン画面へ。
     ◁◁/▷▷ は動画セッション中のみ有効（VideoPadService.seekBy）。□ は動画ありなら一時停止・再開、
     動画なしは全体再生の開始/停止（arm 中はキャンセル）。再生・シークはすべて統括サービスに委ねる。 */
  const PlaybarView = (() => {
    const STEP = 5;                 // 1タップぶんの秒数
    function seek(dir){
      if(!VideoGateway.ready() || !VideoPadService.active()) return;   // 動画あり・セッション中のみ
      SoundGateway.ensure();
      VideoPadService.seekBy(STEP * dir);
    }
    function center(){
      SoundGateway.ensure();
      if(VideoGateway.ready()){ VideoPadService.togglePause(); return; }   // 動画あり：tap-pad / HUD と同じ統括
      if(Transport.armKind()) Transport.armCancel();                       // 動画なし：全体再生の開始/停止
      else Transport.running() ? Transport.stop(false) : Transport.start("all");
    }
    function update(){
      const videoReady = VideoGateway.ready();
      const running = Transport.running(), armed = !!Transport.armKind(), paused = VideoPadService.isPaused();
      const canSeek = videoReady && VideoPadService.active() && !VideoPadService.isBusy();
      pbSeekL.disabled = !canSeek;
      pbSeekR.disabled = !canSeek;
      if(paused){
        pbPlayGlyph.textContent = "play_arrow"; pbPlaySub.textContent = "再開"; pbPlay.classList.remove("on");
      }else if(running || armed){
        pbPlayGlyph.textContent = videoReady ? "pause" : "stop";
        pbPlaySub.textContent   = videoReady ? "一時停止" : "停止";
        pbPlay.classList.add("on");
      }else{
        pbPlayGlyph.textContent = "play_arrow"; pbPlaySub.textContent = "全体再生"; pbPlay.classList.remove("on");
      }
      const ready = PlaybackScheduler.plan().length > 0;
      pbPlay.disabled = !ready && !running && !paused && !armed;   // 拍子が1つも無いときだけ不可
    }
    function bind(){
      pbSeekL.addEventListener("pointerdown", e=>{ e.preventDefault(); seek(-1); });
      pbSeekR.addEventListener("pointerdown", e=>{ e.preventDefault(); seek(1); });
      pbPlay.addEventListener("pointerdown", e=>{ e.preventDefault(); center(); });
    }
    return { update, bind };
  })();

  /* ---------- FullscreenView（横画面の練習HUD。表示のみ・裏側は既存を再利用） ----------
     上=セクションタイムライン（曲のどこを演奏中か）／中央=現在グループのリズムパターンを
     フォーカス帯で表示（現在小節を大きく・分数線入り）＋pulse／下=操作集約。
     再生状態は Transport.cur()/running() を、動画操作は VideoPadService（tap-pad と同じ統括）を
     そのまま利用する。描画フックは Transport の view（paintBeats/showPulse/setBeatDot/highlight/
     syncIdle）経由で受け取り、この HUD にも反映する。 */
  const FullscreenView = (() => {
    const STEP = 5;                         // 1タップぶんの秒数（tap-pad と同じ）
    let opened = false, lastStripKey = "", lastTLKey = "", flashTimer = null;
    let userBrowseUntil = 0, tlBrowseUntil = 0, instantNext = false;   // 手動スワイプ中は自動追従を止める（帯／タイムライン別）／次の中央寄せを即時にする
    const el = {};
    function cache(){
      el.overlay=$("fsOverlay"); el.top=$("fsRep"); el.timeline=$("fsTimeline"); el.track=$("fsTrack");
      el.beats=$("fsBeats"); el.meter=$("fsMeter"); el.rep=$("fsRep");
      el.play=$("fsPlay"); el.playGlyph=$("fsPlayGlyph"); el.playSub=$("fsPlaySub");
      el.seekL=$("fsSeekL"); el.seekR=$("fsSeekR"); el.flash=$("fsFlash");
      el.tapL=$("fsTapL"); el.tapR=$("fsTapR"); el.scrollZone=$("fsScroll");
      el.close=$("fsClose"); el.rotateClose=$("fsRotateClose"); el.btn=$("fsBtn");
    }
    // いま表示すべき文脈：再生中は現在グループ／小節、停止中は選択（or 先頭）グループのプレビュー
    function context(){
      if(Transport.running()){
        const cur = Transport.cur();
        return {running:true, g:findGroup(cur.gid), bar:cur.bar, rep:cur.rep};
      }
      const g = Transport.soloTarget() || state().groups.find(x=>x.pattern.rhythms.length) || null;
      return {running:false, g, bar:0, rep:0};
    }
    function buildTimeline(){
      const groups = state().groups;
      const key = groups.map(g=>g.id+":"+g.name+":"+g.reps+":"+g.pattern.rhythms.length).join("|");
      if(key === lastTLKey) return;
      lastTLKey = key;
      el.timeline.innerHTML = "";
      groups.forEach(g=>{
        const seg=document.createElement("div");
        seg.className="fs-seg"; seg.dataset.id=g.id;
        seg.style.flexGrow = Math.max(1, g.pattern.rhythms.length * g.reps);
        const fill=document.createElement("div"); fill.className="fs-fill";
        const lbl=document.createElement("div"); lbl.className="fs-lbl"; lbl.textContent=g.name;
        seg.appendChild(fill); seg.appendChild(lbl);
        el.timeline.appendChild(seg);
      });
    }
    // 帯の構造キー：グループの並び・名前・拍子。これが変わった時だけ帯を作り直す
    function stripKey(){
      return state().groups
        .map(g=>g.id+":"+g.name+":"+g.pattern.rhythms.map(r=>r.num+"/"+r.den).join(","))
        .join("|");
    }
    // 全グループの拍子を1本の帯に連結（境界にグループ名入りの区切り）。横スクロールで曲全体を辿れる
    function buildStrip(){
      const key = stripKey();
      if(key === lastStripKey) return;
      lastStripKey = key;
      el.track.innerHTML = "";
      state().groups.forEach((g,gi)=>{
        if(gi > 0){
          const sep=document.createElement("div");
          sep.className="fs-gsep";
          const nm=document.createElement("span");
          nm.className="fs-gsep-name"; nm.textContent=g.name;
          sep.appendChild(nm);
          el.track.appendChild(sep);
        }
        g.pattern.rhythms.forEach((r,i)=>{
          const t=document.createElement("div");
          t.className="fs-fbar"; t.dataset.gid=g.id; t.dataset.bi=i;
          t.innerHTML='<div class="fs-fr"><span class="fs-num">'+r.num+'</span><span class="fs-line"></span><span class="fs-den">'+r.den+'</span></div>';
          el.track.appendChild(t);
        });
      });
    }
    // 連結した帯の中から、あるグループの指定小節タイルを探す（区切りは飛ばす）
    function findTile(gid, bar){
      return [...el.track.children].find(t=>
        t.classList.contains("fs-fbar") && t.dataset.gid===gid && +t.dataset.bi===bar) || null;
    }
    // 現在（再生中）／プレビュー（停止中）の小節を帯の中央へ寄せる（横スクロール位置を動かす）。
    // ユーザーがスワイプ中（userBrowseUntil）は追従を止め、覗き見を邪魔しない（force で無視）。
    function centerCurrent(force, instant){
      const ctx = context();
      if(!ctx.g) return;
      if(!force && performance.now() < userBrowseUntil) return;
      const t = findTile(ctx.g.id, ctx.bar) || findTile(ctx.g.id, 0);
      if(!t) return;
      const wrap = el.track.parentElement;
      const left = Math.max(0, t.offsetLeft + t.offsetWidth/2 - wrap.clientWidth/2);
      try{ wrap.scrollTo({left, behavior: instant ? "auto" : "smooth"}); }
      catch(_){ wrap.scrollLeft = left; }
    }
    // ドラッグ終了時、中央に一番近い小節タイルへ吸着（カルーセルのスナップ）。対象タイルを返す
    function snapNearest(){
      const wrap = el.track.parentElement;
      const mid = wrap.scrollLeft + wrap.clientWidth/2;
      let best = null, bestD = Infinity;
      [...el.track.children].forEach(t=>{
        if(!t.classList.contains("fs-fbar")) return;
        const c = t.offsetLeft + t.offsetWidth/2, d = Math.abs(c - mid);
        if(d < bestD){ bestD = d; best = t; }
      });
      if(!best) return null;
      const left = Math.max(0, best.offsetLeft + best.offsetWidth/2 - wrap.clientWidth/2);
      try{ wrap.scrollTo({left, behavior:"smooth"}); }catch(_){ wrap.scrollLeft = left; }
      return best;
    }
    // カルーセルが止まった位置のグループに再生位置（現在グループ）も合わせる。
    //   再生中／準備中 … そのグループへ頭出しして再生を続ける（タイムラインのタップと同じ）
    //   停止中        … そのグループを選択（次の再生ヘッド）し、HUD プレビューを先頭へ寄せ直す
    function jumpToTile(tile){
      if(!tile) return;
      const gid = tile.dataset.gid;
      if(!gid) return;
      if(Transport.running() || Transport.armKind()){
        if(Transport.running() && Transport.cur() && Transport.cur().gid === gid) return;   // 同じグループなら再スタートしない
        playGroup(gid);
      } else {
        if(Store.getState().activeId !== gid) Store.apply({activeId: gid}, {render:true});
        userBrowseUntil = 0;   // 追従を解除し、選択グループの先頭へ寄せ直す
        sync();
      }
    }
    // 上部タイムライン（セクションバー）を、現在セクションが見えるように横スクロール。手動スワイプ中は止める。
    function scrollTimeline(force, instant){
      if(!force && performance.now() < tlBrowseUntil) return;
      const seg = el.timeline.querySelector(".fs-seg.cur");
      if(!seg) return;
      const left = Math.max(0, seg.offsetLeft + seg.offsetWidth/2 - el.timeline.clientWidth/2);
      try{ el.timeline.scrollTo({left, behavior: instant ? "auto" : "smooth"}); }
      catch(_){ el.timeline.scrollLeft = left; }
    }
    function paintBeats(n){
      if(!opened) return;
      el.beats.innerHTML="";
      for(let i=0;i<n;i++){ const d=document.createElement("span"); d.className="fs-beat"+(i===0?" first":""); el.beats.appendChild(d); }
    }
    function showPulse(bar){
      if(!opened) return;
      el.meter.innerHTML='<i>'+bar.num+'/'+bar.den+'</i> · <span>'+(Domain.NOTE_NAME[bar.den]||("全音符÷"+bar.den))+'</span>';
    }
    function setBeatDot(beat){
      if(!opened) return;
      const dots=el.beats.children;
      for(let i=0;i<dots.length;i++) dots[i].classList.toggle("on", i===beat);
    }
    function clearBeats(){ if(!opened) return; [...el.beats.children].forEach(d=>d.classList.remove("on")); }
    function updatePlay(){
      if(!opened) return;
      const hasVideo = VideoGateway.ready();
      const paused = VideoPadService.isPaused(), running = Transport.running();
      const playing = hasVideo ? (running && !paused) : running;
      el.overlay.classList.toggle("is-paused", !playing);
      el.overlay.classList.toggle("is-busy", VideoPadService.isBusy());
      el.playGlyph.innerHTML = playing
        ? '<span class="fs-bars2"><span></span><span></span></span>'
        : '<span class="fs-tri"></span>';
      el.playSub.textContent = hasVideo ? (paused ? "再開" : (running ? "一時停止" : "再生"))
                                        : (running ? "停止" : "再生");
      const canSeek = hasVideo && VideoPadService.active();
      el.seekL.classList.toggle("disabled", !canSeek);
      el.seekR.classList.toggle("disabled", !canSeek);
      el.overlay.classList.toggle("no-seek", !canSeek);   // 左右ハーフのタップも同時に有効/無効
    }
    // タイムライン・フォーカス帯・周回を現在状態に同期（毎バー・開いた時に呼ばれる）
    function sync(){
      if(!opened) return;
      const ctx = context(), groups = state().groups, bar = ctx.bar;
      buildTimeline();
      buildStrip();
      if(!ctx.g){ el.rep.innerHTML=""; return; }
      const gi = groups.indexOf(ctx.g);
      const inst = instantNext; instantNext = false;   // この同期での中央寄せを即時にするか（開いた直後・リサイズ時）
      // フォーカス帯：全グループを連結した帯の中で、現在小節=大・赤／再生済み=薄く
      const idxOf = {}; groups.forEach((g,i)=>{ idxOf[g.id]=i; });
      [...el.track.children].forEach(t=>{
        if(!t.classList.contains("fs-fbar")) return;
        const tgi = idxOf[t.dataset.gid], tb = +t.dataset.bi;
        t.classList.toggle("now", t.dataset.gid===ctx.g.id && tb===bar);
        t.classList.toggle("done", ctx.running && (tgi < gi || (tgi===gi && tb < bar)));
      });
      centerCurrent(false, inst);
      // タイムライン：現在セクション＝赤＋進捗フィル／済み＝薄く
      [...el.timeline.children].forEach((seg,i)=>{
        seg.classList.toggle("cur", i===gi);
        seg.classList.toggle("done", i<gi);
        const fill = seg.querySelector(".fs-fill");
        if(i<gi) fill.style.width="100%";
        else if(i>gi) fill.style.width="0%";
        else{
          const barsLen = ctx.g.pattern.rhythms.length || 1, total = barsLen * ctx.g.reps;
          const done = (ctx.running ? ctx.rep : 0) * barsLen + bar;
          fill.style.width = Math.round((done/total)*100) + "%";
        }
      });
      scrollTimeline(false, inst);   // 現在セクションが ✕ より左に見えるよう追従スクロール
      // 周回カウンタ
      el.rep.innerHTML = '<span>'+(ctx.running ? ctx.rep+1 : 1)+'</span><span class="of"> / '+ctx.g.reps+'</span><span class="u">周</span>';
      // 停止中プレビューは pulse も自前で描く（再生中は Transport の描画フックが担当）
      if(!ctx.running){
        const b = ctx.g.pattern.rhythms[bar] || ctx.g.pattern.rhythms[0];
        if(b){ paintBeats(b.num); showPulse(b); }
      }
      updatePlay();
    }
    function flash(text){
      el.flash.textContent = text; el.flash.classList.add("show");
      if(flashTimer) clearTimeout(flashTimer);
      flashTimer = setTimeout(()=>el.flash.classList.remove("show"), 650);
    }
    function seek(dir){
      if(!VideoGateway.ready() || !VideoPadService.active()) return;   // 動画あり・セッション中のみ
      SoundGateway.ensure();
      flash((dir<0 ? "−" : "＋") + STEP + "秒");
      VideoPadService.seekBy(STEP * dir);
    }
    function center(){
      SoundGateway.ensure();
      if(VideoGateway.ready()) VideoPadService.togglePause();          // 動画あり：tap-pad と同じ統括
      else Transport.running() ? Transport.stop(false) : Transport.start("all");   // 動画なし：全体再生の開始/停止
    }
    // タイムラインのグループをタップ → そのグループの先頭から再生（現状の「グループ再生」と同じヘッド）。
    // 全画面を閉じずにグループ間を飛べる。再生中なら一旦止めてから当該グループで開始する。
    function playGroup(id){
      const g = findGroup(id);
      if(!g || !g.pattern.rhythms.length) return;                     // 空グループは無視
      SoundGateway.ensure();
      if(Transport.running() || Transport.armKind()) Transport.stop(false);
      Store.apply({activeId: id}, {});                                // solo 対象＝このグループ（stop の後に設定）
      Transport.start("solo");
    }
    function open(){
      if(opened) return;
      opened = true; lastStripKey = ""; lastTLKey = "";
      userBrowseUntil = 0; instantNext = true;   // 開いた直後は現在小節へ即時に寄せる
      el.overlay.hidden = false;
      document.body.classList.add("fs-lock");
      try{ if(el.overlay.requestFullscreen) el.overlay.requestFullscreen().catch(()=>{}); }catch(err){}
      try{ if(screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(()=>{}); }catch(err){}
      sync();
    }
    function close(){
      if(!opened) return;
      opened = false;
      el.overlay.hidden = true;
      document.body.classList.remove("fs-lock");
      try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{}); }catch(err){}
      try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(err){}
    }
    function updateEntry(){ if(el.btn) el.btn.hidden = false; }   // 練習モードバーは常時表示
    function bind(){
      cache();
      el.btn.addEventListener("click", open);
      el.close.addEventListener("click", close);
      el.rotateClose.addEventListener("click", close);   // 縦向き（回転案内表示中）でも閉じられるように
      el.seekL.addEventListener("pointerdown", e=>{ e.preventDefault(); seek(-1); });
      el.seekR.addEventListener("pointerdown", e=>{ e.preventDefault(); seek(1); });
      el.tapL.addEventListener("pointerdown", e=>{ e.preventDefault(); seek(-1); });   // 左半分タップ
      el.tapR.addEventListener("pointerdown", e=>{ e.preventDefault(); seek(1); });    // 右半分タップ
      el.play.addEventListener("pointerdown", e=>{ e.preventDefault(); center(); });
      // タイムラインのグループをタップして、そのグループから再生（委譲：再描画でセグメントが作り直されるため）
      el.timeline.addEventListener("click", e=>{
        const seg = e.target.closest(".fs-seg");
        if(seg && seg.dataset.id) playGroup(seg.dataset.id);
      });
      document.addEventListener("keydown", e=>{ if(e.key === "Escape" && opened) close(); });
      window.addEventListener("resize", ()=>{ if(opened){ centerCurrent(true, true); scrollTimeline(true, true); } });

      // 中央 1/3 ゾーンを横ドラッグ → 帯（カルーセル）をスクロール。左右 1/3 のシークとは
      // 領域が分かれるので、スワイプがシークに吸われない。手で動かしている間は自動追従を一時停止し、
      // 指を離したら中央に一番近い小節へ吸着する。
      const strip = el.track.parentElement;
      let drag = null;
      const holdBrowse = ()=>{ userBrowseUntil = performance.now() + 3500; };
      el.scrollZone.addEventListener("pointerdown", e=>{
        drag = {x:e.clientX, sl:strip.scrollLeft};
        holdBrowse();
        try{ el.scrollZone.setPointerCapture(e.pointerId); }catch(_){}
      });
      el.scrollZone.addEventListener("pointermove", e=>{
        if(!drag) return;
        strip.scrollLeft = drag.sl - (e.clientX - drag.x);
        holdBrowse();
      });
      const endDrag = ()=>{ if(!drag) return; drag = null; holdBrowse(); jumpToTile(snapNearest()); };
      el.scrollZone.addEventListener("pointerup", endDrag);
      el.scrollZone.addEventListener("pointercancel", endDrag);
      let wheelTimer = null;
      el.scrollZone.addEventListener("wheel", e=>{
        strip.scrollLeft += (e.deltaX || e.deltaY); holdBrowse();
        clearTimeout(wheelTimer); wheelTimer = setTimeout(()=>jumpToTile(snapNearest()), 220);
      }, {passive:true});

      // 上部タイムライン（セクションバー）も横スワイプで移動でき、手で動かした直後は追従を止める。
      // 軽いタップ（＝そのグループへジャンプ）は click ハンドラで処理するため、ここでは抑止しない。
      let tlTap = null;
      el.timeline.addEventListener("wheel", ()=>{ tlBrowseUntil = performance.now() + 3500; }, {passive:true});
      el.timeline.addEventListener("pointerdown", e=>{ tlTap = {x:e.clientX, y:e.clientY}; });
      el.timeline.addEventListener("pointermove", e=>{ if(tlTap && (Math.abs(e.clientX-tlTap.x) > 8 || Math.abs(e.clientY-tlTap.y) > 8)) tlBrowseUntil = performance.now() + 3500; }, {passive:true});
      el.timeline.addEventListener("pointerup", ()=>{ tlTap = null; });
      el.timeline.addEventListener("pointercancel", ()=>{ tlTap = null; tlBrowseUntil = performance.now() + 3500; });
    }
    return { bind, open, close, updateEntry, updatePlay, paintBeats, showPulse, setBeatDot, clearBeats, sync, isOpen:()=>opened };
  })();

  /* ---------- IoView（保存／読込のメッセージ表示とバインド） ---------- */
  const IoView = (() => {
    let msgTimer = null;
    function say(text, bad){
      ioMsg.textContent = text;
      ioMsg.classList.toggle("bad", !!bad);
      ioMsg.hidden = false;
      clearTimeout(msgTimer);
      msgTimer = setTimeout(()=>{ ioMsg.hidden = true; }, bad ? 9000 : 5000);
    }
    function importAndSay(text){
      try{ const msg = SequenceIO.importText(text); DraftService.markClean(); say(msg, false); }
      catch(err){ say("読み込めませんでした：" + err.message, true); }
    }
    function bind(){
      saveBtn.addEventListener("click", async ()=>{
        const r = await SequenceIO.save();
        if(r){ if(!r.bad) DraftService.markClean(); say(r.message, r.bad); }
      });
      loadBtn.addEventListener("click", async ()=>{
        try{ importAndSay(await FileGateway.open()); }
        catch(err){
          if(err && err.name === "AbortError") return;
          say("ファイルを開けませんでした", true);
        }
      });
      ioFile.addEventListener("change", ()=>{
        const file = ioFile.files && ioFile.files[0];
        if(file) FileGateway.readFile(file).then(importAndSay).catch(()=>say("ファイルを読めませんでした", true));
        ioFile.value = "";
      });
      /* ダイアログが使える環境ではボタン、使えない環境では input[type=file] を出す */
      if(FileGateway.canOpenPicker){
        loadBtn.hidden = false;
        ioFileLabel.hidden = true;
      }
      // ドラッグ＆ドロップ
      let dragDepth = 0;
      document.addEventListener("dragenter", e=>{
        if(!e.dataTransfer || ![...e.dataTransfer.types].includes("Files")) return;
        dragDepth++; document.body.classList.add("dropping");
      });
      document.addEventListener("dragover", e=>{ e.preventDefault(); });
      document.addEventListener("dragleave", ()=>{
        dragDepth = Math.max(0, dragDepth-1);
        if(!dragDepth) document.body.classList.remove("dropping");
      });
      document.addEventListener("drop", e=>{
        e.preventDefault();
        dragDepth = 0; document.body.classList.remove("dropping");
        const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if(file) FileGateway.readFile(file).then(importAndSay).catch(()=>say("ファイルを読めませんでした", true));
      });
    }
    return { say, bind };
  })();

  /* ---------- VideoView（YouTube のメッセージ・ロック・操作） ---------- */
  const VideoView = (() => {
    function ytSay(text, bad){
      ytMsg.textContent = text;
      ytMsg.classList.toggle("bad", !!bad);
      ytMsg.hidden = !text;
    }
    function updateLock(){
      const running = Transport.running();
      ytUrl.disabled = running;
      ytLoad.disabled = running;
      ytClear.disabled = running;
      ytSync.disabled = running;
    }
    function syncEnabled(){ return ytSync.checked; }
    function bind(){
      function applyUrl(){
        const v = VideoGateway.parse(ytUrl.value);
        if(!v){ ytSay("YouTube のURLとして読めませんでした", true); return; }
        VideoGateway.mount(v);
      }
      ytLoad.addEventListener("click", applyUrl);
      ytUrl.addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); applyUrl(); } });
      ytUrl.addEventListener("paste", ()=>setTimeout(applyUrl, 0));
      ytClear.addEventListener("click", ()=>{
        if(Transport.running()) Transport.stop(false);
        VideoGateway.clear();
        Transport.clearPending();
        ytUrl.value = ""; ytSay("", false);
        SequenceView.render();
        PlaybarView.update();
      });
    }
    return { ytSay, updateLock, syncEnabled, bind };
  })();

  /* ---------- 連携：Transport への view（DOM 反映）と Store の購読ディスパッチ ---------- */
  const view = {
    render: SequenceView.render,
    syncIdle: () => { TransportView.syncIdle(); FullscreenView.sync(); },
    updateTransport: () => { TransportView.update(); FullscreenView.updatePlay(); },
    status: TransportView.status,
    videoMsg: VideoView.ytSay,
    setRunning: on => { TransportView.setRunning(on); FullscreenView.updatePlay(); },
    startWaiting: TransportView.startWaiting,
    clearWaiting: TransportView.clearWaiting,
    isWaiting: TransportView.isWaiting,
    endWaiting: TransportView.endWaiting,
    prerollTick: TransportView.prerollTick,
    clearBeats: () => { TransportView.clearBeats(); FullscreenView.clearBeats(); },
    paintBeats: n => { TransportView.paintBeats(n); FullscreenView.paintBeats(n); },
    showPulse: bar => { TransportView.showPulse(bar); FullscreenView.showPulse(bar); },
    highlight: () => { TransportView.highlight(); FullscreenView.sync(); },
    setBeatDot: b => { TransportView.setBeatDot(b); FullscreenView.setBeatDot(b); },
    readPreroll: TransportView.readPreroll,
    stampCueView: GroupView.stampCueView,
    padUpdate: () => { PlaybarView.update(); FullscreenView.updatePlay(); }
  };
  // Store の変更を meta フラグに応じて各ビューへ配る
  function dispatch(meta){
    meta = meta || {};
    if(meta.seqName){ seqNameEl.value = state().seqName; SequenceView.applyTitle(); }
    if(meta.seqTitle){ SequenceView.applyTitle(); }
    if(meta.tempo){ TempoView.render(meta.from); SequenceView.syncBpm(); }
    if(meta.preroll){ prerollInput.value = state().preroll.toFixed(2); }
    if(meta.render){ if(meta.focusHandle != null) focusHandleId = meta.focusHandle; SequenceView.render(); }
    if(meta.idle){ TransportView.syncIdle(); }
  }

  /* ========================================================================
     bootstrap … 各層を配線（infra を usecase に注入、ui を購読登録）して初期描画する。
     ======================================================================== */
  HistoryService.init({
    capture: () => Store.snapshot(),
    apply: s => { Store.restore(s); SequenceView.afterRestore(); },
    onChange: () => SequenceView.updateHistory()
  });
  VideoGateway.init({
    onMsg: (text, bad) => VideoView.ytSay(text, bad),
    onReady: () => { VideoView.ytSay("", false); SequenceView.render(); PlaybarView.update(); },
    onPlaying: () => Transport.onVideoPlaying(),
    onStopped: () => Transport.onVideoStopped(),
    syncEnabled: () => VideoView.syncEnabled()
  });
  Transport.init({ view });
  VideoSync.init({ view });
  VideoPadService.init({ view });
  Store.subscribe(dispatch);
  TempoView.bind();
  VolumeView.bind();
  SequenceView.bind();
  TransportView.bind();
  PlaybarView.bind();
  FullscreenView.bind();
  IoView.bind();
  VideoView.bind();

  /* ---------- 初期化 ---------- */
  SequenceView.render();
  TransportView.readPreroll();
  SequenceView.applyTitle();
  SequenceView.updateHistory();
  PlaybarView.update();
  FullscreenView.updateEntry();
  SequenceService.setTempo(120);

  /* ---------- 下書きの自動退避・復元・離脱警告 ---------- */
  const restoredDraft = DraftService.init({ onDirtyChange: () => SequenceView.applyTitle() });
  if(restoredDraft) IoView.say("前回の未保存の編集を復元しました（ファイルにはまだ保存されていません）", false);
  // 未保存のままページを離れようとしたら確認（PC は有効／モバイルはベストエフォート。保全は下書きが担保）
  window.addEventListener("beforeunload", (e)=>{
    if(!DraftService.isDirty()) return;
    e.preventDefault();
    e.returnValue = "";   // 仕様上これで確認ダイアログ（文言はブラウザ既定・カスタム不可）
  });
})();
</script>
</body>
</html>
